<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委外投资业务一体化订单管理平台 - 用户管理</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 14px;
        }
        .tab-item {
            padding: 8px 20px;
            cursor: pointer;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.15s;
        }
        .tab-item:hover { color: var(--primary); }
        .tab-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .org-tree-container {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            max-height: 500px;
            overflow-y: auto;
        }
        .org-node {
            padding: 6px 10px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--font-size-sm);
            transition: background 0.15s;
        }
        .org-node:hover { background: var(--border-light); }
        .org-node.selected { background: rgba(59,130,246,0.1); color: var(--primary); font-weight: 600; }
        .org-node .org-icon { font-size: 14px; }
        .org-children { padding-left: 20px; }
        .permission-group {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
        }
        .permission-group-header {
            padding: 8px 12px;
            background: var(--border-light);
            font-weight: 600;
            font-size: var(--font-size-sm);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .permission-group-body {
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .permission-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
        }
        .permission-item input[type="checkbox"] {
            accent-color: var(--primary);
        }
        .trader-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: rgba(59,130,246,0.1);
            color: var(--primary);
            border-radius: 10px;
            font-size: var(--font-size-xs);
            font-weight: 500;
            margin: 2px;
        }
        .trader-tag .remove-trader {
            cursor: pointer;
            font-weight: bold;
            margin-left: 2px;
        }
        .trader-tag .remove-trader:hover { color: var(--danger); }
        .invest-group-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            background: rgba(20,184,166,0.1);
            color: var(--accent-teal);
            border-radius: 10px;
            font-size: var(--font-size-xs);
            font-weight: 500;
            margin: 2px;
        }
        .resign-tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .resign-tab-item {
            padding: 6px 16px;
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.15s;
        }
        .resign-tab-item:hover { color: var(--primary); }
        .resign-tab-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }
        .resign-tab-panel { display: none; }
        .resign-tab-panel.active { display: block; }
        .resign-resource-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .resign-resource-row:last-child { border-bottom: none; }
        .resign-resource-info { flex: 1; font-size: var(--font-size-sm); }
        .resign-receiver-select {
            width: 160px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-xs);
            margin-left: 10px;
        }
        .row-resigned { opacity: 0.5; }
        .row-resigned td { color: var(--text-muted) !important; }
        .status-resigned { background: #F1F5F9; color: #64748B; }
        .status-disabled { background: #F1F5F9; color: #64748B; }
    </style>
</head>

                    <div class="tab-item" onclick="switchTab('role')">角色管理</div>
                </div>

                        <button class="btn btn-primary" onclick="openOrgModal()">新增组织</button>
                    </div>

                        <div class="card-header"><span class="card-title">组织架构</span></div>

                            <div class="org-tree-container" id="orgTree"></div>
                        </div>
                    </div>
                    <div class="card" id="orgDetailCard" style="display:none;">
                        <div class="card-header"><span class="card-title" id="orgDetailTitle">组织详情</span></div>
                        <div class="card-body" id="orgDetailBody"></div>
                    </div>
                </div>

                <div id="tab-user" class="tab-content">
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick="openUserModal()">新增用户</button>
                    </div>
                    <div class="search-bar">
                        <input type="text" id="userSearch" placeholder="搜索用户名、姓名" class="search-input">
                        <select class="search-input" id="userRoleFilter" style="flex: none; width: 140px;">
                            <option value="">所有角色</option>
                        </select>

                            <table class="data-table">

                                <tbody id="userTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="tab-role" class="tab-content">
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick="openRoleModal()">新增角色</button>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">角色列表</span></div>

                            <table class="data-table">
                                <thead><tr><th>角色ID</th><th>角色名称</th><th>角色标识</th><th>描述</th><th>用户数</th><th>操作</th></tr></thead>
                                <tbody id="roleTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="orgModal" class="modal">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header"><h3 id="orgModalTitle">新增组织</h3></div>
            <div class="modal-body">

                <div class="form-group"><label>组织编码 *</label><input type="text" id="orgCode" placeholder="请输入组织编码"></div>
                <div class="form-group"><label>上级组织</label><select id="orgParent"></select></div>
                <div class="form-group"><label>组织类型</label><select id="orgType"><option value="company">公司</option><option value="department">部门</option><option value="team">团队</option></select></div>
                <div class="form-group"><label>描述</label><textarea id="orgDesc" rows="2" placeholder="请输入组织描述"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeOrgModal()">取消</button>
                <button class="btn btn-primary" onclick="saveOrg()">保存</button>
            </div>
        </div>
    </div>

    <div id="userModal" class="modal">
        <div class="modal-content" style="width: 600px;">

            <div class="modal-body" id="userModalBody"></div>
            <div class="modal-footer" id="userModalFooter"></div>

    <div id="roleModal" class="modal">

            <div class="modal-body" id="roleModalBody"></div>

                <div class="form-group"><label>选择交易员</label>

            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeTraderModal()">关闭</button>
                <button class="btn btn-primary" onclick="saveTraders()">保存</button>

        function switchTab(tab) {
            document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function getOrgName(orgId) {
            var org = orgData.find(function(o) { return o.id === orgId; });
            return org ? org.name : '-';
        }

        function getRoleName(roleId) {
            var role = roleData.find(function(r) { return r.id === roleId; });
            return role ? role.name : '-';
        }

        function getRoleCode(roleId) {
            var role = roleData.find(function(r) { return r.id === roleId; });
            return role ? role.code : '';
        }

        function getUserName(userId) {
            var user = userData.find(function(u) { return u.id === userId; });
            return user ? user.realName : '-';
        }

        function getInvestGroupsForOrg(orgId) {
            return investGroupMap[orgId] || [];
        }

        function renderOrgTree() {
            var container = document.getElementById('orgTree');
            function buildTree(parentId) {
                var children = orgData.filter(function(o) { return o.parentId === parentId; });
                if (children.length === 0) return '';
                var html = '';
                children.forEach(function(org) {
                    var icon = org.type === 'company' ? '🏢' : org.type === 'department' ? '🏛️' : '👥';
                    html += '<div class="org-node" onclick="selectOrg(\'' + org.id + '\')"><span class="org-icon">' + icon + '</span><span>' + org.name + '</span><span style="color:var(--text-muted);font-size:var(--font-size-xs);margin-left:4px;">(' + org.code + ')</span></div>';
                    var sub = buildTree(org.id);
                    if (sub) html += '<div class="org-children">' + sub + '</div>';
                });
                return html;
            }
            container.innerHTML = buildTree('');
        }

        function selectOrg(orgId) {
            document.querySelectorAll('.org-node').forEach(function(n) { n.classList.remove('selected'); });
            event.target.closest('.org-node').classList.add('selected');
            var org = orgData.find(function(o) { return o.id === orgId; });
            if (!org) return;
            var card = document.getElementById('orgDetailCard');
            card.style.display = 'block';
            document.getElementById('orgDetailTitle').textContent = '组织详情 - ' + org.name;
            var members = userData.filter(function(u) { return u.orgId === orgId; });
            var childOrgs = orgData.filter(function(o) { return o.parentId === orgId; });
            var parentOrg = orgData.find(function(o) { return o.id === org.parentId; });
            var html = '<div class="detail-info-grid" style="margin-bottom:12px;">';
            html += '<div class="detail-info-item"><div class="info-label">组织编码</div><div class="info-value">' + org.code + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">组织类型</div><div class="info-value">' + {company:'公司',department:'部门',team:'团队'}[org.type] + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">上级组织</div><div class="info-value">' + (parentOrg ? parentOrg.name : '-') + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">描述</div><div class="info-value">' + (org.desc || '-') + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">下级组织</div><div class="info-value">' + childOrgs.length + ' 个</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">成员数</div><div class="info-value">' + members.length + ' 人</div></div>';
            html += '</div>';
            html += '<div style="display:flex;gap:6px;margin-bottom:10px;"><button class="btn btn-primary btn-sm" onclick="editOrg(\'' + org.id + '\')">编辑</button><button class="btn btn-danger btn-sm" onclick="deleteOrg(\'' + org.id + '\')">删除</button></div>';
            if (members.length > 0) {
                html += '<div class="detail-section-title">组织成员</div>';
                html += '<table class="data-table"><thead><tr><th>用户名</th><th>姓名</th><th>角色</th><th>状态</th></tr></thead><tbody>';
                members.forEach(function(m) {
                    var statusLabel = m.status === 'active' ? '启用' : m.status === 'disabled' ? '已停用' : m.status === 'frozen' ? '禁用' : m.status;
                    var statusClass = m.status === 'active' ? 'status-active' : m.status === 'disabled' ? 'status-disabled' : 'status-frozen';
                    html += '<tr><td>' + m.username + '</td><td>' + m.realName + '</td><td>' + getRoleName(m.roleId) + '</td><td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td></tr>';
                });
                html += '</tbody></table>';
            }
            document.getElementById('orgDetailBody').innerHTML = html;

        function openOrgModal(editId) {
            document.getElementById('orgModalTitle').textContent = editId ? '编辑组织' : '新增组织';
            var parentSelect = document.getElementById('orgParent');
            parentSelect.innerHTML = '<option value="">无（顶级组织）</option>';
            orgData.forEach(function(o) {
                if (o.id !== editId) parentSelect.innerHTML += '<option value="' + o.id + '">' + o.name + '</option>';
            });
            if (editId) {
                var org = orgData.find(function(o) { return o.id === editId; });
                if (org) {
                    document.getElementById('orgName').value = org.name;
                    document.getElementById('orgCode').value = org.code;
                    document.getElementById('orgParent').value = org.parentId;
                    document.getElementById('orgType').value = org.type;
                    document.getElementById('orgDesc').value = org.desc || '';
                }
            } else {
                document.getElementById('orgName').value = '';
                document.getElementById('orgCode').value = '';
                document.getElementById('orgParent').value = '';
                document.getElementById('orgType').value = 'department';
                document.getElementById('orgDesc').value = '';
            }
            document.getElementById('orgModal').style.display = 'block';
        }

        function closeOrgModal() { document.getElementById('orgModal').style.display = 'none'; }

        function saveOrg() {
            var name = document.getElementById('orgName').value;
            var code = document.getElementById('orgCode').value;
            if (!name || !code) { alert('请填写组织名称和编码'); return; }
            alert('组织保存成功！');
            closeOrgModal();
            renderOrgTree();
        }

        function editOrg(orgId) { openOrgModal(orgId); }

        function deleteOrg(orgId) {
            var children = orgData.filter(function(o) { return o.parentId === orgId; });
            var members = userData.filter(function(u) { return u.orgId === orgId; });
            if (children.length > 0 || members.length > 0) { alert('该组织下存在子组织或成员，无法删除'); return; }
            if (!confirm('确定要删除该组织吗？')) return;
            orgData = orgData.filter(function(o) { return o.id !== orgId; });
            document.getElementById('orgDetailCard').style.display = 'none';
            renderOrgTree();
        }

        function renderUserTable() {
            var search = (document.getElementById('userSearch').value || '').toLowerCase();
            var roleFilter = document.getElementById('userRoleFilter').value;
            var filtered = userData.filter(function(u) {
                var matchSearch = !search || u.username.toLowerCase().indexOf(search) >= 0 || u.realName.toLowerCase().indexOf(search) >= 0;
                var matchRole = !roleFilter || u.roleId === roleFilter;
                return matchSearch && matchRole;
            });
            var tbody = document.getElementById('userTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-muted);padding:20px;">暂无用户数据</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map(function(u) {
                var roleCode = getRoleCode(u.roleId);
                var traderHtml = '-';
                if (roleCode === 'investment_manager') {
                    if (u.linkedTraders && u.linkedTraders.length > 0) {
                        traderHtml = u.linkedTraders.map(function(tid) { return '<span class="trader-tag">' + getUserName(tid) + '</span>'; }).join('');
                    } else {
                        traderHtml = '<span style="color:var(--text-muted);">未配置</span>';
                    }
                    traderHtml += ' <button class="btn btn-info btn-sm" style="margin-left:4px;" onclick="openTraderModal(\'' + u.id + '\')">配置</button>';
                }
                var investGroupHtml = '-';
                if (u.investGroups && u.investGroups.length > 0) {
                    investGroupHtml = u.investGroups.map(function(g) { return '<span class="invest-group-tag">' + g + '</span>'; }).join('');
                }
                var statusLabel = u.status === 'active' ? '启用' : u.status === 'disabled' ? '已停用' : u.status === 'frozen' ? '禁用' : u.status;
                var statusClass = u.status === 'active' ? 'status-active' : u.status === 'disabled' ? 'status-disabled' : 'status-frozen';
                var isDisabled = u.status === 'disabled';
                var rowClass = isDisabled ? 'row-resigned' : '';
                var actionsHtml = '';
                if (isDisabled) {
                    actionsHtml = '<button class="btn btn-info btn-sm" onclick="viewUser(\'' + u.id + '\')">查看</button>';
                } else {
                    actionsHtml = '<button class="btn btn-primary btn-sm" onclick="editUser(\'' + u.id + '\')">编辑</button> ';
                    actionsHtml += '<button class="btn btn-' + (u.status === 'active' ? 'danger' : 'success') + ' btn-sm" onclick="toggleUserStatus(\'' + u.id + '\')">' + (u.status === 'active' ? '禁用' : '启用') + '</button> ';
                    if (u.status === 'active') {
                        actionsHtml += '<button class="btn btn-warning btn-sm" onclick="openResignModal(\'' + u.id + '\')">停用账号</button>';
                    }
                }
                return '<tr class="' + rowClass + '"><td>' + u.id + '</td><td>' + u.username + '</td><td>' + u.realName + '</td><td>' + getOrgName(u.orgId) + '</td><td>' + getRoleName(u.roleId) + '</td><td>' + investGroupHtml + '</td><td>' + traderHtml + '</td><td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td><td>' + u.createTime + '</td><td>' + actionsHtml + '</td></tr>';
            }).join('');
        }

        function openUserModal(editId) {
            currentEditUserId = editId;
            document.getElementById('userModalTitle').textContent = editId ? '编辑用户' : '新增用户';
            var orgOptions = '<option value="">请选择组织</option>';
            orgData.forEach(function(o) { orgOptions += '<option value="' + o.id + '">' + o.name + '</option>'; });
            var roleOptions = '<option value="">请选择角色</option>';
            roleData.forEach(function(r) { roleOptions += '<option value="' + r.id + '">' + r.name + '</option>'; });
            var html = '<div class="grid-2" style="gap:10px;">';
            html += '<div class="form-group"><label>用户名 *</label><input type="text" id="editUsername" placeholder="请输入用户名"></div>';
            html += '<div class="form-group"><label>姓名 *</label><input type="text" id="editRealName" placeholder="请输入姓名"></div>';
            html += '<div class="form-group"><label>所属组织 *</label><select id="editUserOrg" onchange="onOrgOrRoleChange()">' + orgOptions + '</select></div>';
            html += '<div class="form-group"><label>角色 *</label><select id="editUserRole" onchange="onOrgOrRoleChange()">' + roleOptions + '</select></div>';
            html += '<div class="form-group"><label>初始密码 *</label><input type="password" id="editPassword" placeholder="' + (editId ? '留空则不修改' : '请输入密码') + '"></div>';
            html += '<div class="form-group"><label>状态</label><select id="editUserStatus"><option value="active">启用</option><option value="frozen">禁用</option></select></div>';
            html += '</div>';
            html += '<div id="investGroupSection" style="display:none;margin-top:10px;"><div class="detail-section-title">投资组分配</div><div id="investGroupConfig"></div></div>';
            html += '<div id="traderConfigSection" style="display:none;margin-top:10px;"><div class="detail-section-title">关联交易员配置</div><div id="userTraderConfig"></div></div>';
            document.getElementById('userModalBody').innerHTML = html;
            document.getElementById('userModalFooter').innerHTML = '<button class="btn btn-ghost" onclick="closeUserModal()">取消</button><button class="btn btn-primary" onclick="saveUser()">保存</button>';
            if (editId) {
                var user = userData.find(function(u) { return u.id === editId; });
                if (user) {
                    document.getElementById('editUsername').value = user.username;
                    document.getElementById('editRealName').value = user.realName;
                    document.getElementById('editUserOrg').value = user.orgId;
                    document.getElementById('editUserRole').value = user.roleId;
                    document.getElementById('editUserStatus').value = user.status === 'disabled' ? 'active' : user.status;
                }
            }
            onOrgOrRoleChange();
            document.getElementById('userModal').style.display = 'block';
        }

        function onOrgOrRoleChange() {
            var roleId = document.getElementById('editUserRole').value;
            var roleCode = getRoleCode(roleId);
            var orgId = document.getElementById('editUserOrg').value;
            var traderSection = document.getElementById('traderConfigSection');
            var investSection = document.getElementById('investGroupSection');

            if (roleCode === 'investment_manager') {
                traderSection.style.display = 'block';
                renderUserTraderConfig(currentEditUserId);
            } else {
                traderSection.style.display = 'none';
            }

            if (roleCode === 'investment_manager' || roleCode === 'trader') {
                investSection.style.display = 'block';
                renderInvestGroupConfig(orgId, currentEditUserId);
            } else {
                investSection.style.display = 'none';
            }
        }

        function renderInvestGroupConfig(orgId, userId) {
            var user = userId ? userData.find(function(u) { return u.id === userId; }) : null;
            var selected = user ? (user.investGroups || []) : [];
            var groups = getInvestGroupsForOrg(orgId);
            var container = document.getElementById('investGroupConfig');
            if (groups.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted);font-size:var(--font-size-xs);padding:8px 0;">当前所属组织无可用投资组，请先选择正确的组织</div>';
                return;
            }
            var html = '<div style="display:flex;flex-wrap:wrap;gap:12px;padding:8px 0;">';
            groups.forEach(function(g) {
                var checked = selected.indexOf(g) >= 0 ? 'checked' : '';
                html += '<label style="display:flex;align-items:center;gap:4px;font-size:var(--font-size-sm);color:var(--text-secondary);cursor:pointer;"><input type="checkbox" class="invest-group-check" value="' + g + '" ' + checked + ' style="accent-color:var(--accent-teal);"> ' + g + '</label>';
            });
            html += '</div>';
            html += '<div style="font-size:var(--font-size-xs);color:var(--text-muted);margin-top:4px;">* 投资组分配为必填，至少选择一个</div>';
            container.innerHTML = html;
        }

        function onRoleChange() {
            onOrgOrRoleChange();
        }

        function renderUserTraderConfig(userId) {
            var user = userId ? userData.find(function(u) { return u.id === userId; }) : null;
            var linked = user ? (user.linkedTraders || []) : [];
            var traders = userData.filter(function(u) { return getRoleCode(u.roleId) === 'trader' && u.status !== 'disabled'; });
            var container = document.getElementById('userTraderConfig');
            var html = '<div class="form-group"><label>选择交易员</label><select id="modalTraderSelect" style="width:100%;"><option value="">请选择交易员</option>';
            traders.forEach(function(t) {
                if (linked.indexOf(t.id) < 0) {
                    html += '<option value="' + t.id + '">' + t.realName + ' (' + t.username + ')</option>';
                }
            });
            html += '</select> <button class="btn btn-info btn-sm" onclick="addTraderInModal()">添加</button></div>';
            html += '<div style="margin-top:8px;"><div class="info-label" style="margin-bottom:4px;">已关联交易员</div><div id="modalLinkedTraders">';
            if (linked.length > 0) {
                linked.forEach(function(tid) {
                    html += '<span class="trader-tag">' + getUserName(tid) + '<span class="remove-trader" onclick="removeTraderInModal(\'' + tid + '\')">×</span></span>';
                });
            } else {
                html += '<span style="color:var(--text-muted);font-size:var(--font-size-xs);">暂未关联交易员</span>';
            }
            html += '</div></div>';
            container.innerHTML = html;
        }

        var tempLinkedTraders = [];

        function addTraderInModal() {
            var sel = document.getElementById('modalTraderSelect');
            if (!sel.value) return;
            var userId = currentEditUserId;
            var user = userId ? userData.find(function(u) { return u.id === userId; }) : null;
            if (user && user.linkedTraders.indexOf(sel.value) < 0) {
                user.linkedTraders.push(sel.value);
            }
            renderUserTraderConfig(userId);
        }

        function removeTraderInModal(traderId) {
            var userId = currentEditUserId;
            var user = userId ? userData.find(function(u) { return u.id === userId; }) : null;
            if (user) {
                user.linkedTraders = user.linkedTraders.filter(function(t) { return t !== traderId; });
            }
            renderUserTraderConfig(userId);
        }

        function closeUserModal() { document.getElementById('userModal').style.display = 'none'; currentEditUserId = null; }

        function saveUser() {
            var username = document.getElementById('editUsername').value;
            var realName = document.getElementById('editRealName').value;
            var orgId = document.getElementById('editUserOrg').value;
            var roleId = document.getElementById('editUserRole').value;
            if (!username || !realName || !orgId || !roleId) { alert('请填写必填项'); return; }
            var roleCode = getRoleCode(roleId);
            var investGroups = [];
            if (roleCode === 'investment_manager' || roleCode === 'trader') {
                var checkboxes = document.querySelectorAll('.invest-group-check:checked');
                checkboxes.forEach(function(cb) { investGroups.push(cb.value); });
                if (investGroups.length === 0) {
                    alert('投资组分配为必填，请至少选择一个投资组');
                    return;
                }
            }
            if (currentEditUserId) {
                var user = userData.find(function(u) { return u.id === currentEditUserId; });
                if (user) {
                    user.username = username;
                    user.realName = realName;
                    user.orgId = orgId;
                    user.roleId = roleId;
                    user.status = document.getElementById('editUserStatus').value;
                    user.investGroups = investGroups;
                }
                alert('用户修改成功！');
            } else {
                var newId = 'USER' + String(userData.length + 1).padStart(3, '0');
                userData.push({
                    id: newId, username: username, realName: realName, orgId: orgId, roleId: roleId,
                    status: document.getElementById('editUserStatus').value, createTime: new Date().toISOString().slice(0, 10), linkedTraders: [], investGroups: investGroups
                });
                alert('用户创建成功！');
            }
            closeUserModal();
            renderUserTable();
        }

        function editUser(userId) { openUserModal(userId); }

        function viewUser(userId) {
            var user = userData.find(function(u) { return u.id === userId; });
            if (!user) return;
            alert('用户信息\n\nID: ' + user.id + '\n用户名: ' + user.username + '\n姓名: ' + user.realName + '\n组织: ' + getOrgName(user.orgId) + '\n角色: ' + getRoleName(user.roleId) + '\n状态: 已停用\n投资组: ' + (user.investGroups && user.investGroups.length > 0 ? user.investGroups.join(', ') : '无') + '\n创建时间: ' + user.createTime);
        }

        function toggleUserStatus(userId) {
            var user = userData.find(function(u) { return u.id === userId; });
            if (!user) return;
            user.status = user.status === 'active' ? 'frozen' : 'active';
            renderUserTable();
        }

        function openTraderModal(userId) {
            currentEditTraderUserId = userId;
            var user = userData.find(function(u) { return u.id === userId; });
            if (!user) return;
            document.getElementById('traderManagerName').textContent = user.realName;
            var traders = userData.filter(function(u) { return getRoleCode(u.roleId) === 'trader' && u.status !== 'disabled'; });
            var sel = document.getElementById('availableTraders');
            sel.innerHTML = '<option value="">请选择交易员</option>';
            traders.forEach(function(t) {
                if (!user.linkedTraders || user.linkedTraders.indexOf(t.id) < 0) {
                    sel.innerHTML += '<option value="' + t.id + '">' + t.realName + ' (' + t.username + ')</option>';
                }
            });
            renderLinkedTraders(user);
            document.getElementById('traderModal').style.display = 'block';
        }

        function renderLinkedTraders(user) {
            var container = document.getElementById('linkedTraders');
            if (!user.linkedTraders || user.linkedTraders.length === 0) {
                container.innerHTML = '<span style="color:var(--text-muted);font-size:var(--font-size-xs);">暂未关联交易员</span>';
                return;
            }
            container.innerHTML = user.linkedTraders.map(function(tid) {
                return '<span class="trader-tag">' + getUserName(tid) + '<span class="remove-trader" onclick="removeTraderLink(\'' + tid + '\')">×</span></span>';
            }).join('');
        }

        function addTrader() {
            var sel = document.getElementById('availableTraders');
            if (!sel.value) return;
            var user = userData.find(function(u) { return u.id === currentEditTraderUserId; });
            if (!user) return;
            if (!user.linkedTraders) user.linkedTraders = [];
            if (user.linkedTraders.indexOf(sel.value) < 0) {
                user.linkedTraders.push(sel.value);
            }
            openTraderModal(currentEditTraderUserId);
        }

        function removeTraderLink(traderId) {
            var user = userData.find(function(u) { return u.id === currentEditTraderUserId; });
            if (!user) return;
            user.linkedTraders = user.linkedTraders.filter(function(t) { return t !== traderId; });
            openTraderModal(currentEditTraderUserId);
        }

        function closeTraderModal() { document.getElementById('traderModal').style.display = 'none'; currentEditTraderUserId = null; }

        function saveTraders() {
            alert('关联交易员配置已保存！');
            closeTraderModal();
            renderUserTable();
        }

        function getResignReceivers(userId) {
            var user = userData.find(function(u) { return u.id === userId; });
            if (!user) return [];
            var userGroups = user.investGroups || [];
            return userData.filter(function(u) {
                if (u.id === userId) return false;
                if (u.roleId !== user.roleId) return false;
                if (u.status !== 'active') return false;
                var uGroups = u.investGroups || [];
                return uGroups.some(function(g) { return userGroups.indexOf(g) >= 0; });
            });
        }

        var currentResignUserId = null;

        function openResignModal(userId) {
            currentResignUserId = userId;
            var user = userData.find(function(u) { return u.id === userId; });
            if (!user) return;
            var receivers = getResignReceivers(userId);

            var relatedProducts = mockProducts.filter(function(p) { return p.managerId === userId && (p.status === 'investing' || p.status === 'pending'); });
            var relatedPlans = mockPlans.filter(function(p) { return p.creatorId === userId && p.status !== 'completed'; });
            var relatedTrades = mockTrades.filter(function(t) { return t.traderId === userId && (t.status === 'pending' || t.status === 'executing'); });

            var receiverOptions = '<option value="">请选择接收人</option>';

                receiverOptions += '<option value="' + r.id + '">' + r.realName + ' (' + r.username + ')</option>';
            });

            var html = '<div class="detail-info-grid" style="margin-bottom:16px;">';
            html += '<div class="detail-info-item"><div class="info-label">姓名</div><div class="info-value">' + user.realName + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">用户名</div><div class="info-value">' + user.username + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">角色</div><div class="info-value">' + getRoleName(user.roleId) + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">所属组织</div><div class="info-value">' + getOrgName(user.orgId) + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">投资组</div><div class="info-value">' + (user.investGroups && user.investGroups.length > 0 ? user.investGroups.join(', ') : '无') + '</div></div>';

            html += '<div class="resign-tab-bar">';

            html += '<div id="resignTab-products" class="resign-tab-panel active">';

                html += '<div style="color:var(--text-muted);font-size:var(--font-size-xs);padding:12px 0;">暂无在管产品</div>';

                relatedProducts.forEach(function(p) {
                    html += '<div class="resign-resource-row"><div class="resign-resource-info"><strong>' + p.id + '</strong> ' + p.name + ' <span class="status-badge ' + (p.status === 'investing' ? 'status-investing' : 'status-pending') + '">' + (p.status === 'investing' ? '在投' : '待投') + '</span></div><select class="resign-receiver-select" data-resource-type="product" data-resource-id="' + p.id + '">' + receiverOptions + '</select></div>';
                });
            }
            html += '</div>';

            html += '<div id="resignTab-plans" class="resign-tab-panel">';
            if (relatedPlans.length === 0) {
                html += '<div style="color:var(--text-muted);font-size:var(--font-size-xs);padding:12px 0;">暂无未完结计划书</div>';

                relatedPlans.forEach(function(p) {
                    html += '<div class="resign-resource-row"><div class="resign-resource-info"><strong>' + p.id + '</strong> ' + p.name + ' <span class="status-badge ' + (p.status === 'active' ? 'status-active' : 'status-pending') + '">' + (p.status === 'active' ? '进行中' : '待审批') + '</span></div><select class="resign-receiver-select" data-resource-type="plan" data-resource-id="' + p.id + '">' + receiverOptions + '</select></div>';
                });
            }
            html += '</div>';

            html += '<div id="resignTab-trades" class="resign-tab-panel">';
            if (relatedTrades.length === 0) {
                html += '<div style="color:var(--text-muted);font-size:var(--font-size-xs);padding:12px 0;">暂无待执行/执行中交易</div>';
            } else {
                relatedTrades.forEach(function(t) {
                    html += '<div class="resign-resource-row"><div class="resign-resource-info"><strong>' + t.id + '</strong> ' + t.name + ' <span class="status-badge ' + (t.status === 'pending' ? 'status-pending' : 'status-processing') + '">' + (t.status === 'pending' ? '待执行' : '执行中') + '</span></div><select class="resign-receiver-select" data-resource-type="trade" data-resource-id="' + t.id + '">' + receiverOptions + '</select></div>';
                });
            }
            html += '</div>';

            document.getElementById('resignModalBody').innerHTML = html;
            document.getElementById('resignModalFooter').innerHTML = '<button class="btn btn-ghost" onclick="closeResignModal()">取消</button><button class="btn btn-danger" onclick="confirmResign()">确认停用并转移</button>';
            document.getElementById('resignModal').style.display = 'block';
        }

        function switchResignTab(tab) {
            document.querySelectorAll('.resign-tab-item').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.resign-tab-panel').forEach(function(t) { t.classList.remove('active'); });
            event.target.classList.add('active');
            document.getElementById('resignTab-' + tab).classList.add('active');
        }

        function closeResignModal() {
            document.getElementById('resignModal').style.display = 'none';
            currentResignUserId = null;
        }

        function confirmResign() {
            if (!currentResignUserId) return;
            var user = userData.find(function(u) { return u.id === currentResignUserId; });
            if (!user) return;

            var receiverSelects = document.querySelectorAll('.resign-receiver-select');
            var totalResources = 0;
            var transferred = 0;
            var unassigned = [];

            receiverSelects.forEach(function(sel) {
                totalResources++;
                if (sel.value) {
                    transferred++;
                    var resourceType = sel.getAttribute('data-resource-type');
                    var resourceId = sel.getAttribute('data-resource-id');
                    var receiverName = getUserName(sel.value);
                    if (resourceType === 'product') {
                        var product = mockProducts.find(function(p) { return p.id === resourceId; });
                        if (product) product.managerId = sel.value;
                    } else if (resourceType === 'plan') {
                        var plan = mockPlans.find(function(p) { return p.id === resourceId; });
                        if (plan) plan.creatorId = sel.value;
                    } else if (resourceType === 'trade') {
                        var trade = mockTrades.find(function(t) { return t.id === resourceId; });
                        if (trade) trade.traderId = sel.value;
                    }
                } else {
                    unassigned.push(sel.getAttribute('data-resource-id'));
                }
            });

            if (totalResources > 0 && unassigned.length > 0) {
                if (!confirm('有 ' + unassigned.length + ' 项资源未指定接收人，这些资源将不会被转移。确定继续？')) return;
            }

            user.status = 'disabled';

            closeResignModal();
            renderUserTable();

            alert('账号停用成功' + (transferred > 0 ? '，' + transferred + '项资产所有权已转移' : '') + '！');
        }

        function renderRoleTable() {
            var tbody = document.getElementById('roleTableBody');
            tbody.innerHTML = roleData.map(function(r) {
                var userCount = userData.filter(function(u) { return u.roleId === r.id; }).length;
                return '<tr><td>' + r.id + '</td><td>' + r.name + '</td><td style="font-family:var(--font-mono);font-size:var(--font-size-xs);color:var(--text-muted);">' + r.code + '</td><td>' + r.desc + '</td><td>' + userCount + '</td><td><button class="btn btn-primary btn-sm" onclick="editRole(\'' + r.id + '\')">编辑</button> <button class="btn btn-info btn-sm" onclick="viewRolePerms(\'' + r.id + '\')">权限</button></td></tr>';
            }).join('');
        }

        function openRoleModal(editId) {
            document.getElementById('roleModalTitle').textContent = editId ? '编辑角色' : '新增角色';
            var role = editId ? roleData.find(function(r) { return r.id === editId; }) : null;
            var html = '<div class="grid-2" style="gap:10px;">';
            html += '<div class="form-group"><label>角色名称 *</label><input type="text" id="roleName" value="' + (role ? role.name : '') + '" placeholder="请输入角色名称"></div>';
            html += '<div class="form-group"><label>角色标识 *</label><input type="text" id="roleCode" value="' + (role ? role.code : '') + '" placeholder="请输入角色标识（英文）"></div>';
            html += '</div>';
            html += '<div class="form-group"><label>描述</label><textarea id="roleDesc" rows="2" placeholder="请输入角色描述">' + (role ? role.desc : '') + '</textarea></div>';
            html += '<div class="detail-section-title" style="margin-top:10px;">权限配置</div>';
            permissionGroups.forEach(function(group) {
                html += '<div class="permission-group">';
                html += '<div class="permission-group-header"><input type="checkbox" onchange="toggleGroupPerms(this,\'' + group.name + '\')" ' + (role && group.perms.every(function(p) { return role.perms.indexOf(p) >= 0; }) ? 'checked' : '') + '> ' + group.name + '</div>';
                html += '<div class="permission-group-body">';
                group.perms.forEach(function(perm) {
                    html += '<div class="permission-item"><input type="checkbox" class="perm-check" data-group="' + group.name + '" value="' + perm + '" ' + (role && role.perms.indexOf(perm) >= 0 ? 'checked' : '') + '> ' + perm + '</div>';
                });
                html += '</div></div>';
            });
            document.getElementById('roleModalBody').innerHTML = html;
            document.getElementById('roleModalFooter').innerHTML = '<button class="btn btn-ghost" onclick="closeRoleModal()">取消</button><button class="btn btn-primary" onclick="saveRole(\'' + (editId || '') + '\')">保存</button>';
            document.getElementById('roleModal').style.display = 'block';
        }

        function toggleGroupPerms(checkbox, groupName) {
            document.querySelectorAll('.perm-check[data-group="' + groupName + '"]').forEach(function(cb) {
                cb.checked = checkbox.checked;
            });
        }

        function closeRoleModal() { document.getElementById('roleModal').style.display = 'none'; }

        function saveRole(editId) {
            var name = document.getElementById('roleName').value;
            var code = document.getElementById('roleCode').value;
            var desc = document.getElementById('roleDesc').value;
            if (!name || !code) { alert('请填写角色名称和标识'); return; }
            var perms = [];
            document.querySelectorAll('.perm-check:checked').forEach(function(cb) { perms.push(cb.value); });
            if (editId) {
                var role = roleData.find(function(r) { return r.id === editId; });
                if (role) { role.name = name; role.code = code; role.desc = desc; role.perms = perms; }
                alert('角色修改成功！');
            } else {
                var newId = 'ROLE' + String(roleData.length + 1).padStart(3, '0');
                roleData.push({ id: newId, name: name, code: code, desc: desc, perms: perms });
                alert('角色创建成功！');
            }
            closeRoleModal();
            renderRoleTable();
            populateRoleFilter();
        }

        function editRole(roleId) { openRoleModal(roleId); }

        function viewRolePerms(roleId) {
            var role = roleData.find(function(r) { return r.id === roleId; });
            if (!role) return;
            var html = '<div class="detail-section-title">角色权限 - ' + role.name + '</div>';
            permissionGroups.forEach(function(group) {
                var hasAny = group.perms.some(function(p) { return role.perms.indexOf(p) >= 0; });
                html += '<div class="permission-group">';
                html += '<div class="permission-group-header">' + group.name + (hasAny ? '' : ' <span style="color:var(--text-muted);font-weight:normal;">（未授权）</span>') + '</div>';
                if (hasAny) {
                    html += '<div class="permission-group-body">';
                    group.perms.forEach(function(perm) {
                        var has = role.perms.indexOf(perm) >= 0;
                        html += '<div class="permission-item" style="' + (has ? '' : 'opacity:0.4;') + '"><input type="checkbox" ' + (has ? 'checked' : '') + ' disabled> ' + perm + '</div>';
                    });
                    html += '</div>';
                }
                html += '</div>';
            });
            document.getElementById('roleModalTitle').textContent = '查看权限';
            document.getElementById('roleModalBody').innerHTML = html;
            document.getElementById('roleModalFooter').innerHTML = '<button class="btn btn-ghost" onclick="closeRoleModal()">关闭</button>';
            document.getElementById('roleModal').style.display = 'block';
        }

        function populateRoleFilter() {
            var sel = document.getElementById('userRoleFilter');
            var current = sel.value;
            sel.innerHTML = '<option value="">所有角色</option>';
            roleData.forEach(function(r) {
                sel.innerHTML += '<option value="' + r.id + '">' + r.name + '</option>';
            });
            sel.value = current;
        }

        window.addEventListener('click', function(event) {
            ['orgModal','userModal','roleModal','traderModal','resignModal'].forEach(function(id) {
                if (event.target === document.getElementById(id)) document.getElementById(id).style.display = 'none';
            });
        });

        renderOrgTree();
        populateRoleFilter();
        renderUserTable();
        renderRoleTable();
    </script>
</body>
</html>
