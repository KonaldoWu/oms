<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委外投资业务一体化订单管理平台 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .login-wrapper {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        .login-wrapper::before {
            content: '';
            position: absolute;
            top: -20%;
            right: 30%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .login-wrapper::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99,102,241,0.06) 0%, transparent 70%);
            border-radius: 50%;
        }
        .login-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            position: relative;
            z-index: 1;
        }
        .login-left .brand-area {
            margin-bottom: 56px;
        }
        .login-left .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .login-left .brand-logo .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .login-left .brand-logo .logo-text {
            color: #f1f5f9;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }
        .login-left .brand-desc {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.8;
            max-width: 520px;
        }
        .login-left .feature-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 480px;
        }
        .login-left .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .login-left .feature-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .login-left .feature-item:nth-child(1) .feature-icon { background: rgba(59,130,246,0.15); }
        .login-left .feature-item:nth-child(2) .feature-icon { background: rgba(16,185,129,0.15); }
        .login-left .feature-item:nth-child(3) .feature-icon { background: rgba(244,63,94,0.15); }
        .login-left .feature-item:nth-child(4) .feature-icon { background: rgba(139,92,246,0.15); }
        .login-left .feature-text {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
        }
        .login-left .feature-text strong {
            color: #f1f5f9;
            display: block;
            margin-bottom: 3px;
            font-size: 15px;
            font-weight: 600;
        }
        .login-right {
            width: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #f8fafc;
            position: relative;
            z-index: 1;
        }
        .login-right::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59,130,246,0.05) 0%, transparent 70%);
            border-radius: 50%;
        }
        .login-form-area {
            width: 100%;
            max-width: 320px;
            position: relative;
            z-index: 1;
        }
        .login-form-area h2 {
            color: #0f172a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
        }
        .login-form-area .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .login-form-area .form-group .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            pointer-events: none;
        }
        .login-form-area .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
        }
        .login-form-area .form-group input::placeholder {
            color: #94a3b8;
        }
        .login-form-area .form-group input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .login-form-area .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            letter-spacing: 4px;
        }
        .login-form-area .login-btn:hover {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .login-footer {
            position: absolute;
            bottom: 28px;
            left: 80px;
            color: #64748b;
            font-size: 12px;
            z-index: 1;
        }
        @media (max-width: 900px) {
            .login-left { display: none; }
            .login-right { width: 100%; background: #f8fafc; }
        }
    </style>
</head>
<body style="margin:0;position:relative;">
    <div class="login-wrapper">
        <div class="login-left">
            <div class="brand-area">
                <div class="brand-logo">
                    <div class="logo-icon">O</div>
                    <div class="logo-text">OMS委外投资业务<br>一体化订单管理平台</div>
                </div>
                <div class="brand-desc">覆盖投资计划、交易执行、风控合规、财务核算全流程的委外投资业务管理平台。</div>
            </div>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">📄</div>
                    <div class="feature-text"><strong>投资计划</strong>产品管理、计划书审批、管理人管理</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">✅</div>
                    <div class="feature-text"><strong>交易执行</strong>交易审批、ERP对接、iBor对接</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🛡</div>
                    <div class="feature-text"><strong>风控合规</strong>多级审批、过程留痕、预警提醒</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">⬇</div>
                    <div class="feature-text"><strong>财务核算</strong>凭证自动生成、NC系统一键推送、合同归档</div>
                </div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-form-area">
                <h2>登录系统</h2>
                <form id="login-form">
                    <div class="form-group">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="账号" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="密码" required autocomplete="off">
                    </div>
                    <button type="submit" class="login-btn">登 录</button>
                </form>
            </div>
        </div>
    </div>
    <div class="login-footer">© 2026 OMS委外投资业务一体化订单管理平台</div>
    <script src="js/script.js"></script>
</body>
</html>
