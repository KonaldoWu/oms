<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场外簿记OMS系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            display: flex;
            min-height: 100vh;
            background: var(--dark-bg);
        }
        .login-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            border-right: 1px solid var(--dark-border);
        }
        .login-left .brand-area {
            margin-bottom: 48px;
        }
        .login-left .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .login-left .brand-logo .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
        }
        .login-left .brand-logo .logo-text {
            color: var(--dark-text);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .login-left .brand-desc {
            color: var(--dark-text-dim);
            font-size: 14px;
            line-height: 1.8;
            max-width: 400px;
        }
        .login-left .feature-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-left .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .login-left .feature-icon {
            width: 32px;
            height: 32px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-light);
            font-size: 14px;
            flex-shrink: 0;
        }
        .login-left .feature-text {
            color: var(--dark-text-dim);
            font-size: 13px;
            line-height: 1.5;
        }
        .login-left .feature-text strong {
            color: var(--dark-text);
            display: block;
            margin-bottom: 2px;
            font-size: 14px;
        }
        .login-right {
            width: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .login-form-area {
            width: 100%;
            max-width: 340px;
        }
        .login-form-area h2 {
            color: var(--dark-text);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .login-form-area .login-subtitle {
            color: var(--dark-text-dim);
            font-size: 12px;
            margin-bottom: 28px;
        }
        .login-form-area .form-group {
            margin-bottom: 16px;
        }
        .login-form-area .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--dark-text-dim);
            font-size: 12px;
        }
        .login-form-area .form-group select,
        .login-form-area .form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--dark-border);
            border-radius: 4px;
            background: var(--dark-bg);
            color: var(--dark-text);
            font-size: 13px;
            transition: border-color 0.2s;
        }
        .login-form-area .form-group select:focus,
        .login-form-area .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .login-form-area .login-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .login-form-area .login-btn:hover {
            background: var(--primary-dark);
        }
        .login-footer {
            position: absolute;
            bottom: 20px;
            left: 60px;
            color: var(--dark-text-dim);
            font-size: 11px;
            opacity: 0.5;
        }
        @media (max-width: 900px) {
            .login-left { display: none; }
            .login-right { width: 100%; }
        }
    </style>
</head>
<body style="margin:0;position:relative;">
    <div class="login-wrapper">
        <div class="login-left">
            <div class="brand-area">
                <div class="brand-logo">
                    <div class="logo-icon">O</div>
                    <div class="logo-text">场外簿记OMS系统</div>
                </div>
                <div class="brand-desc">专业的场外衍生品簿记与订单管理系统，覆盖投资研究、交易执行、风控审批、财务核算全流程。</div>
            </div>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text"><strong>投资研究</strong>产品池管理、净值追踪、收益率分析</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">💹</div>
                    <div class="feature-text"><strong>交易执行</strong>场外交易簿记、ERP流程对接</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🛡️</div>
                    <div class="feature-text"><strong>风控审批</strong>多级审批、对手方入池管理</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📈</div>
                    <div class="feature-text"><strong>财务核算</strong>凭证管理、NC系统推送</div>
                </div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-form-area">
                <h2>登录系统</h2>
                <div class="login-subtitle">请选择您的身份以进入对应工作台</div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="role">选择身份</label>
                        <select id="role" name="role" required>
                            <option value="">请选择身份</option>
                            <option value="investment_manager">投资经理</option>
                            <option value="trader">交易员</option>
                            <option value="risk_control">部门风控</option>
                            <option value="department_leader">部门领导</option>
                            <option value="financial_staff">财务人员</option>
                            <option value="company_leader">公司领导</option>
                            <option value="admin">平台管理员</option>
                            <option value="demo">演示账号</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="password">登录密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入登录密码" required autocomplete="off">
                    </div>
                    <button type="submit" class="login-btn">登 录</button>
                </form>
            </div>
        </div>
    </div>
    <div class="login-footer">© 2026 场外簿记OMS系统 v2.0</div>
    <script src="js/script.js"></script>
</body>
</html>
