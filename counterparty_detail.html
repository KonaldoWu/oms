<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委外投资业务一体化订单管理平台 - 对手方详情</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar"></nav>
        <div class="main-area">
            <div class="topbar"></div>
            <div class="content">
                <div class="detail-page-header">
                    <div class="header-left">
                        <button class="back-btn" onclick="location.href='counterparty.html'">← 返回列表</button>
                        <div>
                            <h2 id="pageTitle">对手方详情</h2>
                            <div class="header-subtitle" id="pageSubtitle"></div>
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">基础信息</div>
                    <div class="detail-info-grid" id="basicInfoGrid"></div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">关联产品</div>
                    <div id="relatedProducts"></div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">关联交易</div>
                    <div id="relatedTrades"></div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">关联合同</div>
                    <div id="relatedContracts"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        initLayout('counterparty_detail.html', '对手方详情');

        function getQueryParam(key) {
            var params = new URLSearchParams(window.location.search);
            return params.get(key);
        }

        var currentCP = null;

        function init() {
            var cpId = getQueryParam('id');
            if (!cpId) { location.href = 'counterparty.html'; return; }
            currentCP = COUNTERPARTIES.find(function(c) { return c.id === cpId; });
            if (!currentCP) { alert('对手方不存在'); location.href = 'counterparty.html'; return; }
            renderPage();
        }

        function renderPage() {
            document.getElementById('pageTitle').textContent = currentCP.name;
            var typeClass = currentCP.type === '证券公司' ? 'status-approved' : currentCP.type === '资管公司' ? 'status-processing' : 'status-pending';
            document.getElementById('pageSubtitle').innerHTML = currentCP.id + ' · <span class="status-badge ' + typeClass + '">' + currentCP.type + '</span>';
            renderBasicInfo();
            renderRelatedProducts();
            renderRelatedTrades();
            renderRelatedContracts();
        }

        function renderBasicInfo() {
            var statusClass = getStatusClass(currentCP.status);
            var grid = document.getElementById('basicInfoGrid');
            var html = '';
            html += '<div class="detail-info-item"><div class="info-label">对手方ID</div><div class="info-value">' + currentCP.id + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">对手方名称</div><div class="info-value">' + currentCP.name + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">简称</div><div class="info-value">' + currentCP.shortName + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">类型</div><div class="info-value">' + currentCP.type + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">状态</div><div class="info-value"><span class="status-badge ' + statusClass + '">' + currentCP.status + '</span></div></div>';
            html += '<div class="detail-info-item"><div class="info-label">联系人</div><div class="info-value">' + (currentCP.contact || '-') + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">联系电话</div><div class="info-value">' + (currentCP.phone || '-') + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">邮箱</div><div class="info-value">' + (currentCP.email || '-') + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">用资计划书</div><div class="info-value">' + (currentCP.planFile || '-') + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">入池人</div><div class="info-value">' + currentCP.poolUser + '</div></div>';
            html += '<div class="detail-info-item"><div class="info-label">入池时间</div><div class="info-value">' + currentCP.poolTime + '</div></div>';
            grid.innerHTML = html;
        }

        function renderRelatedProducts() {
            var cpProducts = PRODUCTS.filter(function(p) { return p.counterparty === currentCP.id; });
            var container = document.getElementById('relatedProducts');
            if (cpProducts.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">暂无关联产品</p>';
                return;
            }
            var html = '<table class="data-table"><thead><tr><th>产品ID</th><th>产品名称</th><th>产品类型</th><th>投资状态</th><th>已投额度</th><th>计划额度</th><th>操作</th></tr></thead><tbody>';
            cpProducts.forEach(function(p) {
                var pStatusClass = getStatusClass(p.status);
                html += '<tr>';
                html += '<td>' + p.id + '</td>';
                html += '<td><a href="product_detail.html?id=' + p.id + '" style="font-weight:500;color:var(--primary);text-decoration:none;">' + p.name + '</a></td>';
                html += '<td>' + p.productType + '</td>';
                html += '<td><span class="status-badge ' + pStatusClass + '">' + p.status + '</span></td>';
                html += '<td class="text-mono">' + formatMoneyFull(p.holdAmount) + '</td>';
                html += '<td class="text-mono">' + formatMoneyFull(p.planAmount) + '</td>';
                html += '<td><a href="product_detail.html?id=' + p.id + '" class="btn btn-info btn-sm">查看详情</a></td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderRelatedTrades() {
            var cpContracts = CONTRACTS.filter(function(c) { return c.counterpartyId === currentCP.id; });
            var cpTradeIds = cpContracts.map(function(c) { return c.tradeId; });
            var cpTrades = TRADES.filter(function(t) { return cpTradeIds.indexOf(t.id) >= 0; });
            if (cpTrades.length === 0) {
                var cpProducts = PRODUCTS.filter(function(p) { return p.counterparty === currentCP.id; });
                var cpProductIds = cpProducts.map(function(p) { return p.id; });
                cpTrades = TRADES.filter(function(t) { return cpProductIds.indexOf(t.productId) >= 0; });
            }
            var container = document.getElementById('relatedTrades');
            if (cpTrades.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">暂无关联交易</p>';
                return;
            }
            var html = '<table class="data-table"><thead><tr><th>交易编号</th><th>产品名称</th><th>交易类型</th><th>申请金额</th><th>成交金额</th><th>状态</th><th>交易员</th><th>创建时间</th></tr></thead><tbody>';
            cpTrades.forEach(function(t) {
                var tStatusClass = getStatusClass(t.status);
                html += '<tr>';
                html += '<td style="font-weight:500;">' + t.id + '</td>';
                html += '<td><a href="product_detail.html?id=' + t.productId + '" style="font-weight:500;color:var(--primary);text-decoration:none;">' + t.productName + '</a></td>';
                html += '<td><span class="status-badge ' + getStatusClass(t.type) + '">' + t.type + '</span></td>';
                html += '<td class="text-mono">' + formatMoneyFull(t.applyAmount) + '</td>';
                html += '<td class="text-mono">' + formatMoneyFull(t.dealAmount) + '</td>';
                html += '<td><span class="status-badge ' + tStatusClass + '">' + t.status + '</span></td>';
                html += '<td>' + t.trader + '</td>';
                html += '<td>' + t.createTime + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderRelatedContracts() {
            var cpContracts = CONTRACTS.filter(function(c) { return c.counterpartyId === currentCP.id; });
            var container = document.getElementById('relatedContracts');
            if (cpContracts.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">暂无关联合同</p>';
                return;
            }
            var html = '<table class="data-table"><thead><tr><th>合同编号</th><th>关联交易</th><th>产品</th><th>合同类型</th><th>管理人</th><th>合同金额</th><th>合同版本</th><th>状态</th></tr></thead><tbody>';
            cpContracts.forEach(function(c) {
                var versionClass = getStatusClass(c.version);
                var statusClass = getStatusClass(c.status);
                html += '<tr>';
                html += '<td style="font-weight:500;">' + c.id + '</td>';
                html += '<td class="text-mono">' + c.tradeId + '</td>';
                html += '<td>' + c.productName + '</td>';
                html += '<td>' + c.type + '</td>';
                html += '<td>' + (c.manager || '-') + '</td>';
                html += '<td class="text-mono">' + formatMoney(c.amount) + '</td>';
                html += '<td><span class="status-badge ' + versionClass + '">' + c.version + '</span></td>';
                html += '<td><span class="status-badge ' + statusClass + '">' + c.status + '</span></td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
