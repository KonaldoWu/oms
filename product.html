<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委外投资业务一体化订单管理平台 - 产品管理</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-name-link { font-weight: 500; color: var(--primary); cursor: pointer; text-decoration: none; }
        .product-name-link:hover { text-decoration: underline; }
        .tab-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
        .tab-btn { padding: 7px 16px; font-size: var(--font-size-sm); font-weight: 500; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .toggle-btn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
        .toggle-btn.enable { background: var(--success-bg); color: var(--success); }
        .toggle-btn.enable:hover { background: var(--success); color: white; }
        .toggle-btn.disable { background: var(--danger-bg); color: var(--danger); }
        .toggle-btn.disable:hover { background: var(--danger); color: white; }
        .modal-content.wide { width: 640px; }
        .cascade-check { display: flex; align-items: center; gap: 6px; }
        .cascade-check input[type="checkbox"] { margin: 0; cursor: pointer; flex: none; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .detail-section-title { font-size:13px;font-weight:600;color:var(--text-primary);padding:8px 0 6px;border-bottom:1px solid var(--border-light);margin-bottom:8px; }
        .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .form-group .required-star { color: red; }
        /* PRD：账套类型专属字段区域（黄色区域） */
        .account-type-fields { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: var(--radius); padding: 12px; margin-top: 12px; }
        .account-type-fields .account-type-fields-title { font-size: 12px; font-weight: 600; color: #B45309; margin-bottom: 8px; }
        /* 年化收益率：输入框右侧百分号，仅填数值 */
        .input-suffix-wrap { position: relative; }
        .input-suffix-wrap input { width: 100%; padding-right: 30px; }
        .input-suffix { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px; pointer-events: none; }
        .btn-group { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-group .btn { min-width: 90px; }

        /* PRD 下拉组件：可搜索/可编辑下拉（信用评级、基础资产类型、区域市场） */
        .combo-box { position: relative; }
        .combo-box input { width: 100%; padding-right: 24px; }
        .combo-caret { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--text-muted); pointer-events: none; }
        .combo-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 240px; overflow-y: auto; }
        .combo-panel.show { display: block; }
        .combo-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 10px; font-size: var(--font-size-sm); cursor: pointer; color: var(--text-secondary); }
        .combo-item:hover { background: var(--info-bg); color: var(--primary); }
        .combo-item.active { background: var(--info-bg); color: var(--primary); font-weight: 600; }
        .combo-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .combo-ops { display: none; gap: 4px; flex: none; }
        .combo-item:hover .combo-ops { display: flex; }
        .combo-op { font-size: 11px; padding: 1px 6px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); }
        .combo-op:hover { border-color: var(--primary); color: var(--primary); }
        .combo-op.ok { color: var(--success); border-color: var(--success); }
        .combo-inline-edit { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border-light); }
        .combo-inline-edit input { flex: 1; min-width: 0; padding: 3px 6px; font-size: var(--font-size-sm); border: 1px solid var(--primary); border-radius: var(--radius-sm); }
        .combo-add-row { padding: 6px 10px; color: var(--primary); font-size: var(--font-size-sm); cursor: pointer; border-top: 1px solid var(--border-light); }
        .combo-add-row:hover { background: var(--info-bg); }
        .combo-empty { padding: 12px 10px; color: var(--text-muted); font-size: 12px; text-align: center; }

        .cascade-filter { position: relative; flex: none; width: 220px; }
        .cascade-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; cursor: pointer; text-align: left; background: var(--surface); }
        .cascade-trigger:disabled, .cascade-trigger.disabled { background: var(--border-light); cursor: not-allowed; color: var(--text-muted); }
        .cascade-trigger .caret { font-size: 10px; color: var(--text-muted); margin-left: 6px; }
        .cascade-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 50; flex-direction: row; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 320px; max-height: 280px; overflow: hidden; }
        .cascade-panel.show { display: flex; }
        .cascade-col { min-width: 150px; width: 160px; max-height: 280px; overflow-y: auto; border-right: 1px solid var(--border-light); }
        .cascade-col:last-child { border-right: none; }
        .cascade-col-header { padding: 6px 12px; font-size: var(--font-size-xs); color: var(--text-muted); background: var(--border-light); position: sticky; top: 0; }
        .cascade-item { padding: 7px 12px; font-size: var(--font-size-sm); cursor: pointer; white-space: nowrap; color: var(--text-secondary); }
        .cascade-item:hover { background: var(--info-bg); color: var(--primary); }
        .cascade-item.active { background: var(--info-bg); color: var(--primary); font-weight: 600; }
        .cascade-item.all { color: var(--text-muted); }

        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: var(--primary); }
        .sort-indicator { display: inline-block; margin-left: 2px; color: var(--text-muted); font-size: 10px; min-width: 10px; }
        th.sortable.sorted { color: var(--primary); }
        th.sortable.sorted .sort-indicator { color: var(--primary); }

        .table-pagination { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--border-light); flex-wrap: wrap; gap: 8px; }
        .page-info { font-size: var(--font-size-xs); color: var(--text-muted); }
        .page-size-wrap { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-xs); color: var(--text-muted); }
        .page-size-select { padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--font-size-xs); background: var(--surface); cursor: pointer; }
        .page-buttons { display: flex; align-items: center; gap: 4px; }
        .page-btn { min-width: 26px; padding: 3px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-secondary); font-size: var(--font-size-xs); cursor: pointer; transition: all 0.15s; }
        .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-ellipsis { padding: 0 4px; color: var(--text-muted); font-size: var(--font-size-xs); }
    </style>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar"></nav>
        <div class="main-area">
            <div class="topbar"></div>
            <div class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <span class="page-title">产品管理 - 产品池</span>
                        <span class="page-subtitle">Product Pool</span>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-ghost btn-sm" id="btnBatchImport" data-logic-id="modal_batch_import" onclick="openBatchImportModal()" style="display:none;">📥 批量入池</button>
                        <button class="btn btn-primary btn-sm" id="btnAddProduct" data-logic-id="modal_add_product" onclick="openAddModal()" style="display:none;">+ 产品入池</button>
                    </div>
                </div>

                <div class="stats-row" id="statsRow" data-logic-id="module_product_list"></div>

                <div class="card" data-logic-id="module_product_list">
                    <div class="card-header"><span class="card-title">筛选条件</span></div>
                    <div class="card-body">
                        <div class="search-bar">
                            <div class="cascade-filter" id="accountCascade" style="width:300px;">
                                <button type="button" class="search-input cascade-trigger" id="accountTrigger" onclick="toggleAccountCascade(event)">
                                    <span id="accountLabel">全部账套类型</span>
                                    <span class="caret">▼</span>
                                </button>
                                <div class="cascade-panel" id="accountPanel">
                                    <div class="cascade-col">
                                        <div class="cascade-col-header">账套大类</div>
                                        <div id="accountCatList"></div>
                                    </div>
                                    <div class="cascade-col">
                                        <div class="cascade-col-header">E列账户名称</div>
                                        <div id="accountNameList"></div>
                                    </div>
                                </div>
                            </div>
                            <select class="search-input" id="filterProductType" style="flex:none;width:150px;">
                                <option value="">全部产品类型</option>
                                <option value="其它类基金">其它类基金</option>
                                <option value="另类投资基金">另类投资基金</option>
                                <option value="FOF基金">FOF基金</option>
                                <option value="理财">理财</option>
                                <option value="非标准资产支持证券">非标准资产支持证券</option>
                                <option value="信托计划">信托计划</option>
                                <option value="碳金融">碳金融</option>
                            </select>
                            <div class="cascade-filter" id="statusCascade" style="width:140px;">
                                <button type="button" class="search-input cascade-trigger" id="statusTrigger" onclick="toggleStatusCascade(event)">
                                    <span id="statusLabel">全部状态</span>
                                    <span class="caret">▼</span>
                                </button>
                                <div class="cascade-panel" id="statusPanel" style="left:0;right:0;min-width:auto;flex-direction:column;">
                                    <div class="cascade-col" style="width:auto;border-right:none;">
                                        <div id="statusCheckList"></div>
                                    </div>
                                </div>
                            </div>
                            <input type="text" placeholder="搜索产品名称/内部编码/外部编码" class="search-input" id="filterKeyword">
                            <button class="btn btn-primary btn-sm" onclick="applyFilters()">搜索</button>
                            <button class="btn btn-ghost btn-sm" onclick="resetFilters()">重置</button>
                        </div>
                    </div>
                </div>

                <div class="card" data-logic-id="module_product_list">
                    <div class="card-header">
                        <span class="card-title">产品列表</span>
                        <span class="page-subtitle" id="productCount"></span>
                    </div>
                    <div class="card-body-p0">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>产品名称</th>
                                        <th>内部编码</th>
                                        <th>外部编码</th>
                                        <th>产品类型</th>
                                        <th>账套类型</th>
                                        <th>投资状态</th>
                                        <th>单位净值</th>
                                        <th class="sortable" onclick="toggleSort('navDate')">最新净值日期<span class="sort-indicator" id="sort-navDate"></span></th>
                                        <th>投资组</th>
                                        <th class="sortable" onclick="toggleSort('poolTime')">入池日期<span class="sort-indicator" id="sort-poolTime"></span></th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="productTableBody"></tbody>
                            </table>
                        </div>
                        <div class="table-pagination" id="tablePagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="productModal" class="modal" data-logic-id="modal_add_product">
        <div class="modal-content" style="width:820px;max-height:85vh;overflow-y:auto;">
            <div class="modal-header">
                <h3 id="modalTitle">产品入池</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeProductModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="detail-section-title">基础信息</div>
                <div class="grid-3">
                    <div class="form-group"><label>产品名称 <span class="required-star">*</span></label><input type="text" id="fName" required maxlength="100" placeholder="资管计划全称/合同全称"></div>
                    <div class="form-group"><label>产品简称</label><input type="text" id="fShortName" placeholder="选填，报表及交易展示名称"></div>
                    <div class="form-group"><label>外部编码</label><input type="text" id="fExternalCode" placeholder="选填，对接外部系统"></div>
                    <div class="form-group"><label>账套类型 <span class="required-star">*</span></label>
                        <input type="hidden" id="fAccountType">
                        <div class="cascade-filter" style="width:100%;" id="accountTree">
                            <button type="button" class="search-input cascade-trigger" id="fAccountTypeTrigger" onclick="toggleAccountTree(event)">
                                <span id="fAccountTypeLabel">请选择（先选大类，再选账户）</span>
                                <span class="caret">▼</span>
                            </button>
                            <div class="cascade-panel" id="accountTreePanel" style="left:0;right:0;min-width:auto;">
                                <div class="cascade-col" style="width:130px;">
                                    <div class="cascade-col-header">账套大类</div>
                                    <div id="accountTreeCats"></div>
                                </div>
                                <div class="cascade-col" style="width:190px;">
                                    <div class="cascade-col-header">E列账户名称</div>
                                    <div id="accountTreeAccounts"></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-hint">树形选择：大类 → E列账户名称，选择后展示对应黄色区域字段</div>
                    </div>
                    <div class="form-group"><label>产品类型 <span class="required-star">*</span></label><select id="fProductType" required disabled><option value="">请先选择账套类型</option></select><div class="form-hint" id="fProductTypeHint">账套类型确认后自动限定枚举</div></div>
                    <div class="form-group"><label>备注</label><input type="text" id="fRemark" placeholder="选填" maxlength="200"></div>
                </div>

                <!-- PRD（一）产品入池信息补充：确认账套类型后，展示对应黄色区域字段 -->
                <div id="fAssetTypeFields"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeProductModal()">取消</button>
                <button class="btn btn-ghost" onclick="saveProduct('draft')">保存草稿</button>
                <button class="btn btn-primary" onclick="saveProduct('submit')">提交入池</button>
            </div>
        </div>
    </div>

    <div id="batchImportModal" class="modal" data-logic-id="modal_batch_import">
        <div class="modal-content" style="width:800px;">
            <div class="modal-header">
                <h3>批量入池</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeBatchImportModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="file-upload" style="margin-bottom:12px;">
                    <input type="file" id="batchFileInput" accept=".xlsx">
                    <label for="batchFileInput">选择Excel文件</label>
                    <p>支持 .xlsx 格式，<a href="javascript:void(0)" onclick="downloadTemplate()" style="color:var(--primary);">下载导入模板</a></p>
                    <p class="form-hint">模板按账套类型分为4个sheet：专户（资管计划）/ 信托计划 / 结构化（保交所）/ 碳金融，字段与单个入池一致</p>
                </div>
                <div id="batchResult" style="display:none;"></div>
                <div id="batchPreview" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeBatchImportModal()">取消</button>
                <button class="btn btn-primary" id="btnConfirmBatch" onclick="confirmBatchImport()" disabled>确认入池</button>
            </div>
        </div>
    </div>

    <!-- 兑息兑付弹窗（仅信托/ABS中保登产品展示，字段来自iBor兑息兑付数据主题） -->
    <div id="dividendModal" class="modal" data-logic-id="modal_dividend">
        <div class="modal-content" style="width:560px;">
            <div class="modal-header">
                <h3>兑息兑付登记</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeDividendModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>产品名称 <span class="required-star">*</span></label>
                    <input type="text" id="divProductName" readonly style="background:var(--border-light);">
                    <input type="hidden" id="divProductId">
                </div>
                <div class="grid-2" style="gap:10px;">
                    <div class="form-group">
                        <label>产品内部编码</label>
                        <input type="text" id="divInnerCode" readonly style="background:var(--border-light);">
                    </div>
                    <div class="form-group">
                        <label>产品外部编码</label>
                        <input type="text" id="divExternalCode" readonly style="background:var(--border-light);">
                    </div>
                </div>
                <div class="form-group" style="margin-top:6px;padding:8px 10px;background:var(--info-bg);border-radius:var(--radius);font-size:12px;color:var(--text-secondary);">
                    <span id="divAssetTypeHint"></span>
                </div>
                <div class="grid-2" style="gap:10px;margin-top:10px;">
                    <div class="form-group">
                        <label>兑付日期 <span class="required-star">*</span></label>
                        <input type="date" id="divDate">
                    </div>
                    <div class="form-group">
                        <label>每百元应付利息(元) <span class="required-star">*</span></label>
                        <input type="number" id="divInterestPer100" step="0.0001" placeholder="iBor字段，需转换为每百元">
                    </div>
                </div>
                <div class="grid-2" style="gap:10px;">
                    <div class="form-group">
                        <label>每百元应付本金(元) <span class="required-star">*</span></label>
                        <input type="number" id="divPrincipalPer100" step="0.0001" placeholder="iBor字段，需转换为每百元">
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <input type="text" id="divRemark" placeholder="选填">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeDividendModal()">取消</button>
                <button class="btn btn-primary" onclick="saveDividend()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        initLayout('product.html', '产品管理');

        var _perm = {
            canAddProduct: hasPermission('addProduct'),
            canEditProduct: hasPermission('editProduct'),
            canBatchImport: hasPermission('batchImportProduct'),
            canCreateTrade: hasPermission('createTrade'),
            isTrader: getCurrentRoleKey() === 'trader' || getCurrentRoleKey() === 'demo',
            isFinance: getCurrentRoleKey() === 'financial_staff' || getCurrentRoleKey() === 'demo',
            isDemo: getCurrentRoleKey() === 'demo',
            isReadOnly: isReadOnly()
        };
        var editingId = null;

        var _sort = { field: 'navDate', order: 'desc' };
        var _page = { current: 1, size: 20 };
        var _accountFilter = { category: '', names: [] };

        // 账套类型两级筛选：选定账户精确匹配；仅选大类时按账套大类前缀匹配
        function matchAccountFilter(p) {
            if (_accountFilter.names.length > 0) return _accountFilter.names.indexOf(p.accountType) !== -1;
            if (_accountFilter.category) {
                var full = getAccountCategory(p.accountType) || '';
                return full === _accountFilter.category || full.indexOf(_accountFilter.category) === 0;
            }
            return true;
        }

        function renderStats() {
            var counts = { '在投': 0, '无计划': 0 };
            PRODUCTS.forEach(function(p) {
                if (counts.hasOwnProperty(p.status)) counts[p.status]++;
            });
            var icons = [
                { key: '在投', icon: '💹', cls: 'green' },
                { key: '无计划', icon: '⏳', cls: 'orange' }
            ];
            var html = '';
            icons.forEach(function(item) {
                html += '<div class="stat-card">' +
                    '<div class="stat-icon ' + item.cls + '">' + item.icon + '</div>' +
                    '<div class="stat-info">' +
                    '<div class="stat-label">' + item.key + '</div>' +
                    '<div class="stat-value">' + counts[item.key] + '</div>' +
                    '</div></div>';
            });
            document.getElementById('statsRow').innerHTML = html;
        }

        var _statusSelected = [];
        function getFilteredProducts() {
            var productType = document.getElementById('filterProductType').value;
            var keyword = document.getElementById('filterKeyword').value.toLowerCase().trim();
            return PRODUCTS.filter(function(p) {
                if (!matchAccountFilter(p)) return false;
                if (productType && p.productType !== productType) return false;
                if (_statusSelected.length > 0 && _statusSelected.indexOf(p.status) === -1) return false;
                if (keyword) {
                    var haystack = (p.name + (p.hengtaiCode||'') + (p.externalCode||'')).toLowerCase();
                    if (haystack.indexOf(keyword) === -1) return false;
                }
                return true;
            });
        }

        function navSortKey(p) {
            return p.navDate || p.poolTime || '';
        }
        function getSortedProducts(list) {
            var sorted = list.slice();
            if (!_sort.field) return sorted;
            var field = _sort.field;
            var dir = _sort.order === 'desc' ? -1 : 1;
            sorted.sort(function(a, b) {
                var va = field === 'navDate' ? navSortKey(a) : (a[field] || '');
                var vb = field === 'navDate' ? navSortKey(b) : (b[field] || '');
                if (va < vb) return -1 * dir;
                if (va > vb) return 1 * dir;
                return 0;
            });
            return sorted;
        }

        function renderTable() {
            var list = getSortedProducts(getFilteredProducts());
            document.getElementById('productCount').textContent = '共 ' + list.length + ' 个产品';
            var total = list.length;
            var totalPages = Math.max(1, Math.ceil(total / _page.size));
            if (_page.current > totalPages) _page.current = totalPages;
            if (_page.current < 1) _page.current = 1;
            var start = (_page.current - 1) * _page.size;
            var pageData = list.slice(start, start + _page.size);
            var tbody = document.getElementById('productTableBody');
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--text-muted);padding:30px;">暂无匹配产品</td></tr>';
                renderPagination(total, totalPages);
                return;
            }
            var html = '';
            pageData.forEach(function(p) {
                var statusBadge = '<span class="status-badge ' + getStatusClass(p.status) + '">' + p.status + '</span>';
                var navStr = p.nav ? p.nav.toFixed(4) : '-';
                var navCell = p.nav
                    ? '<td class="text-mono" title="真实值：' + p.nav + '">' + navStr + '</td>'
                    : '<td class="text-mono">' + navStr + '</td>';
                var nameLink = '<a class="product-name-link" href="product_detail.html?id=' + p.id + '">' + p.name + '</a>';
                var actionHtml = '<a class="btn btn-info btn-sm" href="product_detail.html?id=' + p.id + '">详情</a> ';
                if (!_perm.isReadOnly) {
                    if (_perm.canEditProduct) {
                        if (p.status === '无计划' || p.status === '在投') {
                            actionHtml += '<button class="btn btn-ghost btn-sm" data-logic-id="modal_edit_product" onclick="openEditModal(\'' + p.id + '\')">编辑</button> ';
                        }
                    }
                    if ((_perm.canCreateTrade || _perm.isDemo) && (p.status === '在投' || p.status === '无计划')) {
                        actionHtml += '<button class="btn btn-primary btn-sm" onclick="initiateTradeFromProduct(\'' + p.id + '\')">发起交易</button>';
                    }
                    if ((_perm.isFinance || _perm.isDemo) && p.status === '在投' && (p.assetType === '信托' || p.assetType === 'ABS(中保登)')) {
                        actionHtml += ' <button class="btn btn-info btn-sm" onclick="openDividendModal(\'' + p.id + '\')">兑息兑付</button>';
                    }
                }
                html += '<tr>' +
                    '<td>' + nameLink + '</td>' +
                    '<td class="text-mono">' + (p.hengtaiCode || '-') + '</td>' +
                    '<td class="text-mono">' + (p.externalCode || '-') + '</td>' +
                    '<td>' + p.productType + '</td>' +
                    '<td><span class="type-badge type-plan-notice">' + (p.accountType || '-') + '</span></td>' +
                    '<td>' + statusBadge + '</td>' +
                    navCell +
                    '<td>' + (p.navDate || '-') + '</td>' +
                    '<td>' + (p.group || '-') + '</td>' +
                    '<td>' + (p.poolTime || '-') + '</td>' +
                    '<td>' + actionHtml + '</td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
            renderPagination(total, totalPages);
        }

        function renderPagination(total, totalPages) {
            var el = document.getElementById('tablePagination');
            if (total === 0) { el.innerHTML = ''; return; }
            var startIdx = (_page.current - 1) * _page.size + 1;
            var endIdx = Math.min(_page.current * _page.size, total);
            var sizes = [20, 50, 100];
            var sizeHtml = '<div class="page-size-wrap">每页<select class="page-size-select" onchange="changePageSize(this.value)">';
            sizes.forEach(function(s) {
                sizeHtml += '<option value="' + s + '"' + (s === _page.size ? ' selected' : '') + '>' + s + '</option>';
            });
            sizeHtml += '</select>条</div>';
            var infoHtml = '<div class="page-info">第 ' + startIdx + '-' + endIdx + ' 条 / 共 ' + total + ' 条</div>';
            var btnHtml = '<div class="page-buttons">';
            btnHtml += '<button class="page-btn" onclick="goPage(1)"' + (_page.current <= 1 ? ' disabled' : '') + '>首页</button>';
            btnHtml += '<button class="page-btn" onclick="goPage(' + (_page.current - 1) + ')"' + (_page.current <= 1 ? ' disabled' : '') + '>上一页</button>';
            var from = Math.max(1, _page.current - 2);
            var to = Math.min(totalPages, _page.current + 2);
            if (from > 1) { btnHtml += '<span class="page-ellipsis">…</span>'; }
            for (var i = from; i <= to; i++) {
                btnHtml += '<button class="page-btn' + (i === _page.current ? ' active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
            }
            if (to < totalPages) { btnHtml += '<span class="page-ellipsis">…</span>'; }
            btnHtml += '<button class="page-btn" onclick="goPage(' + (_page.current + 1) + ')"' + (_page.current >= totalPages ? ' disabled' : '') + '>下一页</button>';
            btnHtml += '<button class="page-btn" onclick="goPage(' + totalPages + ')"' + (_page.current >= totalPages ? ' disabled' : '') + '>末页</button>';
            btnHtml += '</div>';
            el.innerHTML = sizeHtml + infoHtml + btnHtml;
        }

        function goPage(page) {
            var total = getFilteredProducts().length;
            var totalPages = Math.max(1, Math.ceil(total / _page.size));
            if (page < 1 || page > totalPages) return;
            _page.current = page;
            renderTable();
        }

        function changePageSize(size) {

        function toggleSort(field) {
            if (_sort.field === field) {
                _sort.order = _sort.order === 'asc' ? 'desc' : (_sort.order === 'desc' ? '' : 'asc');

            } else {

        function updateSortIndicators() {

        function saveDividend() {
            var productId = document.getElementById('divProductId').value;
            var productName = document.getElementById('divProductName').value;
            var innerCode = document.getElementById('divInnerCode').value;
            var externalCode = document.getElementById('divExternalCode').value;
            var divDate = document.getElementById('divDate').value;
            var interestPer100 = document.getElementById('divInterestPer100').value;
            var principalPer100 = document.getElementById('divPrincipalPer100').value;
            var divRemark = document.getElementById('divRemark').value;

            if (!productId) { alert('产品信息缺失'); return; }
            if (!divDate) { alert('请选择兑付日期'); return; }
            if (interestPer100 === '' || parseFloat(interestPer100) < 0) { alert('请输入有效的每百元应付利息'); return; }
            if (principalPer100 === '' || parseFloat(principalPer100) < 0) { alert('请输入有效的每百元应付本金'); return; }

            // 生成流程编号：DV + 日期 + 三位序号
            var dateStr = divDate.replace(/-/g, '');
            var seq = 1;
            DIVIDENDS.forEach(function(d) {
                if (d.id && d.id.indexOf('DV' + dateStr) === 0) seq++;
            });
            var seqStr = String(seq).padStart(3, '0');
            var recordId = 'DV' + dateStr + seqStr;

            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            // 新增兑息兑付流程记录到 DIVIDENDS 数组（状态=待交易员确认）
            var newRecord = {
                id: recordId,
                productId: productId,
                productName: productName,
                innerCode: innerCode,
                externalCode: externalCode,
                initiator: role.label,
                divDate: divDate,
                interestPer100: parseFloat(interestPer100),
                principalPer100: parseFloat(principalPer100),
                remark: divRemark,
                status: '待交易员确认',
                traderConfirmUser: '',
                traderConfirmTime: '',
                traderModified: false,
                traderRemark: '',
                financeConfirmUser: '',
                financeConfirmTime: '',
                voucherId: '',
                pushIborStatus: '未推送',
                pushIborTime: '',
                createTime: nowStr,
                history: [{ user: role.label, action: '发起兑息兑付', time: nowStr, remark: divRemark }]
            };
            DIVIDENDS.push(newRecord);

            closeDividendModal();
            var msg = '兑息兑付流程已发起！\n\n' +
                      '流程编号：' + recordId + '\n' +
                      '产品：' + productName + '\n' +
                      '兑付日期：' + divDate + '\n' +
                      '每百元应付利息：' + parseFloat(interestPer100).toFixed(4) + ' 元\n' +
                      '每百元应付本金：' + parseFloat(principalPer100).toFixed(4) + ' 元\n' +
                      '当前状态：待交易员确认\n\n' +
                      '流程：财务发起 → 交易员确认 → 财务最终确认 → 生成凭证 → 推送iBor\n' +
                      '交易员可在【审批中心】处理，财务可在【财务核算-兑息兑付流程】查看进度。';
            alert(msg);
        }

        function saveProduct(mode) {
            var name = document.getElementById('fName').value.trim();
            var productType = document.getElementById('fProductType').value;
            var accountType = document.getElementById('fAccountType').value;
            // PRD（五）830优化-1：fAccountType 存E列账户名称，内部校验/联动逻辑按账套大类
            var category = getAccountCategory(accountType);

            if (!name || !accountType) {
                alert('请填写所有必填字段（标记 * 的项）');
                return;
            }
            // 产品类型：专户为4枚举可选，其他账套由账套类型决定固定值
            if (category === '专户（资管计划）') {
                if (!productType) { alert('请选择产品类型（其它类基金/另类投资基金/FOF基金/理财）'); return; }
            } else {
                productType = FIXED_PRODUCT_TYPE_MAP[category] || productType;
                if (!productType) { alert('请先选择账套类型'); return; }
            }

            // 公共字段
            var externalCode = getElVal('fExternalCode');
            var shortName = getElVal('fShortName') || (name.length > 8 ? name.slice(0,8) : name);
            var remark = getElVal('fRemark');

            // 各账套专属字段
            var tradeMarket = getElVal('fTradeMarket');
            var currency = getElVal('fCurrency') || 'CNY';
            var establishDate = getElVal('fEstablishDate');
            var startDate = getElVal('fStartDate');
            var expireDate = getElVal('fExpireDate');
            var manager = getElVal('fManager');
            var managerCode = getElVal('fManagerCode');
            var faceValue = getElNum('fFaceValue');
            var totalScale = getElNum('fTotalScale');
            var financier = getElVal('fFinancier');
            var financierCode = getElVal('fFinancierCode');
            var guarantor = getElVal('fGuarantor');
            var guarantorCode = getElVal('fGuarantorCode');
            var actualMaturityDate = getElVal('fActualMaturityDate');
            var concentration = getElNum('fConcentration');
            var creditRating = getElVal('fCreditRating');
            var originator = getElVal('fOriginator');
            var originatorCode = getElVal('fOriginatorCode');
            var counterpartyCode = getElVal('fCounterpartyCode');
            var underlyingAssetType = getElVal('fUnderlyingAssetType');
            var trancheLevel = getElVal('fTrancheLevel');
            var annualYield = getElNum('fAnnualYield');
            var regionalMarket = getElVal('fRegionalMarket');
            var counterpartyIbor = getElVal('fCounterparty');

            // 按账套类型校验必填字段（PRD（一）产品入池信息补充）
            if (category === '专户（资管计划）') {
                if (!establishDate) { alert('请填写【成立/发行日】（必填）'); return; }
                if (!manager) { alert('请填写【管理人】（必填）'); return; }
                if (mode === 'submit' && !shortName) { /* 产品简称选填，可用名称截断 */ }
            } else if (category === '信托计划') {
                if (!startDate) { alert('请填写【开始日期】（必填）'); return; }
                if (!expireDate) { alert('请填写【到期日】（必填）'); return; }
                if (!faceValue) { alert('请填写【面值】（必填）'); return; }
                if (!totalScale) { alert('请填写【产品总规模】（必填）'); return; }
                if (!financier) { alert('请填写【融资人】（必填，多个使用逗号分隔）'); return; }
                if (!manager) { alert('请填写【管理人】（必填，多个使用逗号分隔）'); return; }
                if (!guarantor) { alert('请填写【担保人】（必填，多个使用逗号分隔）'); return; }
            } else if (category === '结构化（保交所）') {
                if (!startDate) { alert('请填写【开始日期】（必填）'); return; }
                if (!actualMaturityDate) { alert('请填写【实际到期日】（必填）'); return; }
                if (!faceValue) { alert('请填写【面值】（必填）'); return; }
                if (!totalScale) { alert('请填写【产品总规模】（必填）'); return; }
                if (!concentration) { alert('请填写【集中度】（必填）'); return; }
                if (!creditRating) { alert('请填写【信用评级】（必填）'); return; }
                if (CREDIT_RATINGS.indexOf(creditRating) === -1) { alert('信用评级枚举值不正确，请从下拉列表选择（AAA~B-、NR）'); return; }
                if (!trancheLevel) { alert('请选择【产品层级】（优先/夹层/次级）'); return; }
                if (!annualYield) { alert('请填写【年化收益率】（必填，仅填数值）'); return; }
            } else if (category === '碳金融') {
                if (!regionalMarket) { alert('请填写【区域市场】（必填）'); return; }
                if (!counterpartyIbor) { alert('请填写【交易对手方】（必填）'); return; }
                if (!annualYield) { alert('请填写【年化收益率】（必填，仅填数值）'); return; }
                if (!expireDate) { alert('请填写【预期到期日】（必填）'); return; }
            }

            // 日期字段归一化：非专户账套的开始日期同步作为成立/发行日
            if (category !== '专户（资管计划）') establishDate = startDate;

            var assetType = ASSET_TYPE_MAP[category] || '专户资管产品';

            if (editingId) {
                var p = PRODUCTS.find(function(x) { return x.id === editingId; });

        // ============ PRD（一）产品入池信息补充：枚举定义 ============
        // 信用评级：下拉单选，支持搜索（18个枚举值）
        var CREDIT_RATINGS = ['AAA','AA+','AA','AA-','A+','A','A-','BBB+','BBB','BBB-','BB+','BB','BB-','B+','B','B-','NR'];
        // 基础资产类型：可编辑下拉组件，支持搜索
        var UNDERLYING_ASSET_TYPES = ['抖音月付','借呗（信用贷）','美团生活费','对公贷款','应收账款','花呗（信用购）','消费贷','京东金条','美团月付','小微企业贷','美团生意贷','京东白条','京东企业主贷','融资租赁款','抖音放心借','滴水贷','抵押贷款','对公租赁','经营贷','财付通分付'];
        // 专户（资管计划）产品类型枚举
        var ZH_PRODUCT_TYPES = ['其它类基金','另类投资基金','FOF基金','理财'];
        // 非专户账套的产品类型由账套类型决定（固定值）
        var FIXED_PRODUCT_TYPE_MAP = { '信托计划': '信托计划', '结构化（保交所）': '非标准资产支持证券', '碳金融': '碳金融' };
        // 交易市场 -> iBor编码
        var IBOR_TRADE_MARKET_MAP = { '场外市场': 'OF', '银行间': 'IB', '上交所': 'SH', '深交所': 'SZ', '其他': 'OTH' };
        var ASSET_TYPE_MAP = {
            '结构化（保交所）': 'ABS(中保登)',
            '专户（资管计划）': '专户资管产品',
            '信托计划': '信托',
            '碳金融': '碳金融'
        };

        function buildProductTypeOptions(accountType) {
            var sel = document.getElementById('fProductType');
            var hint = document.getElementById('fProductTypeHint');
            if (!accountType) {
                sel.disabled = true;
                sel.innerHTML = '<option value="">请先选择账套类型</option>';
                hint.textContent = '账套类型确认后自动限定枚举';
                return '';
            }
            if (accountType === '专户（资管计划）') {
                sel.disabled = false;
                var html = '<option value="">请选择</option>';
                ZH_PRODUCT_TYPES.forEach(function(t) { html += '<option value="' + t + '">' + t + '</option>'; });
                sel.innerHTML = html;
                hint.textContent = '枚举：其它类基金/另类投资基金/FOF基金/理财';
                return '';
            }
            var fixed = FIXED_PRODUCT_TYPE_MAP[accountType];
            sel.innerHTML = '<option value="' + fixed + '">' + fixed + '</option>';
            sel.value = fixed;
            sel.disabled = true;
            hint.textContent = '由账套类型决定，固定为：' + fixed;
            return fixed;
        }

        // ============ PRD 下拉组件：可搜索/可编辑下拉（信用评级、基础资产类型、区域市场） ============
        var _combos = {};

        function escHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 可维护选项（区域市场）持久化到 localStorage
        function comboStored(key) {
            try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
        }
        function comboPersist(key, arr) {
            try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {}
        }

        // cfg: { id, label, required, hint, placeholder, items, allowCustom, manageable, storageKey }
        function comboField(cfg) {
            _combos[cfg.id] = cfg;
            cfg.state = { adding: false, renamingIdx: -1 };
            var star = cfg.required ? ' <span class="required-star">*</span>' : '';
            return '<div class="form-group combo-field" id="combo-wrap-' + cfg.id + '">' +
                '<label>' + cfg.label + star + '</label>' +
                '<div class="combo-box">' +
                '<input type="text" id="' + cfg.id + '" autocomplete="off" placeholder="' + (cfg.placeholder || '') + '"' + (cfg.required ? ' required' : '') +
                ' onclick="comboOpen(\'' + cfg.id + '\')" onfocus="comboOpen(\'' + cfg.id + '\')" oninput="comboOpen(\'' + cfg.id + '\')" onkeydown="comboInputKey(event, \'' + cfg.id + '\')">' +
                '<span class="combo-caret">▼</span>' +
                '<div class="combo-panel" id="combo-panel-' + cfg.id + '"></div>' +
                '</div>' +
                (cfg.hint ? '<div class="form-hint">' + cfg.hint + '</div>' : '') +
                '</div>';
        }

        function comboItems(id) {
            var cfg = _combos[id];
            if (cfg.storageKey) {
                var stored = comboStored(cfg.storageKey);
                // 首次使用：以预置枚举初始化（之后用户的新增/删除/重命名不再被还原）
                if (stored.length === 0 && cfg.items && cfg.items.length) {
                    stored = cfg.items.slice();
                    comboPersist(cfg.storageKey, stored);
                }
                return stored;
            }
            return typeof cfg.items === 'function' ? cfg.items() : (cfg.items || []);
        }

        function comboRender(id) {
            var cfg = _combos[id];
            var panel = document.getElementById('combo-panel-' + id);
            if (!panel || !cfg) return;
            var input = document.getElementById(id);
            var q = (input.value || '').trim();
            var items = comboItems(id);
            var exactMatch = items.indexOf(q) !== -1;
            var html = '';
            // 重命名编辑行
            if (cfg.state.renamingIdx > -1 && items[cfg.state.renamingIdx] !== undefined) {
                html += '<div class="combo-inline-edit"><input type="text" id="combo-rename-input" value="' + escHtml(items[cfg.state.renamingIdx]) + '"' +
                    ' onkeydown="comboEditKey(event, \'' + id + '\', \'rename\')">' +
                    '<span class="combo-op ok" title="保存" onclick="comboRenameCommit(\'' + id + '\')">✓</span>' +
                    '<span class="combo-op" title="取消" onclick="comboRenameCancel(\'' + id + '\')">✕</span></div>';
            }
            // 新增编辑行
            if (cfg.state.adding) {
                html += '<div class="combo-inline-edit"><input type="text" id="combo-add-input" placeholder="输入新选项名称"' +
                    ' onkeydown="comboEditKey(event, \'' + id + '\', \'add\')">' +
                    '<span class="combo-op ok" title="保存" onclick="comboAddCommit(\'' + id + '\')">✓</span>' +
                    '<span class="combo-op" title="取消" onclick="comboAddCancel(\'' + id + '\')">✕</span></div>';
            }
            var shown = 0;
            items.forEach(function(item, idx) {
                if (cfg.state.renamingIdx === idx) return;
                if (q && item.indexOf(q) === -1) return;
                shown++;
                var ops = '';
                if (cfg.manageable) {
                    ops = '<span class="combo-ops">' +
                        '<span class="combo-op" title="重命名" onclick="comboRenameStart(\'' + id + '\',' + idx + ',event)">✎</span>' +
                        '<span class="combo-op" title="删除" onclick="comboRemove(\'' + id + '\',' + idx + ',event)">✕</span></span>';
                }
                var active = item === input.value ? ' active' : '';
                html += '<div class="combo-item' + active + '" onclick="comboSelect(\'' + id + '\',' + idx + ')"><span class="combo-item-label">' + escHtml(item) + '</span>' + ops + '</div>';
            });
            // 自定义输入行（输入内容不在选项中时出现）
            if (cfg.allowCustom && q && !exactMatch) {
                html += '<div class="combo-add-row" onclick="comboUseCustom(\'' + id + '\')">＋ ' + (cfg.manageable ? '新增并使用「' : '使用「') + escHtml(q) + '」</div>';
            }
            // 管理行：新增选项
            if (cfg.manageable && !cfg.state.adding) {
                html += '<div class="combo-add-row" onclick="comboAddStart(\'' + id + '\')">＋ 新增选项</div>';
            }
            if (shown === 0 && !(cfg.allowCustom && q) && !cfg.state.adding) {
                html += '<div class="combo-empty">' + (cfg.manageable ? '暂无选项，点击下方「新增选项」添加' : '无匹配选项') + '</div>';
            }
            panel.innerHTML = html;
        }

        function comboOpen(id) {
            var cfg = _combos[id];
            if (!cfg) return;
            // 关闭其它下拉
            Object.keys(_combos).forEach(function(k) {
                if (k !== id) {
                    var c = _combos[k];
                    c.state.adding = false; c.state.renamingIdx = -1;
                    var p = document.getElementById('combo-panel-' + k);
                    if (p) p.classList.remove('show');
                }
            });
            var panel = document.getElementById('combo-panel-' + id);
            if (panel) panel.classList.add('show');
            comboRender(id);
        }

        function comboClose(id) {
            var cfg = _combos[id];
            if (!cfg) return;
            cfg.state.adding = false;
            cfg.state.renamingIdx = -1;
            var panel = document.getElementById('combo-panel-' + id);
            if (panel) panel.classList.remove('show');
        }

        function comboSelect(id, idx) {
            var items = comboItems(id);
            var input = document.getElementById(id);
            if (items[idx] !== undefined) input.value = items[idx];
            comboClose(id);
        }

        // 使用自定义输入值；manageable 时同时加入选项库
        function comboUseCustom(id) {
            var cfg = _combos[id];
            var input = document.getElementById(id);
            var val = input.value.trim();
            if (!val) return;
            if (cfg.storageKey) {
                var items = comboStored(cfg.storageKey);
                if (items.indexOf(val) === -1) { items.push(val); comboPersist(cfg.storageKey, items); }
            }
            input.value = val;
            comboClose(id);
        }

        function comboAddStart(id) {
            var cfg = _combos[id];
            cfg.state.adding = true; cfg.state.renamingIdx = -1;
            comboRender(id);
            var el = document.getElementById('combo-add-input');
            if (el) el.focus();
        }

        function comboAddCancel(id) { _combos[id].state.adding = false; comboRender(id); }

        function comboAddCommit(id) {
            var cfg = _combos[id];
            var el = document.getElementById('combo-add-input');
            if (!el) return;
            var val = el.value.trim();
            if (!val) { alert('请输入选项名称'); return; }
            var items = comboItems(id);
            if (items.indexOf(val) !== -1) { alert('选项「' + val + '」已存在'); return; }
            items.push(val);
            if (cfg.storageKey) comboPersist(cfg.storageKey, items);
            cfg.state.adding = false;
            comboRender(id);
        }

        function comboRenameStart(id, idx, e) {
            if (e) e.stopPropagation();
            var cfg = _combos[id];
            cfg.state.renamingIdx = idx; cfg.state.adding = false;
            comboRender(id);
            var el = document.getElementById('combo-rename-input');
            if (el) { el.focus(); el.select(); }
        }

        function comboRenameCancel(id) { _combos[id].state.renamingIdx = -1; comboRender(id); }

        function comboRenameCommit(id) {
            var cfg = _combos[id];
            var el = document.getElementById('combo-rename-input');
            if (!el) return;
            var val = el.value.trim();
            var items = comboItems(id);
            var idx = cfg.state.renamingIdx;
            if (!val) { alert('选项名称不能为空'); return; }
            if (items.indexOf(val) !== -1 && items[idx] !== val) { alert('选项「' + val + '」已存在'); return; }
            var old = items[idx];
            items[idx] = val;
            if (cfg.storageKey) comboPersist(cfg.storageKey, items);
            // 若当前选中值正是被改名项，同步输入框
            var input = document.getElementById(id);
            if (input && input.value === old) input.value = val;
            cfg.state.renamingIdx = -1;
            comboRender(id);
        }

        function comboRemove(id, idx, e) {
            if (e) e.stopPropagation();
            var cfg = _combos[id];
            var items = comboItems(id);
            var val = items[idx];
            if (val === undefined) return;
            if (!confirm('确定删除选项「' + val + '」？')) return;
            items.splice(idx, 1);
            if (cfg.storageKey) comboPersist(cfg.storageKey, items);
            comboRender(id);
        }

        // 主输入框键盘：Enter 确认（已存在则关闭，可自定义则采用），Escape 关闭
        function comboInputKey(e, id) {
            if (e.key === 'Escape') { comboClose(id); return; }
            if (e.key !== 'Enter') return;
            e.preventDefault();
            var cfg = _combos[id];
            var input = document.getElementById(id);
            var val = input.value.trim();
            if (!val) return;
            if (comboItems(id).indexOf(val) !== -1) { comboClose(id); return; }
            if (cfg.allowCustom) comboUseCustom(id);
        }

        // 编辑行键盘：Enter 保存，Escape 取消
        function comboEditKey(e, id, action) {
            if (e.key === 'Enter') { e.preventDefault(); if (action === 'add') comboAddCommit(id); else comboRenameCommit(id); }
            if (e.key === 'Escape') { e.stopPropagation(); if (action === 'add') comboAddCancel(id); else comboRenameCancel(id); }
        }

        // 按sheet（账套类型）校验必填字段与枚举值；任一条件或枚举值不满足即拒绝提交
        function validateBatchRows(rows) {
            var errors = [];
            var codeMap = {};
            rows.forEach(function(r) {
                var sheetName = r.sheet || '未知sheet';
                if (!r.sheet) errors.push({ sheet: sheetName, row: r.row, reason: 'sheet名为空（无法识别账套类型）' });
                if (VALID_ACCOUNT_TYPES.indexOf(r.sheet) === -1 && r.sheet) {
                    errors.push({ sheet: sheetName, row: r.row, reason: 'sheet名【' + r.sheet + '】不在四个标准sheet范围内（专户（资管计划）/信托计划/结构化（保交所）/碳金融）' });
                }
                if (!r.name) errors.push({ sheet: sheetName, row: r.row, reason: '产品名称为空（必填字段缺失）' });
                if (!r.productType) errors.push({ sheet: sheetName, row: r.row, reason: '产品类型为空（必填字段缺失）' });
                if (!r.accountType) errors.push({ sheet: sheetName, row: r.row, reason: '账套类型为空（必填字段缺失）' });
                if (!r.group) errors.push({ sheet: sheetName, row: r.row, reason: '投资组为空（必填字段缺失）' });
                if (r.hengtaiCode) {
                    var codeOk = /^(XT|ABS|TJ)\d{11}$/.test(r.hengtaiCode);
                    if (!codeOk) errors.push({ sheet: sheetName, row: r.row, reason: '内部编码格式不正确（应为XT/ABS/TJ+11位数字）' });
                    if (codeMap[r.hengtaiCode]) errors.push({ sheet: sheetName, row: r.row, reason: '内部编码与【' + codeMap[r.hengtaiCode].sheet + '】第' + codeMap[r.hengtaiCode].row + '行重复' });
                    else codeMap[r.hengtaiCode] = { sheet: sheetName, row: r.row };
                } else {
                    errors.push({ sheet: sheetName, row: r.row, reason: '内部编码为空（必填字段缺失）' });
                }
                if (r.productType && VALID_PRODUCT_TYPES.indexOf(r.productType) === -1) {
                    errors.push({ sheet: sheetName, row: r.row, reason: '产品类型枚举值不满足（' + r.productType + '不在iBor同步范围内）' });
                }
                if (r.accountType && VALID_ACCOUNT_TYPES.indexOf(r.accountType) === -1) {
                    errors.push({ sheet: sheetName, row: r.row, reason: '账套类型枚举值不满足（' + r.accountType + '不在iBor同步范围内）' });
                }
                // sheet名与账套类型一致性校验
                if (r.sheet && r.accountType && r.sheet !== r.accountType) {
                    errors.push({ sheet: sheetName, row: r.row, reason: 'sheet名【' + r.sheet + '】与账套类型【' + r.accountType + '】不一致' });
                }
                // 按sheet类型校验专属必填字段与枚举
                var at = r.sheet || r.accountType;
                if (at === '专户（资管计划）') {
                    if (!r.establishDate) errors.push({ sheet: sheetName, row: r.row, reason: '成立/发行日为空（必填字段缺失）' });
                    if (!r.manager) errors.push({ sheet: sheetName, row: r.row, reason: '管理人为空（必填字段缺失）' });
                    if (r.productType && ZH_PRODUCT_TYPES.indexOf(r.productType) === -1) {
                        errors.push({ sheet: sheetName, row: r.row, reason: '产品类型枚举值不满足（专户sheet仅允许：其它类基金/另类投资基金/FOF基金/理财）' });
                    }
                } else if (at === '信托计划') {
                    if (!r.startDate) errors.push({ sheet: sheetName, row: r.row, reason: '开始日期为空（必填字段缺失）' });
                    if (!r.expireDate) errors.push({ sheet: sheetName, row: r.row, reason: '到期日为空（必填字段缺失）' });
                    if (!r.faceValue) errors.push({ sheet: sheetName, row: r.row, reason: '面值为空（必填字段缺失）' });
                    if (!r.totalScale) errors.push({ sheet: sheetName, row: r.row, reason: '产品总规模为空（必填字段缺失）' });
                    if (!r.financier) errors.push({ sheet: sheetName, row: r.row, reason: '融资人为空（必填字段缺失）' });
                    if (!r.manager) errors.push({ sheet: sheetName, row: r.row, reason: '管理人为空（必填字段缺失）' });
                    if (!r.guarantor) errors.push({ sheet: sheetName, row: r.row, reason: '担保人为空（必填字段缺失）' });
                } else if (at === '结构化（保交所）') {
                    if (!r.startDate) errors.push({ sheet: sheetName, row: r.row, reason: '开始日期为空（必填字段缺失）' });
                    if (!r.actualMaturityDate) errors.push({ sheet: sheetName, row: r.row, reason: '实际到期日为空（必填字段缺失）' });
                    if (!r.faceValue) errors.push({ sheet: sheetName, row: r.row, reason: '面值为空（必填字段缺失）' });
                    if (!r.totalScale) errors.push({ sheet: sheetName, row: r.row, reason: '产品总规模为空（必填字段缺失）' });
                    if (!r.concentration) errors.push({ sheet: sheetName, row: r.row, reason: '集中度为空（必填字段缺失）' });
                    if (!r.creditRating) errors.push({ sheet: sheetName, row: r.row, reason: '信用评级为空（必填字段缺失）' });
                    else if (CREDIT_RATINGS.indexOf(r.creditRating) === -1) errors.push({ sheet: sheetName, row: r.row, reason: '信用评级枚举值不满足（' + r.creditRating + '不在AAA~B-、NR范围内）' });
                    if (!r.trancheLevel) errors.push({ sheet: sheetName, row: r.row, reason: '产品层级为空（必填字段缺失）' });
                    else if (VALID_TRANCHE_LEVELS.indexOf(r.trancheLevel) === -1) errors.push({ sheet: sheetName, row: r.row, reason: '产品层级枚举值不满足（' + r.trancheLevel + '不在优先/夹层/次级范围内）' });
                    if (!r.annualYield) errors.push({ sheet: sheetName, row: r.row, reason: '年化收益率为空（必填字段缺失）' });
                } else if (at === '碳金融') {
                    if (!r.regionalMarket) errors.push({ sheet: sheetName, row: r.row, reason: '区域市场为空（必填字段缺失）' });
                    if (!r.counterparty) errors.push({ sheet: sheetName, row: r.row, reason: '交易对手方为空（必填字段缺失）' });
                    if (!r.annualYield) errors.push({ sheet: sheetName, row: r.row, reason: '年化收益率为空（必填字段缺失）' });
                    if (!r.expireDate) errors.push({ sheet: sheetName, row: r.row, reason: '预期到期日为空（必填字段缺失）' });
                }
            });
            return errors;
        }

                    '<tr><td>文件</td><td>文件格式不正确，请上传 .xlsx 格式文件</td></tr>' +
                    '</tbody></table></div>';
                previewEl.style.display = 'none';
                document.getElementById('btnConfirmBatch').disabled = true;
                BATCH_IMPORT_DATA = [];
                return;
            }
            var rows = getMockBatchRows();
            BATCH_IMPORT_DATA = rows;
            var errors = validateBatchRows(rows);
            if (errors.length > 0) {
                // PRD：任一条件或枚举值不满足，展示对应错误信息，拒绝提交；错误表格首列为sheet名
                resultEl.style.display = 'block';
                resultEl.innerHTML = '<div style="color:var(--danger);padding:10px;background:#FEF2F2;border-radius:var(--radius);">❌ 校验失败，共' + errors.length + '个错误，已拒绝提交</div>' +
                    '<div style="margin-top:8px;"><table class="data-table"><thead><tr><th>sheet名</th><th>行号</th><th>错误原因</th></tr></thead><tbody>';
                errors.forEach(function(er) {
                    resultEl.innerHTML += '<tr><td>' + (er.sheet || '-') + '</td><td>第' + er.row + '行</td><td>' + er.reason + '</td></tr>';
                });
                resultEl.innerHTML += '</tbody></table></div>';
                previewEl.style.display = 'none';
                document.getElementById('btnConfirmBatch').disabled = true;
                return;
            }
            resultEl.style.display = 'block';

            previewEl.style.display = 'block';
            previewEl.innerHTML = '<div style="font-size:var(--font-size-sm);font-weight:600;margin-bottom:8px;">数据预览（全部' + rows.length + '条）</div>' +
                '<table class="data-table"><thead><tr><th>sheet名</th><th>行号</th><th>产品名称</th><th>产品类型</th><th>账套类型</th><th>投资组</th><th>内部编码</th><th>外部编码</th></tr></thead><tbody>';
            rows.forEach(function(r) {
                previewEl.innerHTML += '<tr><td>' + (r.sheet || '-') + '</td><td>第' + r.row + '行</td><td>' + (r.name || '-') + '</td><td>' + (r.productType || '-') + '</td><td>' + (r.accountType || '-') + '</td><td>' + (r.group || '-') + '</td><td class="text-mono">' + (r.hengtaiCode || '-') + '</td><td class="text-mono">' + (r.externalCode || '-') + '</td></tr>';
            });
            previewEl.innerHTML += '</tbody></table>';
            document.getElementById('btnConfirmBatch').disabled = false;
        });

        function confirmBatchImport() {
            if (!BATCH_IMPORT_DATA || BATCH_IMPORT_DATA.length === 0) return;
            if (!confirm('确认批量提交' + BATCH_IMPORT_DATA.length + '个产品入池申请？')) return;
            alert('已批量提交' + BATCH_IMPORT_DATA.length + '个产品入池申请');
            closeBatchImportModal();
            renderStats();
            renderTable();
        }

        if (_perm.canAddProduct && !_perm.isReadOnly) {
            document.getElementById('btnAddProduct').style.display = '';
        }
        if (_perm.canBatchImport && !_perm.isReadOnly) {
            document.getElementById('btnBatchImport').style.display = '';
        }

        renderStats();
        renderAccountCascadeList();
        renderStatusCheckList();
        updateSortIndicators();
        renderTable();

        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('batchImportModal')) closeBatchImportModal();
        });
    </script>
</body>
</html>
