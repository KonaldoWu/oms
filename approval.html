<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委外投资业务一体化订单管理平台 - 审批中心</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-bar { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 2px solid var(--border); }
        .tab-item { padding: 8px 20px; font-size: var(--font-size-sm); font-weight: 500; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
        .tab-item:hover { color: var(--primary); }
        .tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .filter-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; text-align: center; cursor: pointer; transition: all 0.15s; }
        .filter-card:hover { border-color: var(--primary); }
        .filter-card.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
        .filter-card .stat-label { font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: 2px; }
        .filter-card .stat-value { font-size: var(--font-size-lg); font-weight: 700; color: var(--text-primary); font-family: var(--font-mono); }
        .approval-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; transition: all 0.15s; }
        .approval-card:hover { box-shadow: var(--shadow); border-color: var(--primary); }
        .approval-card .card-icon { width: 40px; height: 40px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .approval-card .card-icon.icon-plan { background: var(--info-bg); }
        .approval-card .card-icon.icon-product { background: var(--success-bg); }
        .approval-card .card-icon.icon-counterparty { background: var(--warning-bg); }
        .approval-card .card-icon.icon-trade { background: #F5F3FF; }
        .approval-card .card-icon.icon-finance { background: #FFF7ED; }
        .approval-card .card-info { flex: 1; min-width: 0; }
        .approval-card .card-type-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .approval-card .card-type-tag { font-size: var(--font-size-xs); font-weight: 600; color: var(--primary); background: var(--info-bg); padding: 1px 8px; border-radius: 3px; }
        .approval-card .card-object { font-weight: 600; color: var(--text-primary); font-size: var(--font-size-md); }
        .approval-card .card-object-ref { font-size: var(--font-size-xs); color: var(--text-muted); font-family: var(--font-mono); }
        .approval-card .card-meta { display: flex; gap: 16px; font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: 6px; flex-wrap: wrap; }
        .approval-card .card-meta span { display: inline-flex; align-items: center; gap: 3px; }
        .approval-card .card-step { font-size: var(--font-size-xs); color: var(--primary); font-weight: 500; background: var(--info-bg); padding: 2px 8px; border-radius: 3px; display: inline-block; }
        .approval-card .card-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: flex-start; }
        .timeline { position: relative; padding-left: 24px; }
        .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
        .timeline-item { position: relative; padding-bottom: 20px; }
        .timeline-item:last-child { padding-bottom: 0; }
        .timeline-dot { position: absolute; left: -20px; top: 2px; width: 12px; height: 12px; border-radius: 50%; z-index: 1; }
        .timeline-dot.completed { background: var(--success, #22c55e); }
        .timeline-dot.current { background: var(--primary, #3b82f6); box-shadow: 0 0 0 4px rgba(59,130,246,0.2); }
        .timeline-dot.pending { background: var(--border, #e5e7eb); }
        .timeline-dot.rejected { background: var(--danger, #ef4444); }
        .timeline-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); }
        .timeline-title.pending-title { color: var(--text-muted); }
        .timeline-user { font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px; }
        .timeline-time { font-size: var(--font-size-xs); color: var(--text-muted); margin-top: 1px; }
        .timeline-reason { font-size: var(--font-size-xs); color: var(--danger); margin-top: 2px; padding: 4px 8px; background: #FEF2F2; border-radius: 3px; }
        .detail-section-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .detail-object-link { color: var(--primary); cursor: pointer; text-decoration: underline; }
        .detail-object-link:hover { color: var(--primary-dark, #2563eb); }
        .plan-file-link { color: var(--primary); cursor: pointer; text-decoration: underline; }
        .plan-file-link:hover { color: var(--primary-dark, #2563eb); }
        .opinion-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--font-size-sm); resize: vertical; min-height: 60px; margin-top: 8px; }
        .opinion-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
        .voucher-row { display: grid; grid-template-columns: 2fr 2fr 2fr 1.5fr; gap: 8px; margin-bottom: 6px; padding: 6px 0; border-bottom: 1px solid var(--border-light); }
        .voucher-row:last-child { border-bottom: none; }
        /* ===== 账套类型树形选择器（账套大类 → E列账户名称） ===== */
        .cascade-filter { position: relative; flex: none; }
        .cascade-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; cursor: pointer; text-align: left; background: var(--surface); white-space: nowrap; overflow: hidden; }
        .cascade-trigger .caret { font-size: 10px; color: var(--text-muted); margin-left: 6px; flex: none; }
        .cascade-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; flex-direction: row; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 340px; max-height: 280px; overflow: hidden; }
        .cascade-panel.show { display: flex; }
        .cascade-col { min-width: 110px; max-height: 280px; overflow-y: auto; border-right: 1px solid var(--border-light); }
        .cascade-col:last-child { border-right: none; }
        .cascade-col-header { padding: 6px 12px; font-size: var(--font-size-xs); color: var(--text-muted); background: var(--border-light); position: sticky; top: 0; }
        .cascade-item { padding: 7px 12px; font-size: var(--font-size-sm); cursor: pointer; white-space: nowrap; color: var(--text-secondary); }
        .cascade-item:hover { background: var(--info-bg); color: var(--primary); }
        .cascade-item.active { background: var(--info-bg); color: var(--primary); font-weight: 600; }
        .cascade-item.all { color: var(--text-muted); }
        .cascade-check { display: flex; align-items: center; gap: 6px; }
        .cascade-check input[type="checkbox"] { margin: 0; cursor: pointer; flex: none; }
        /* ===== 审批详情抽屉（参考正式平台右侧抽屉式详情） ===== */
        #detailModal .modal-content.drawer { position: fixed; top: 0; right: 0; bottom: 0; left: auto; width: 660px; max-width: 94vw; height: 100vh; max-height: none; margin: 0; border-radius: 0; display: flex; flex-direction: column; transform: none; animation: drawerIn 0.18s ease-out; }
        @keyframes drawerIn { from { transform: translateX(60px); opacity: 0.5; } to { transform: none; opacity: 1; } }
        #detailModal .modal-content.drawer .modal-header { flex: none; }
        #detailModal .modal-content.drawer .modal-body { flex: 1; overflow-y: auto; }
        #detailModal .modal-content.drawer .modal-footer { flex: none; }
        .drawer-title-badge { margin-left: 8px; vertical-align: middle; }
        /* ===== 审批流程：横向步骤条 ===== */
        .step-bar { display: flex; align-items: flex-start; margin: 8px 0 14px; overflow-x: auto; padding-bottom: 2px; }
        .step-node { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 64px; position: relative; }
        .step-dot { width: 14px; height: 14px; border-radius: 50%; background: #cbd5e1; z-index: 1; flex: none; }
        .step-dot.done { background: var(--success, #22c55e); }
        .step-dot.current { background: var(--primary, #3b82f6); box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .step-dot.rejected { background: var(--danger, #ef4444); }
        .step-line { position: absolute; top: 7px; left: calc(-50% + 7px); right: calc(50% + 7px); height: 2px; background: var(--border); }
        .step-node:first-child .step-line { display: none; }
        .step-line.done { background: var(--success, #22c55e); }
        .step-name { margin-top: 5px; font-size: 11px; color: var(--text-secondary); text-align: center; line-height: 1.3; }
        .step-name.current { color: var(--primary); font-weight: 600; }
        .step-name.pending { color: var(--text-muted); }
        /* ===== 审批流程：节点明细表格 ===== */
        .step-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-xs); margin-bottom: 6px; }
        .step-table th, .step-table td { padding: 6px 10px; border-bottom: 1px solid var(--border-light); text-align: left; vertical-align: top; }
        .step-table th { color: var(--text-muted); font-weight: 500; background: var(--border-light); white-space: nowrap; }
        .step-table td .cell-remark { color: var(--text-secondary); }
        /* 产品明细表格（计划书审批-申请信息） */
        .apply-product-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-xs); margin: 4px 0 10px; }
        .apply-product-table th, .apply-product-table td { padding: 6px 8px; border: 1px solid var(--border-light); text-align: left; }
        .apply-product-table th { background: var(--border-light); color: var(--text-muted); font-weight: 500; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar"></nav>
        <div class="main-area">
            <div class="topbar"></div>
            <div class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <span class="page-title">审批中心</span>
                        <span class="page-subtitle">Approval & Finance</span>
                    </div>
                </div>

                <div class="tab-bar" data-logic-id="page_approval_list">
                    <div class="tab-item active" onclick="switchTab('todo')">待我审批 <span id="tabTodoCount" style="margin-left:4px;font-size:var(--font-size-xs);background:var(--danger);color:#fff;border-radius:8px;padding:1px 6px;">0</span></div>
                    <div class="tab-item" onclick="switchTab('mine')">我发起的 <span id="tabMineCount" style="margin-left:4px;font-size:var(--font-size-xs);color:var(--text-muted);">0</span></div>
                    <div class="tab-item" onclick="switchTab('done')">已审批 <span id="tabDoneCount" style="margin-left:4px;font-size:var(--font-size-xs);color:var(--text-muted);">0</span></div>
                </div>

                <div id="tab-todo" class="tab-content active" data-logic-id="page_approval_list">
                    <div class="card" style="margin-bottom:12px;">
                        <div class="card-body">
                            <div class="search-bar">
                                <select class="search-input" id="typeFilter" style="flex:0 0 130px;">
                                    <option value="">所有审批类型</option>
                                    <option value="产品入池审批">产品入池审批</option>
                                    <option value="投资计划书审批">投资计划书审批</option>
                                    <option value="交易审批">交易审批</option>
                                    <option value="兑息兑付确认">兑息兑付确认</option>
                                </select>
                                <div class="cascade-filter" style="width:220px;">
                                    <button type="button" class="search-input cascade-trigger" onclick="toggleAccountTree(event,'')">
                                        <span id="accountTreeLabel">全部账套类型</span>
                                        <span class="caret">▼</span>
                                    </button>
                                    <div class="cascade-panel" id="accountTreePanel">
                                        <div class="cascade-col" style="width:110px;">
                                            <div class="cascade-col-header">账套大类</div>
                                            <div id="accountTreeCats"></div>
                                        </div>
                                        <div class="cascade-col" style="width:220px;">
                                            <div class="cascade-col-header">E列账户名称</div>
                                            <div id="accountTreeNames"></div>
                                        </div>
                                    </div>
                                </div>
                                <select class="search-input" id="productTypeFilter" style="flex:0 0 105px;"></select>
                                <input type="date" class="search-input" id="dateFrom" style="flex:0 0 140px;" placeholder="开始日期">
                                <input type="date" class="search-input" id="dateTo" style="flex:0 0 140px;" placeholder="结束日期">
                                <input type="text" placeholder="搜索编号、名称或发起人" class="search-input" id="searchInput">
                                <button class="btn btn-primary btn-sm" onclick="renderApprovalList()">搜索</button>
                                <button class="btn btn-ghost btn-sm" onclick="resetApprovalFilters()">重置</button>
                            </div>
                        </div>
                    </div>
                    <div id="approvalList"></div>
                </div>
                <div id="tab-mine" class="tab-content">
                    <div class="card" style="margin-bottom:12px;">
                        <div class="card-body">
                            <div class="search-bar">
                                <select class="search-input" id="typeFilterMine" style="flex:0 0 130px;">
                                    <option value="">所有审批类型</option>
                                    <option value="产品入池审批">产品入池审批</option>
                                    <option value="投资计划书审批">投资计划书审批</option>
                                    <option value="交易审批">交易审批</option>
                                    <option value="兑息兑付确认">兑息兑付确认</option>
                                </select>
                                <select class="search-input" id="statusFilterMine" style="flex:0 0 100px;">
                                    <option value="">所有状态</option>
                                    <option value="草稿">草稿</option>
                                    <option value="审批中">审批中</option>
                                    <option value="执行中">执行中</option>
                                    <option value="已通过">已通过</option>
                                    <option value="已驳回">已驳回</option>
                                    <option value="已撤回">已撤回</option>
                                    <option value="已终止">已终止</option>
                                </select>
                                <div class="cascade-filter" style="width:220px;">
                                    <button type="button" class="search-input cascade-trigger" onclick="toggleAccountTree(event,'Mine')">
                                        <span id="accountTreeLabelMine">全部账套类型</span>
                                        <span class="caret">▼</span>
                                    </button>
                                    <div class="cascade-panel" id="accountTreePanelMine">
                                        <div class="cascade-col" style="width:110px;">
                                            <div class="cascade-col-header">账套大类</div>
                                            <div id="accountTreeCatsMine"></div>
                                        </div>
                                        <div class="cascade-col" style="width:220px;">
                                            <div class="cascade-col-header">E列账户名称</div>
                                            <div id="accountTreeNamesMine"></div>
                                        </div>
                                    </div>
                                </div>
                                <select class="search-input" id="productTypeFilterMine" style="flex:0 0 105px;"></select>
                                <input type="date" class="search-input" id="dateFromMine" style="flex:0 0 140px;" placeholder="开始日期">
                                <input type="date" class="search-input" id="dateToMine" style="flex:0 0 140px;" placeholder="结束日期">
                                <input type="text" placeholder="搜索编号、名称" class="search-input" id="searchInputMine">
                                <button class="btn btn-primary btn-sm" onclick="renderApprovalList()">搜索</button>
                                <button class="btn btn-ghost btn-sm" onclick="resetApprovalFilters()">重置</button>
                            </div>
                        </div>
                    </div>
                    <div id="approvalListMine"></div>
                </div>
                <div id="tab-done" class="tab-content">
                    <div class="card" style="margin-bottom:12px;">
                        <div class="card-body">
                            <div class="search-bar">
                                <select class="search-input" id="typeFilterDone" style="flex:0 0 130px;">
                                    <option value="">所有审批类型</option>
                                    <option value="产品入池审批">产品入池审批</option>
                                    <option value="投资计划书审批">投资计划书审批</option>
                                    <option value="交易审批">交易审批</option>
                                    <option value="兑息兑付确认">兑息兑付确认</option>
                                </select>
                                <select class="search-input" id="statusFilterDone" style="flex:0 0 100px;">
                                    <option value="">所有状态</option>
                                    <option value="审批中">审批中</option>
                                    <option value="执行中">执行中</option>
                                    <option value="已通过">已通过</option>
                                    <option value="已驳回">已驳回</option>
                                    <option value="已撤回">已撤回</option>
                                    <option value="已终止">已终止</option>
                                </select>
                                <div class="cascade-filter" style="width:220px;">
                                    <button type="button" class="search-input cascade-trigger" onclick="toggleAccountTree(event,'Done')">
                                        <span id="accountTreeLabelDone">全部账套类型</span>
                                        <span class="caret">▼</span>
                                    </button>
                                    <div class="cascade-panel" id="accountTreePanelDone">
                                        <div class="cascade-col" style="width:110px;">
                                            <div class="cascade-col-header">账套大类</div>
                                            <div id="accountTreeCatsDone"></div>
                                        </div>
                                        <div class="cascade-col" style="width:220px;">
                                            <div class="cascade-col-header">E列账户名称</div>
                                            <div id="accountTreeNamesDone"></div>
                                        </div>
                                    </div>
                                </div>
                                <select class="search-input" id="productTypeFilterDone" style="flex:0 0 105px;"></select>
                                <input type="date" class="search-input" id="dateFromDone" style="flex:0 0 140px;" placeholder="开始日期">
                                <input type="date" class="search-input" id="dateToDone" style="flex:0 0 140px;" placeholder="结束日期">
                                <input type="text" placeholder="搜索编号、名称" class="search-input" id="searchInputDone">
                                <button class="btn btn-primary btn-sm" onclick="renderApprovalList()">搜索</button>
                                <button class="btn btn-ghost btn-sm" onclick="resetApprovalFilters()">重置</button>
                            </div>
                        </div>
                    </div>
                    <div id="approvalListDone"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal" data-logic-id="modal_approval_detail">
        <div class="modal-content drawer">
            <div class="modal-header">
                <h3 id="detailModalTitle">审批详情</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
            <div class="modal-footer" id="detailModalFooter"></div>
        </div>
    </div>

    <!-- 计划书附件预览弹窗 -->
    <div id="planFileViewModal" class="modal" data-logic-id="modal_plan_file_view">
        <div class="modal-content" style="width:560px;">
            <div class="modal-header">
                <h3>附件预览</h3>
                <button class="btn btn-ghost btn-sm" onclick="document.getElementById('planFileViewModal').style.display='none'">✕</button>
            </div>
            <div class="modal-body" id="planFileViewBody"></div>
        </div>
    </div>

    <div id="rejectModal" class="modal" data-logic-id="modal_approval_detail">
        <div class="modal-content" style="width:480px;">
            <div class="modal-header">
                <h3>驳回审批</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeRejectModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>驳回原因 <span style="color:var(--danger);">*</span></label>
                    <textarea id="rejectReason" rows="4" placeholder="请输入驳回原因（必填）..." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);resize:vertical;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeRejectModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmReject()">确认驳回</button>
            </div>
        </div>
    </div>

    <div id="terminateModal" class="modal" data-logic-id="modal_approval_detail">
        <div class="modal-content" style="width:480px;">
            <div class="modal-header">
                <h3>终止审批</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeTerminateModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>终止原因 <span style="color:var(--danger);">*</span></label>
                    <textarea id="terminateReason" rows="4" placeholder="请输入终止原因（必填）..." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);resize:vertical;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeTerminateModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmTerminate()">确认终止</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        initLayout('approval.html', '审批中心');

        var _approvePlan = hasPermission('approvePlan');
        var _approveProduct = hasPermission('approveProduct');
        var _isReadOnly = isReadOnly();
        var _currentRole = getCurrentRole();
        var _currentRoleLabel = _currentRole.label;

        var APPROVAL_TYPE_PERM = {
            '投资计划书审批': 'approvePlan',
            '产品入池审批': 'approveProduct',
            '交易审批': 'approvePlan'
        };

        var currentRejectId = null;

        // 赎回新流程（7节点）交易审批：按当前节点匹配可操作角色；其余节点沿用原权限位
        function getTradeStepRole(stepTitle) {
            if (stepTitle.indexOf('交易员确认') === 0) return 'trader';
            switch (stepTitle) {
                case '投资经理审批': return 'investment_manager';
                case '风控审批': return 'risk_control';
                case '部门经理审批': return 'department_leader';
                case '交易执行中-财务对账确认': return 'financial_staff';
                case '交易员补充信息': return 'trader';
                default: return null;
            }
        }
        function canApproveApproval(a) {
            if (a.type !== '交易审批') {
                var k = APPROVAL_TYPE_PERM[a.type];
                return k ? hasPermission(k) : false;
            }
            var step = a.steps.find(function(s) { return s.status === '当前'; });
            if (!step) return false;
            var stepRole = getTradeStepRole(step.title);
            if (stepRole) {
                var roleKey = getCurrentRoleKey();
                return roleKey === stepRole || roleKey === 'demo';
            }
            return hasPermission('approvePlan');
        }

        var TYPE_CONFIG = {
            '投资计划书审批': { key: 'plan', icon: '📋', iconClass: 'icon-plan', label: '计划书审批' },
            '产品入池审批': { key: 'product', icon: '📦', iconClass: 'icon-product', label: '产品入池' },
            '交易审批': { key: 'trade', icon: '💱', iconClass: 'icon-trade', label: '交易审批' },
            '兑息兑付确认': { key: 'dividend', icon: '💵', iconClass: 'icon-finance', label: '兑息兑付' }
        };

        var OBJECT_LINK_MAP = {
            '投资计划书审批': 'trade.html',
            '产品入池审批': 'product.html',
            '交易审批': 'trade.html',
            '兑息兑付确认': 'finance.html'
        };

        var currentTab = 'todo';
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            var tabIdx = ['todo','mine','done'].indexOf(tab);
            document.querySelectorAll('.tab-item')[tabIdx].classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            renderApprovalList();
        }

        function getCurrentStep(a) {
            var step = a.steps.find(function(s) { return s.status === '当前'; });
            return step ? step.title : (a.status === '已通过' ? '已完成' : a.status === '已驳回' ? '已驳回' : '-');
        }

        // ===== 账套类型树形选择器（账套大类 → E列账户名称，参考产品管理两级级联） =====
        var _acctTreeState = { '': { cat: '', names: [] }, 'Mine': { cat: '', names: [] }, 'Done': { cat: '', names: [] } };

        function renderAccountTree(sfx) {
            var st = _acctTreeState[sfx];
            var catHtml = '<div class="cascade-item all' + (!st.cat ? ' active' : '') + '" onclick="selectAcctCat(\'' + sfx + '\',\'\')">全部大类</div>';
            Object.keys(ACCOUNT_TREE).forEach(function(c) {
                catHtml += '<div class="cascade-item' + (st.cat === c ? ' active' : '') + '" onclick="selectAcctCat(\'' + sfx + '\',\'' + c + '\')">' + c + '</div>';
            });
            document.getElementById('accountTreeCats' + sfx).innerHTML = catHtml;

            var names = st.cat ? (ACCOUNT_TREE[st.cat] || []) : [].concat.apply([], Object.keys(ACCOUNT_TREE).map(function(k) { return ACCOUNT_TREE[k]; }));
            var nameHtml = '<div class="cascade-item all' + (st.names.length === 0 ? ' active' : '') + '" onclick="clearAcctNames(\'' + sfx + '\')">全部账户</div>';
            names.forEach(function(n) {
                var checked = st.names.indexOf(n) !== -1 ? ' checked' : '';
                nameHtml += '<label class="cascade-item cascade-check"><input type="checkbox" value="' + n + '"' + checked + ' onchange="toggleAcctName(\'' + sfx + '\',\'' + n + '\')">' + n + '</label>';
            });
            document.getElementById('accountTreeNames' + sfx).innerHTML = nameHtml;
            updateAcctTreeLabel(sfx);
        }
        function selectAcctCat(sfx, cat) {
            _acctTreeState[sfx].cat = cat;
            _acctTreeState[sfx].names = [];
            renderAccountTree(sfx);
        }
        function toggleAcctName(sfx, n) {
            var arr = _acctTreeState[sfx].names;
            var idx = arr.indexOf(n);
            if (idx === -1) arr.push(n); else arr.splice(idx, 1);
            renderAccountTree(sfx);
        }
        function clearAcctNames(sfx) {
            _acctTreeState[sfx].names = [];
            renderAccountTree(sfx);
        }
        function updateAcctTreeLabel(sfx) {
            var st = _acctTreeState[sfx];
            var label = '全部账套类型';
            if (st.cat && st.names.length > 0) label = st.cat + ' / ' + st.names.join('、');
            else if (st.cat) label = st.cat + '（全部账户）';
            else if (st.names.length > 0) label = st.names.join('、');
            document.getElementById('accountTreeLabel' + sfx).textContent = label;
        }
        function toggleAccountTree(e, sfx) {
            if (e) e.stopPropagation();
            var panel = document.getElementById('accountTreePanel' + sfx);
            var willShow = !panel.classList.contains('show');
            document.querySelectorAll('.cascade-panel').forEach(function(p) { p.classList.remove('show'); });
            if (willShow) panel.classList.add('show');
        }
        // 账套匹配：选定账户精确匹配；仅选大类按大类前缀匹配
        function matchAcctTree(p, st) {
            if (st.names.length > 0) return st.names.indexOf(p.accountType) !== -1;
            if (st.cat) {
                var full = getAccountCategory(p.accountType) || '';
                return full === st.cat || full.indexOf(st.cat) === 0;
            }
            return true;
        }

        // 初始化三个Tab的筛选项（账套类型树形选择器 + 产品类型选项动态生成）
        function initApprovalFilters() {
            ['', 'Mine', 'Done'].forEach(function(sfx) {
                renderAccountTree(sfx);
                var ptSel = document.getElementById('productTypeFilter' + sfx);
                if (ptSel) {
                    var types = [];
                    PRODUCTS.forEach(function(p) { if (p.productType && types.indexOf(p.productType) < 0) types.push(p.productType); });
                    var h2 = '<option value="">产品类型</option>';
                    types.forEach(function(t) { h2 += '<option value="' + t + '">' + t + '</option>'; });
                    ptSel.innerHTML = h2;
                }
            });
        }

        // 按审批类型解析关联产品（用于账套类型/产品类型筛选）
        function getApprovalProduct(a) {
            if (a.type === '产品入池审批') {
                return PRODUCTS.find(function(p) { return p.id === a.object; }) || null;
            }
            if (a.type === '投资计划书审批') {
                var plan = PLANS.find(function(pl) { return pl.id === a.object; });
                if (plan && plan.products && plan.products.length) {
                    return PRODUCTS.find(function(p) { return p.id === plan.products[0]; }) || null;
                }
                return null;
            }
            if (a.type === '交易审批') {
                var t = TRADES.find(function(tr) { return tr.id === a.object; });
                return t ? (PRODUCTS.find(function(p) { return p.id === t.productId; }) || null) : null;
            }
            if (a.type === '兑息兑付确认') {
                var d = DIVIDENDS.find(function(dv) { return dv.id === a.id; });
                return d ? (PRODUCTS.find(function(p) { return p.id === d.productId; }) || null) : null;
            }
            return null;
        }

        function getFilteredApprovals(tab) {
            var sfx = tab === 'todo' ? '' : tab === 'mine' ? 'Mine' : 'Done';
            var typeFilter = document.getElementById('typeFilter' + sfx).value;
            var searchInput = document.getElementById('searchInput' + sfx).value.toLowerCase();
            var dateFrom = document.getElementById('dateFrom' + sfx).value;
            var dateTo = document.getElementById('dateTo' + sfx).value;
            // 待我审批Tab均为审批中数据，不提供状态筛选
            var statusFilter = tab === 'todo' ? '' : document.getElementById('statusFilter' + sfx).value;
            var acctSt = _acctTreeState[sfx];
            var productType = document.getElementById('productTypeFilter' + sfx).value;
            var dividendApprovals = DIVIDENDS.filter(function(d) {
                return d.status === '待交易员确认' || d.status === '交易员已确认';
            }).map(function(d) {
                return buildDividendApproval(d);
            });
            var allApprovals = APPROVALS.concat(dividendApprovals);
            var roleKey = getCurrentRoleKey();
            return allApprovals.filter(function(a) {
                if (!TYPE_CONFIG[a.type]) return false;
                if (typeFilter && a.type !== typeFilter) return false;
                if (statusFilter && a.status !== statusFilter) return false;
                if (searchInput) {
                    var hay = (a.id + a.objectName + a.object + a.applicant).toLowerCase();
                    if (hay.indexOf(searchInput) < 0) return false;
                }
                if (dateFrom && a.applyTime < dateFrom) return false;
                if (dateTo && a.applyTime > dateTo + ' 23:59') return false;
                if (acctSt.cat || acctSt.names.length > 0 || productType) {
                    var p = getApprovalProduct(a);
                    if (!p) return false;
                    if (!matchAcctTree(p, acctSt)) return false;
                    if (productType && p.productType !== productType) return false;
                }
                if (tab === 'todo') {
                    if (a.status !== '审批中') return false;
                    var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
                    if (!currentStep) return false;
                    if (a.type === '兑息兑付确认') {
                        if (currentStep.title === '交易员确认') {
                            if (roleKey !== 'trader' && roleKey !== 'demo') return false;
                        } else if (currentStep.title === '财务最终确认') {
                            if (roleKey !== 'financial_staff' && roleKey !== 'demo') return false;
                        } else {
                            return false;
                        }
                    } else {
                        if (!canApproveApproval(a)) return false;
                    }
                } else if (tab === 'mine') {
                    if (a.applicant !== _currentRoleLabel) return false;
                } else if (tab === 'done') {
                    var hasDone = a.steps.some(function(s) { return s.status === '已完成' && s.user === _currentRoleLabel; });
                    if (!hasDone) return false;
                }
                return true;
            });
        }

        function renderApprovalList() {
            var todoList = getFilteredApprovals('todo');
            var mineList = getFilteredApprovals('mine');
            var doneList = getFilteredApprovals('done');
            document.getElementById('tabTodoCount').textContent = todoList.length;
            document.getElementById('tabMineCount').textContent = mineList.length;
            document.getElementById('tabDoneCount').textContent = doneList.length;
            var container;
            if (currentTab === 'todo') container = document.getElementById('approvalList');
            else if (currentTab === 'mine') container = document.getElementById('approvalListMine');
            else container = document.getElementById('approvalListDone');
            var list = currentTab === 'todo' ? todoList : currentTab === 'mine' ? mineList : doneList;
            if (list.length === 0) {
                container.innerHTML = '<div class="card"><div class="card-body" style="text-align:center;color:var(--text-muted);padding:40px;">暂无审批记录</div></div>';
                return;
            }
            container.innerHTML = list.map(function(a) {
                var cfg = TYPE_CONFIG[a.type] || { icon: '📄', iconClass: 'icon-plan', label: a.type };
                var currentStep = getCurrentStep(a);
                var btns = '<button class="btn btn-info btn-sm" data-logic-id="modal_approval_detail" onclick="viewDetail(\'' + a.id + '\')">查看详情</button>';
                var isPending = a.status === '审批中';
                var canApproveThisType = canApproveApproval(a);
                var isInitiator = a.applicant === _currentRoleLabel;
                if (isPending && !_isReadOnly) {
                    if (canApproveThisType) {
                        var approveBtnText = '通过';
                        var approveBtnCls = 'btn-success';
                        if (currentStep.indexOf('ERP流程') >= 0) {
                            approveBtnText = '模拟完成';
                        } else if (currentStep === '交易执行中-财务对账确认') {
                            approveBtnText = '填写对账单';
                            approveBtnCls = 'btn-primary';
                        } else if (currentStep === '交易员补充信息') {
                            approveBtnText = '前往补充信息';
                            approveBtnCls = 'btn-primary';
                        }
                        btns += ' <button class="btn ' + approveBtnCls + ' btn-sm" data-logic-id="page_approval_list" onclick="viewDetail(\'' + a.id + '\')">' + approveBtnText + '</button>';
                        if (currentStep !== '交易执行中-财务对账确认' && currentStep !== '交易员补充信息') {
                            btns += ' <button class="btn btn-danger btn-sm" onclick="openRejectModal(\'' + a.id + '\')">驳回</button>';
                        }
                    }
                    if (isInitiator) {
                        btns += ' <button class="btn btn-withdraw btn-sm" onclick="withdrawApproval(\'' + a.id + '\')">撤回</button>';
                        btns += ' <button class="btn btn-ghost btn-sm" onclick="openTerminateModal(\'' + a.id + '\')">终止</button>';
                    }
                }
                return '<div class="approval-card">'
                    + '<div class="card-icon ' + cfg.iconClass + '">' + cfg.icon + '</div>'
                    + '<div class="card-info">'
                    + '<div class="card-type-row">'
                    + '<span class="card-type-tag">' + cfg.icon + ' ' + cfg.label + '</span>'
                    + '<span class="status-badge ' + getStatusClass(a.status) + '">' + a.status + '</span>'
                    + '</div>'
                    + '<div class="card-object">' + a.objectName + '</div>'
                    + '<div class="card-object-ref">编号: ' + a.object + '</div>'
                    + '<div class="card-meta">'
                    + '<span>👤 ' + a.applicant + '</span>'
                    + '<span>🕐 ' + a.applyTime + '</span>'
                    + '</div>'
                    + '<span class="card-step">当前节点: ' + currentStep + '</span>'
                    + '</div>'
                    + '<div class="card-actions">' + btns + '</div>'
                    + '</div>';
            }).join('');
        }

        function resetApprovalFilters() {
            ['', 'Mine', 'Done'].forEach(function(sfx) {
                var ids = ['searchInput', 'typeFilter', 'statusFilter', 'productTypeFilter', 'dateFrom', 'dateTo'];
                ids.forEach(function(id) {
                    var el = document.getElementById(id + sfx);
                    if (el) el.value = '';
                });
                _acctTreeState[sfx].cat = '';
                _acctTreeState[sfx].names = [];
                renderAccountTree(sfx);
            });
            renderApprovalList();
        }

        // ===== 详情通用渲染：信息项 =====
        function _infoItem(label, value, span2) {
            var v = (value === undefined || value === null || value === '') ? '-' : value;
            return '<div class="detail-info-item"' + (span2 ? ' style="grid-column:1/3;"' : '') + '><div class="info-label">' + label + '</div><div class="info-value">' + v + '</div></div>';
        }

        // 附件查看：演示环境展示文件信息预览（正式环境为在线预览/下载）
        function viewPlanFile(fileName) {
            var ext = (String(fileName).split('.').pop() || '').toLowerCase();
            var icon = ext === 'pdf' ? '📕' : (ext === 'doc' || ext === 'docx') ? '📘' : (ext === 'xls' || ext === 'xlsx') ? '📗' : '📄';
            var html = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">';
            html += '<span style="font-size:28px;">' + icon + '</span>';
            html += '<div><div style="font-size:14px;font-weight:600;word-break:break-all;">' + fileName + '</div>';
            html += '<div style="font-size:12px;color:var(--text-muted);">格式：' + (ext ? ext.toUpperCase() : '未知') + '</div></div></div>';
            html += '<div style="border:1px dashed var(--border);border-radius:8px;padding:40px 16px;text-align:center;color:var(--text-muted);font-size:12px;background:var(--border-light);">演示环境：附件已随表单提交，正式环境此处展示在线预览内容，并支持下载。</div>';
            document.getElementById('planFileViewBody').innerHTML = html;
            document.getElementById('planFileViewModal').style.display = 'block';
        }

        // ===== 审批流程：横向步骤条 =====
        function renderStepBar(steps) {
            var html = '<div class="step-bar">';
            steps.forEach(function(s) {
                var dot = 'step-dot', line = 'step-line', name = 'step-name';
                if (s.status === '已完成') { dot += s.result === '驳回' ? ' rejected' : ' done'; line += ' done'; }
                else if (s.status === '当前') { dot += ' current'; name += ' current'; }
                else { name += ' pending'; }
                html += '<div class="step-node"><div class="' + line + '"></div><div class="' + dot + '"></div><div class="' + name + '">' + s.title + '</div></div>';
            });
            return html + '</div>';
        }

        // ===== 审批流程：节点明细表格 =====
        function renderStepTable(steps) {
            var html = '<table class="step-table"><thead><tr><th>节点</th><th>处理人</th><th>节点状态</th><th>审批结果</th><th>时间</th><th>备注</th></tr></thead><tbody>';
            steps.forEach(function(s) {
                var result = '-';
                if (s.status === '已完成') result = s.result === '驳回' ? '<span style="color:var(--danger);">驳回</span>' : (s.result || '通过');
                else if (s.status === '当前') result = '<span style="color:var(--primary);">处理中</span>';
                var remark = s.reason || s.opinion || '-';
                html += '<tr><td style="white-space:nowrap;">' + s.title + '</td><td>' + (s.user || '-') + '</td><td>' + s.status + '</td><td>' + result + '</td><td style="white-space:nowrap;">' + (s.time || '-') + '</td><td class="cell-remark">' + remark + '</td></tr>';
            });
            return html + '</tbody></table>';
        }

        // ===== 申请信息：投资计划书审批（计划书表单全部提交字段） =====
        function renderPlanApplyInfo(a) {
            var plan = PLANS.find(function(p) { return p.id === a.object; });
            if (!plan) return '';
            var html = '<div class="detail-section-title">计划书信息（表单提交字段）</div>';
            html += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
            html += _infoItem('计划书名称', plan.name);
            html += _infoItem('业务部门', plan.dept);
            html += _infoItem('投资组', plan.group);
            html += _infoItem('投资经理', plan.creator);
            html += _infoItem('交易员', plan.trader);
            var planFileVal = plan.file
                ? '<span class="plan-file-link" onclick="viewPlanFile(\'' + String(plan.file).replace(/'/g, "\\'") + '\')">📄 ' + plan.file + '</span><span style="font-size:11px;color:var(--text-muted);margin-left:4px;">点击查看</span>'

            var details = plan.productDetails || (plan.products || []).map(function(pid) { return { id: pid }; });
            details.forEach(function(d) {

            });
            return html + '</tbody></table>';

        // ===== 申请信息：产品入池审批（入池表单全部提交字段） =====
        function renderProductApplyInfo(a) {
            var p = PRODUCTS.find(function(x) { return x.id === a.object; });
            if (!p) return '';
            var html = '<div class="detail-section-title">产品入池信息（表单提交字段）</div>';
            html += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
            // 基础信息（所有账套类型通用）
            html += _infoItem('产品名称', p.name);
            html += _infoItem('产品简称', p.shortName);
            html += _infoItem('产品内部编码', p.hengtaiCode);
            html += _infoItem('外部编码', p.externalCode);
            html += _infoItem('账套类型', p.accountType);
            html += _infoItem('资产类型', p.assetType);
            html += _infoItem('产品类型', p.productType);
            html += _infoItem('投资组合ID', getPortfolioId(p.accountType));
            html += _infoItem('币种', p.currency);
            html += _infoItem('交易市场', p.tradeMarket || p.regionalMarket);
            html += _infoItem('成立日期', p.establishDate);
            html += _infoItem('起始日期', p.startDate);
            html += _infoItem('预计到期日', p.expireDate);
            html += _infoItem('所属部门', p.dept);
            html += _infoItem('投资组', p.group);
            html += '</div>';
            // 账套类型专属字段（按入池表单展示，存在才显示）
            var specific = [];
            if (p.manager) specific.push(['管理人', p.manager]);
            if (p.faceValue) specific.push(['面值', p.faceValue]);
            if (p.totalScale) specific.push(['总规模(元)', formatMoneyFull(p.totalScale)]);
            if (p.actualMaturityDate) specific.push(['实际到期日', p.actualMaturityDate]);
            if (p.financier) specific.push(['融资人', p.financier]);
            if (p.guarantor) specific.push(['担保人', p.guarantor]);
            if (p.concentration) specific.push(['集中度', p.concentration]);
            if (p.creditRating) specific.push(['信用评级', p.creditRating]);
            if (p.originator) specific.push(['原始权益人', p.originator]);
            if (p.underlyingAssetType) specific.push(['基础资产类型', p.underlyingAssetType]);
            if (p.trancheLevel) specific.push(['份额级别', p.trancheLevel]);
            if (p.annualYield) specific.push(['年化收益率', p.annualYield + '%']);
            if (p.regionalMarket) specific.push(['区域市场', p.regionalMarket]);
            if (p.counterpartyIbor) specific.push(['对手方(iBor)', p.counterpartyIbor]);
            if (specific.length) {
                html += '<div class="detail-section-title">账套类型专属字段</div>';
                html += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';

            } else if (d.status === '交易员已确认') {
                steps.push({ title: '交易员确认', user: d.traderConfirmUser, time: d.traderConfirmTime, status: '已完成', result: d.traderModified ? '已修改' : '确认', reason: d.traderRemark });
                steps.push({ title: '财务最终确认', user: d.initiator, time: '', status: '当前' });

            steps.push({ title: '推送iBor', user: '系统', time: '', status: '待处理' });
            return {
                id: d.id,
                type: '兑息兑付确认',
                object: d.id,
                objectName: d.productName + ' - 利息' + d.interestPer100 + '/本金' + d.principalPer100 + '(每百元)',
                applicant: d.initiator,
                applyTime: d.createTime,

                steps: steps,

        function confirmDividend(dividendId, isFinal) {
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            if (!isFinal) {
                var modified = false;
                var modifyRemark = [];
                var newDate = document.getElementById('divEditDate').value;
                var newInterest = parseFloat(document.getElementById('divEditInterest').value);
                var newPrincipal = parseFloat(document.getElementById('divEditPrincipal').value);
                var newRemark = document.getElementById('divEditRemark').value;
                var traderRemark = document.getElementById('divTraderRemark').value;

                if (newDate !== d.divDate) { modifyRemark.push('兑付日期从' + d.divDate + '改为' + newDate); d.divDate = newDate; modified = true; }
                if (newInterest !== d.interestPer100) { modifyRemark.push('每百元应付利息从' + d.interestPer100 + '调整为' + newInterest); d.interestPer100 = newInterest; modified = true; }
                if (newPrincipal !== d.principalPer100) { modifyRemark.push('每百元应付本金从' + d.principalPer100 + '调整为' + newPrincipal); d.principalPer100 = newPrincipal; modified = true; }
                if (newRemark !== d.remark) { d.remark = newRemark; modified = true; }

                d.traderConfirmUser = role.label;
                d.traderConfirmTime = nowStr;
                d.traderModified = modified;
                d.traderRemark = traderRemark || (modified ? modifyRemark.join('，') : '确认无误');
                d.status = '交易员已确认';
                d.history.push({ user: role.label, action: '交易员确认' + (modified ? '（已修改字段）' : ''), time: nowStr, remark: d.traderRemark });
            } else {
                d.financeConfirmUser = role.label;
                d.financeConfirmTime = nowStr;
                d.status = '已完成';
                d.history.push({ user: role.label, action: '财务最终确认', time: nowStr, remark: '' });

                var voucherSeq = 1;
                VOUCHERS.forEach(function(v) { if (v.id && v.id.indexOf('VCH' + d.divDate.replace(/-/g,'')) === 0) voucherSeq++; });
                var voucherId = 'VCH' + d.divDate.replace(/-/g,'') + String(voucherSeq).padStart(3,'0');
                VOUCHERS.push({
                    id: voucherId,
                    summary: d.productName + '兑息兑付(利息' + d.interestPer100 + '/本金' + d.principalPer100 + '每百元)',
                    debitAccount: '1122-应收利息',
                    creditAccount: '6001-投资收益',
                    amount: d.interestPer100 + d.principalPer100,
                    maker: role.label,
                    makeTime: nowStr
                });
                d.voucherId = voucherId;
                d.history.push({ user: '系统', action: '生成凭证' + voucherId, time: nowStr, remark: '' });

                var frSeq = 1;
                FINANCES.forEach(function(f) { if (f.id && f.id.indexOf('FR' + d.divDate.replace(/-/g,'')) === 0) frSeq++; });
                FINANCES.push({
                    id: 'FR' + d.divDate.replace(/-/g,'') + String(frSeq).padStart(3,'0'),
                    productId: d.productId,
                    productName: d.productName,
                    changeType: '兑息兑付',
                    changeDate: d.divDate,
                    changeAmount: d.interestPer100 + d.principalPer100,
                    voucherStatus: '待确认',
                    createMethod: '系统自动生成',
                    source: '兑息兑付流程',
                    voucherId: voucherId
                });
            }
            closeDetailModal();
            renderApprovalList();
            alert(isFinal ? '财务最终确认成功！已自动生成凭证' + d.voucherId + '。\n可在【财务核算】模块查看并推送到iBor。' : '交易员确认成功！已转交财务最终确认。');
        }

        function rejectDividend(dividendId) {
            var reason = document.getElementById('divRejectReason').value || document.getElementById('divTraderRemark').value;
            if (!reason) { alert('请填写驳回原因'); return; }
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            d.status = '已驳回';
            d.history.push({ user: role.label, action: '驳回', time: nowStr, remark: reason });
            closeDetailModal();
            renderApprovalList();
            alert('已驳回该兑息兑付申请。');
        }

        function approveItem(id) {
            var a = APPROVALS.find(function(x) { return x.id === id; });
            if (!a) return;
            if (!confirm('确认通过该审批？')) return;
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (currentStep) {
                currentStep.status = '已完成';
                currentStep.time = new Date().toISOString().slice(0, 16).replace('T', ' ');
                var opinionEl = document.getElementById('approvalOpinion');
                if (opinionEl && opinionEl.value.trim()) {
                    currentStep.opinion = opinionEl.value.trim();
                }
                if (a.type === '交易审批') {
                    syncTradeOnStepComplete(a, currentStep);
                }
                var idx = a.steps.indexOf(currentStep);
                var nextStep = null;
                for (var i = idx + 1; i < a.steps.length; i++) {
                    if (a.steps[i].status === '待处理') { nextStep = a.steps[i]; break; }
                }
                if (nextStep) {
                    nextStep.status = '当前';
                } else {
                    a.status = '已通过';
                    if (a.type === '产品入池审批') {
                        var p = PRODUCTS.find(function(pp) { return pp.id === a.object; });
                        if (p && p.status === '无计划') p.status = '无计划';
                    }
                }
            }
            if (a.steps.every(function(s) { return s.status === '已完成'; })) a.status = '已通过';
            // 投资计划书审批全部通过：回写计划书状态为"已通过"（产品方可发起交易）
            if (a.status === '已通过' && a.type === '投资计划书审批') {
                var passPlan = PLANS.find(function(pl) { return pl.id === a.object; });
                if (passPlan) passPlan.status = '已通过';
            }
            alert('审批已通过');
            closeDetailModal();
            renderApprovalList();
        }

        function syncTradeOnStepComplete(approval, completedStep) {
            var trade = TRADES.find(function(t) { return t.id === approval.object; });
            if (!trade) return;
            var title = completedStep.title;
            var now = completedStep.time;
            // 申购/赎回均前置三级审批（PRD（二）（三））
            if (title === '投资经理审批' || title === '风控审批') {
                // 三级审批中间节点：交易保持"交易审批中"
            } else if (title === '部门经理审批') {
                if (trade.erpStep1Status === '不适用') {
                    // 赎回：三级审批全部通过 → 交易执行中（等待财务在审批中心对账确认）
                    trade.status = '交易执行中';
                    trade.remark = '三级审批已通过，待财务对账确认（交易执行中）';
                } else {
                    // 申购：三级审批全部通过 → 自动触发ERP用款流程（步骤1发起）
                    trade.status = '交易执行中';
                    trade.erpStep1Status = '执行中';
                    trade.remark = '三级审批已通过，已自动发起ERP用款流程（资金划拨）';
                }
            } else if (title === '交易员补充信息') {
                // 由交易管理-交易员补充信息表单处理
            } else if (title.indexOf('ERP流程-资金划拨') === 0) {
                // ERP步骤1完成 → 交易执行中（申购）或 还款审批中（赎回）
                trade.erpStep1Status = '已完成';
                trade.erpStep1Time = now;
                if (trade.type === '赎回') {
                    trade.status = '待到账';
                } else {
                    trade.status = '交易执行中';
                }
                if (trade.erpStep2Status === '待执行') trade.erpStep2Status = '执行中';
            } else if (title.indexOf('ERP流程-创新金融') === 0) {
                trade.erpStep2Status = '已完成';
                trade.erpStep2Time = now;
                if (trade.type === '赎回') {
                    trade.status = '还款审批中';
                }
            } else if (title.indexOf('交易员确认') === 0) {
                // 申购终态节点：交易员确认（金额修正+合同上传）通过即流程结束
                trade.traderConfirmStatus = '已确认';
                trade.status = '已结束';
                trade.actualDealAmount = trade.applyAmount;
                trade.traderConfirmTime = now;
                trade.voucherStatus = '待生成';
            }
        }

        // 赎回新流程：财务对账确认（审批中心填写对账表单，提交即代表交易执行成功）
        function confirmFinanceReconcile(approvalId) {
            var a = APPROVALS.find(function(x) { return x.id === approvalId; });
            if (!a) return;
            var trade = TRADES.find(function(t) { return t.id === a.object; });
            if (!trade) { alert('关联交易不存在'); return; }
            var amount = parseFloat(document.getElementById('finRecAmount').value);
            if (isNaN(amount) || amount <= 0) { alert('请输入有效的实际到账金额'); return; }
            var date = document.getElementById('finRecDate').value;
            if (!date) { alert('请选择到账日期'); return; }
            var shares = parseFloat(document.getElementById('finRecShares').value);
            var fee = parseFloat(document.getElementById('finRecFee').value);
            var diff = (document.getElementById('finRecDiff').value || '').trim();
            var fileInput = document.getElementById('finRecFile');
            var fileName = (fileInput && fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : '';
            if (!fileName) { alert('请上传对账单附件（银行回单）'); return; }
            if (Math.abs(amount - trade.applyAmount) > 0.01 && !diff) { alert('实际到账金额与申报金额存在差异，请填写差异说明'); return; }
            if (!confirm('确认提交对账信息？\n\n实际到账金额：' + formatMoney(amount) + '\n到账日期：' + date + '\n\n提交后交易即视为执行成功，流转至交易员补充信息节点。')) return;

            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            trade.financeConfirmStatus = '已确认';
            trade.financeConfirmUser = role.label;
            trade.financeConfirmTime = nowStr;
            trade.actualArrivalAmount = amount;
            trade.actualArrivalDate = date;
            trade.statementFile = fileName;
            trade.redeemFee = isNaN(fee) ? 0 : fee;
            trade.diffRemark = diff || '';
            if (!isNaN(shares) && shares > 0) trade.actualArrivalShares = shares;
            trade.status = '待交易员补充信息';
            trade.remark = '财务已确认对账（实际到账' + formatMoney(amount) + '），待交易员补充信息';

            // 推进审批节点：财务对账确认完成 → 交易员补充信息（当前）
            var step = a.steps.find(function(s) { return s.status === '当前'; });
            if (step) { step.status = '已完成'; step.time = nowStr; step.user = role.label; }
            var next = a.steps.find(function(s) { return s.status === '待处理'; });
            if (next) next.status = '当前';

            alert('对账确认成功，交易已执行！\n\n交易状态变更为"待交易员补充信息"，已通知交易员在【交易管理】补充最终信息。');
            closeDetailModal();
            renderApprovalList();
        }

        function openRejectModal(id) {
            currentRejectId = id;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectModal').style.display = 'block';
        }

        function closeRejectModal() { document.getElementById('rejectModal').style.display = 'none'; currentRejectId = null; }

        function confirmReject() {
            var reason = document.getElementById('rejectReason').value.trim();
            if (!reason) { alert('请输入驳回原因'); return; }
            var a = APPROVALS.find(function(x) { return x.id === currentRejectId; });
            if (!a) return;
            a.status = '已驳回';
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (currentStep) {
                currentStep.status = '已完成';
                currentStep.result = '驳回';
                currentStep.reason = reason;
                currentStep.time = new Date().toISOString().slice(0, 16).replace('T', ' ');
            }
            if (a.type === '交易审批') {
                var trade = TRADES.find(function(t) { return t.id === a.object; });
                if (trade) trade.status = '已驳回';
            }
            // 投资计划书审批驳回：回写计划书状态为"已驳回"
            if (a.type === '投资计划书审批') {
                var rejPlan = PLANS.find(function(pl) { return pl.id === a.object; });
                if (rejPlan) rejPlan.status = '已驳回';
            }
            alert('已驳回');
            closeRejectModal();
            closeDetailModal();
            renderApprovalList();
        }

        function withdrawApproval(id) {
            var a = APPROVALS.find(function(x) { return x.id === id; });
            if (!a) return;
            if (!confirm('确认撤回该审批申请？')) return;
            a.status = '已撤回';
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (currentStep) {
                currentStep.status = '待处理';
            }
            if (a.type === '交易审批') {
                var trade = TRADES.find(function(t) { return t.id === a.object; });
                if (trade) trade.status = '已撤回';
            }
            alert('已撤回');
            closeDetailModal();
            renderApprovalList();
        }

        var currentTerminateId = null;
        function openTerminateModal(id) {
            currentTerminateId = id;
            document.getElementById('terminateReason').value = '';
            document.getElementById('terminateModal').style.display = 'block';
        }
        function closeTerminateModal() {
            document.getElementById('terminateModal').style.display = 'none';
            currentTerminateId = null;
        }
        function confirmTerminate() {
            var reason = document.getElementById('terminateReason').value.trim();
            if (!reason) { alert('请输入终止原因'); return; }
            var a = APPROVALS.find(function(x) { return x.id === currentTerminateId; });
            if (!a) return;
            a.status = '已终止';
            a.terminateReason = reason;
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (currentStep) currentStep.status = '待处理';
            if (a.type === '交易审批') {
                var trade = TRADES.find(function(t) { return t.id === a.object; });
                if (trade) trade.status = '已终止';
            }
            alert('已终止');
            closeTerminateModal();
            closeDetailModal();
            renderApprovalList();
        }

        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('detailModal')) closeDetailModal();
            if (event.target === document.getElementById('rejectModal')) closeRejectModal();
            if (event.target === document.getElementById('terminateModal')) closeTerminateModal();
            if (event.target === document.getElementById('planFileViewModal')) document.getElementById('planFileViewModal').style.display = 'none';
        });

        // 点击账套树形面板外部时收起
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.cascade-filter')) {
                document.querySelectorAll('.cascade-panel').forEach(function(p) { p.classList.remove('show'); });
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            initApprovalFilters();
            renderApprovalList();
            // 支持从通知中心跳转过来自动打开审批详情弹窗
            // openApproval 参数值为业务对象ID（TP/TRX/DV开头）
            var match = location.search.match(/[?&]openApproval=([^&]+)/);
            if (match) {
                var openObj = decodeURIComponent(match[1]);
                var aprId = openObj;
                if (openObj.indexOf('DV') !== 0) {
                    // 投资计划书(TP)/产品交易(TRX)：在APPROVALS中按object字段查找对应审批ID
                    var apr = APPROVALS.find(function(a) { return a.object === openObj; });
                    if (!apr) return;
                    aprId = apr.id;
                }
                // DV开头为兑息兑付，viewDetail内部会自动用DIVIDENDS查找
                viewDetail(aprId);
            }
        });
    </script>
</body>
</html>
