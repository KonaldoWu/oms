        function buildDividendApproval(d) {
            // 流程：财务发起 → 交易员确认（确认即结束；后台静默生成凭证+待还款，界面不展示）
            var steps = [];
            steps.push({ title: '财务发起', user: d.initiator, time: d.createTime, status: '已完成' });
            if (d.status === '待交易员确认') {
                steps.push({ title: '交易员确认', user: '待分配', time: '', status: '当前' });
            } else if (d.status === '已完成') {
                steps.push({ title: '交易员确认', user: d.traderConfirmUser, time: d.traderConfirmTime, status: '已完成', result: d.traderModified ? '已修改' : '确认', reason: d.traderRemark });
            } else if (d.status === '已驳回') {
                steps.push({ title: '交易员确认', user: d.traderConfirmUser, time: d.traderConfirmTime, status: '已完成', result: '驳回', reason: d.traderRemark });
            }
            return {
                id: d.id,
                type: '兑息兑付确认',
                object: d.id,
                objectName: d.productName
                    ? d.productName + ' - 本金 ¥' + _fmtPM(d.payPrincipal) + ' / 利息 ¥' + _fmtPM(d.payInterest)
                    : (d.source || '兑息兑付') + ' ¥' + _fmtPM(d.arrivalAmount) + '（待关联产品）',
                applicant: d.initiator,
                applyTime: d.createTime,
                status: d.status === '待交易员确认' ? '审批中' : d.status === '已完成' ? '已通过' : '已驳回',
                steps: steps,
                _dividendData: d
            };
        }

        // ===== 兑息兑付：交易员在审批中心关联产品并确认（确认即流程结束） =====
        function _fmtPM(n) {
            if (n === undefined || n === null || n === '' || isNaN(Number(n))) return '-';
            return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function _dvEligibleProducts() {
            return PRODUCTS.filter(function(p) {
                return p.status === '在投' && (p.assetType === '信托' || p.assetType === 'ABS(中保登)') && (p.holdAmount || 0) > 0;
            });
        }

        // 交易员确认即流程结束：后台静默生成凭证 + 财务变动记录 + 待还款资金池记录（界面不展示凭证/iBor环节）
        function _finalizeDividendVoucher(d, roleLabel, nowStr) {
            // 兑付金额口径：实际到账金额优先（无到账信息的按应付合计兜底：兑付本金+兑付利息，6 位小数）
            var _dvAmount = (d.arrivalAmount !== undefined && d.arrivalAmount !== null && d.arrivalAmount !== '' && !isNaN(Number(d.arrivalAmount)))
                ? Number(d.arrivalAmount)
                : Math.round(((d.payPrincipal || 0) + (d.payInterest || 0)) * 1000000) / 1000000;
            var voucherSeq = 1;
            VOUCHERS.forEach(function(v) { if (v.id && v.id.indexOf('VCH' + d.divDate.replace(/-/g,'')) === 0) voucherSeq++; });
            var voucherId = 'VCH' + d.divDate.replace(/-/g,'') + String(voucherSeq).padStart(3,'0');
            VOUCHERS.push({
                id: voucherId,
                summary: d.productName + '兑息兑付(本金' + _fmtPM(d.payPrincipal) + '元/利息' + _fmtPM(d.payInterest) + '元)',
                debitAccount: '1122-应收利息',
                creditAccount: '6001-投资收益',
                amount: _dvAmount,
                maker: roleLabel,
                makeTime: nowStr
            });
            d.voucherId = voucherId;

            var frSeq = 1;
            FINANCES.forEach(function(f) { if (f.id && f.id.indexOf('FR' + d.divDate.replace(/-/g,'')) === 0) frSeq++; });
            FINANCES.push({
                id: 'FR' + d.divDate.replace(/-/g,'') + String(frSeq).padStart(3,'0'),
                productId: d.productId,
                productName: d.productName,
                changeType: '兑息兑付',
                changeDate: d.divDate,
                changeAmount: _dvAmount,
                voucherStatus: '待确认',
                createMethod: '系统自动生成',
                source: '兑息兑付流程',
                voucherId: voucherId
            });

            // 兑息兑付款划回公司：生成待还款记录（进入待还款资金池）；入池挂载对账快照：兑付本金/兑付利息/实际到账/差额/差额备注（后续不受兑付单变更影响）
            createRepayItem('兑息兑付', d.id, d.productId, d.productName, _dvAmount, {
                payPrincipal: d.payPrincipal,
                payInterest: d.payInterest,
                arrivalAmount: (d.arrivalAmount !== undefined && d.arrivalAmount !== '') ? Number(d.arrivalAmount) : undefined,
                diffAmount: d.diffAmount,
                diffRemark: d.diffRemark
            });
        }

        function renderDividendDetail(a) {
            var d = a._dividendData;
            document.getElementById('detailModalTitle').innerHTML = '审批详情 ' + a.id + ' <span class="status-badge drawer-title-badge ' + getStatusClass(d.status) + '">' + d.status + '</span>';
            var roleKey = getCurrentRoleKey();
            var canEdit = !_isReadOnly;
            var isTraderStep = (d.status === '待交易员确认' && (roleKey === 'trader' || roleKey === 'demo'));

            // ===== 申请信息 =====
            var body = '<div class="detail-section-title">申请信息</div>';
            body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
            body += _infoItem('审批编号', a.id);
            body += _infoItem('审批类型', a.type);
            body += _infoItem('发起人', d.initiator);
            body += _infoItem('发起时间', d.createTime);
            if (d.productName) {
                body += _infoItem('关联产品', d.productName + ' (' + d.productId + ')');
                body += _infoItem('产品内部编码', d.innerCode);
                body += _infoItem('产品外部编码', d.externalCode);
            } else {
                body += _infoItem('关联产品', '<span style="color:var(--text-muted);">待交易员关联</span>');
            }
            body += _infoItem('数据来源', d.source || '-');
            body += _infoItem('当前状态', '<span class="status-badge ' + getStatusClass(d.status) + '">' + d.status + '</span>');
            body += '</div>';

            // ===== 来源信息（按来源类型展示关键字段） =====
            if (d.source === '回单OCR') {
                body += '<div class="detail-section-title">来源信息（银行回单OCR）</div>';
                body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
                body += _infoItem('来源文件', d.sourceFile);
                body += _infoItem('电子回单号码', d.receiptNo);
                if (d.serialNo) body += _infoItem('交易流水号', d.serialNo);
                if (d.timestamp) body += _infoItem('时间戳', d.timestamp);
                body += _infoItem('付款人户名', d.payerName, true);
                if (d.payerAccount) body += _infoItem('付款人账号', d.payerAccount);
                if (d.payerBank) body += _infoItem('付款人开户行', d.payerBank);
                if (d.payeeName) body += _infoItem('收款人户名', d.payeeName);
                if (d.payeeAccount) body += _infoItem('收款人账号', d.payeeAccount);
                if (d.payeeBank) body += _infoItem('收款人开户行', d.payeeBank);
                body += '</div>';
            } else if (d.source === 'Excel导入') {
                body += '<div class="detail-section-title">来源信息（Excel表格解析）</div>';
                body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
                body += _infoItem('来源文件', d.sourceFile);
                body += _infoItem('债券代码', d.bondCode);
                body += _infoItem('债券名称', d.bondName);
                body += '</div>';
            }

            // ===== 到账信息（财务发起时填写，交易员只读；无到账数据的历史记录不展示） =====
            var _inputStyle = 'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);';
            var _labelStyle = 'font-size:var(--font-size-xs);color:var(--text-muted);';
            var _hasArrival = (d.arrivalAmount !== undefined && d.arrivalAmount !== null && d.arrivalAmount !== '');
            if ((isTraderStep && canEdit) || _hasArrival) {
                body += '<div class="detail-section-title">到账信息</div>';
            }
            if (isTraderStep && canEdit) {
                body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:4px;">';
                body += _infoItem('到账金额', _fmtPM(d.arrivalAmount) + ' 元');
                body += '</div>';
                body += '<div style="font-size:var(--font-size-xs);color:var(--text-muted);margin-bottom:10px;">兑付本金/兑付利息由交易员按兑付公告填写；应付合计（本金+利息）须等于到账金额，否则不可提交。</div>';
            } else if (_hasArrival) {
                body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
                body += _infoItem('到账金额', _fmtPM(d.arrivalAmount) + ' 元');
                body += '</div>';
            }

            // ===== 兑息兑付确认（关联产品 + 兑付数据 + 提交） =====
            if (isTraderStep && canEdit) {
                // --- ① 关联产品：直接选定产品，兑付本金按持仓金额口径冲减持仓 ---
                body += '<div class="detail-section-title">关联产品（兑付本金按持仓金额口径冲减持仓）</div>';
                body += '<div class="form-group"><label style="' + _labelStyle + '">兑付产品 <span style="color:var(--danger);">*</span></label><select id="dvProductSelect" style="' + _inputStyle + '" onchange="onDvProductSelectChange(this)">'
                    + '<option value="">请选择持仓产品</option>'
                    + _dvEligibleProducts().map(function(p) {
                        return '<option value="' + p.id + '">' + p.name + '（' + p.assetType + '，持仓金额 ' + _fmtPM(p.holdAmount) + ' 元）</option>';
                    }).join('')
                    + '</select></div>';
                body += '<div id="dvSelProdTip" style="font-size:var(--font-size-xs);color:var(--text-muted);margin-bottom:10px;"></div>';

                // --- ② 兑付数据（只填本金与利息；系统校验本金+利息=到账金额；支持万元/元单位切换，默认万元） ---
                body += '<div class="detail-section-title">兑付数据</div>';
                body += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'
                    + '<span style="font-size:var(--font-size-xs);color:var(--text-muted);">金额单位</span>'
                    + '<div style="display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">'
                    + '<button id="dvUnitWan" onclick="setDvUnit(\'wan\')" style="padding:4px 14px;font-size:var(--font-size-xs);border:none;cursor:pointer;">万元</button>'
                    + '<button id="dvUnitYuan" onclick="setDvUnit(\'yuan\')" style="padding:4px 14px;font-size:var(--font-size-xs);border:none;cursor:pointer;">元</button>'
                    + '</div>'
                    + '<span style="font-size:var(--font-size-xs);color:var(--text-muted);">默认万元（2 位小数）；切换为元后保留 6 位小数</span></div>';
                body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;">';
                body += '<div class="form-group"><label style="' + _labelStyle + '">兑付日期</label><div style="padding:6px 8px;font-size:var(--font-size-sm);">' + d.divDate + '</div></div>';
                body += '<div class="form-group"><label style="' + _labelStyle + '">兑付本金(<span class="dvUnitLabel">万元</span>)</label><input type="number" step="0.01" id="divEditPrincipal" style="' + _inputStyle + '" value="' + (d.payPrincipal ? (d.payPrincipal / 10000).toFixed(2) : '') + '" placeholder="纯付息填 0；按持仓金额口径冲减持仓" oninput="recalcDvPanel()"></div>';
                body += '<div class="form-group"><label style="' + _labelStyle + '">兑付利息(<span class="dvUnitLabel">万元</span>) <span style="color:var(--danger);">*</span></label><input type="number" step="0.01" id="divEditInterest" style="' + _inputStyle + '" value="' + (d.payInterest ? (d.payInterest / 10000).toFixed(2) : '') + '" placeholder="交易员按兑付公告填写" oninput="recalcDvPanel()"></div>';
                body += '<div class="form-group"><label style="' + _labelStyle + '">备注</label><input type="text" id="divEditRemark" style="' + _inputStyle + '" value="' + (d.remark || '') + '"></div>';
                // 对账结果（系统实时提示）：本金+利息 须等于到账金额
                body += '<div id="dvReconTip" style="grid-column:1/-1;display:none;font-size:var(--font-size-xs);"></div>';
                // 参考条（系统算，只读）：当前持仓本金 + 每百元应计本金/利息
                body += '<div style="grid-column:1/-1;background:var(--info-bg);border:1px solid #BFDBFE;border-radius:var(--radius);padding:8px 12px;font-size:var(--font-size-xs);color:var(--primary-active);line-height:1.9;">'
                    + '当前持仓本金：<b id="dvHoldPrincipalShow">-</b> 元　｜　每百元应计本金：<b id="dvPer100Principal">-</b> 元　｜　每百元应计利息：<b id="dvPer100Interest">-</b> 元'
                    + '<br><span style="color:var(--text-muted);">每百元应计 = 兑付金额 ÷ 当前持仓本金 × 100（随填写实时计算，供核对兑付公告）</span></div>';
                body += '</div>';

                // --- ③ 提交 ---
                body += '<div class="form-group"><label style="' + _labelStyle + '">确认备注 / 驳回原因</label><textarea id="divTraderRemark" rows="2" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);resize:vertical;" placeholder="选填；确认时作为备注，驳回时作为驳回原因"></textarea></div>';
                body += '<input type="hidden" id="divRejectReason" value="">';
            } else {
                body += '<div class="detail-section-title">兑息兑付信息</div>';
                body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
                body += _infoItem('兑付日期', d.divDate);
                body += _infoItem('兑付本金', _fmtPM(d.payPrincipal) + ' 元');
                body += _infoItem('兑付利息', _fmtPM(d.payInterest) + ' 元');
                body += _infoItem('备注', d.remark, true);
                if (d.diffAmount) {
                    body += _infoItem('差额', _fmtPM(d.diffAmount) + ' 元（并入利息入账' + (d.diffRemark && d.diffRemark !== '差额并入利息入账' ? '：' + d.diffRemark : '') + '）', true);
                }
                body += '</div>';
                if (d.traderConfirmUser) {
                    body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;">';
                    body += _infoItem('交易员确认', d.traderConfirmUser + ' ' + d.traderConfirmTime + (d.traderModified ? '（已修改字段）' : ''));
                    body += _infoItem('交易员备注', d.traderRemark, true);
                    if (d.diffRemark) body += _infoItem('差异说明', d.diffRemark, true);
                    body += '</div>';
                }
            }

            // ===== 审批流程（步骤条 + 节点明细表格） =====
            body += '<div class="detail-section-title">审批流程</div>';
            body += renderStepBar(a.steps);
            body += renderStepTable(a.steps);

            document.getElementById('detailModalBody').innerHTML = body;
            if (isTraderStep && canEdit) { _dvCurArrival = d.arrivalAmount || 0; _dvUnit = 'wan'; initDvProductSel(d.productId); _applyDvUnitUI(); recalcDvPanel(); }
            var footer = document.getElementById('detailModalFooter');
            var footerHtml = '<button class="btn btn-ghost" onclick="closeDetailModal()">关闭</button>';
            if (canEdit) {
                if (isTraderStep) {
                    footerHtml += '<button class="btn btn-danger" onclick="rejectDividend(\'' + d.id + '\')">驳回</button>';
                    footerHtml += '<button class="btn btn-primary" onclick="confirmDividend(\'' + d.id + '\')">确认（流程结束）</button>';
                }
            }
            footer.innerHTML = footerHtml;
            document.getElementById('detailModal').style.display = 'block';
        }

        // ===== 关联产品运行时状态（直接选定产品；兑付本金按持仓金额口径冲减） =====
        var _dvSelPid = '';
        // ===== 金额单位切换（万元/元，默认万元；元 6 位小数、万元 2 位小数） =====
        var _dvUnit = 'wan';
        var _dvCurArrival = 0; // 当前单据到账金额（元），供对账结果实时提示
        function setDvUnit(unit) {
            if (unit !== 'wan' && unit !== 'yuan') return;
            if (unit === _dvUnit) { _applyDvUnitUI(); return; }
            // 切换前把已填数值按旧单位换算为元，再按新单位回填
            ['divEditPrincipal', 'divEditInterest'].forEach(function(id) {
                var el = document.getElementById(id);
                if (!el || el.value === '') return;
                var v = parseFloat(el.value);
                if (isNaN(v)) return;
                var yuan = _dvUnit === 'wan' ? v * 10000 : v;
                el.value = unit === 'wan' ? (yuan / 10000).toFixed(2) : (Math.round(yuan * 1000000) / 1000000).toFixed(6);
            });
            _dvUnit = unit;
            _applyDvUnitUI();
            recalcDvPanel();
        }
        function _applyDvUnitUI() {
            var onStyle = 'padding:4px 14px;font-size:var(--font-size-xs);border:none;cursor:pointer;background:var(--primary);color:#fff;';
            var offStyle = 'padding:4px 14px;font-size:var(--font-size-xs);border:none;cursor:pointer;background:var(--surface);color:var(--text-secondary);';
            var wanBtn = document.getElementById('dvUnitWan');
            var yuanBtn = document.getElementById('dvUnitYuan');
            if (wanBtn) wanBtn.style.cssText = _dvUnit === 'wan' ? onStyle : offStyle;
            if (yuanBtn) yuanBtn.style.cssText = _dvUnit === 'yuan' ? onStyle : offStyle;
            var label = _dvUnit === 'wan' ? '万元' : '元';
            document.querySelectorAll('#detailModalBody .dvUnitLabel').forEach(function(s) { s.textContent = label; });
            var step = _dvUnit === 'wan' ? '0.01' : '0.000001';
            var pEl = document.getElementById('divEditPrincipal');
            var iEl = document.getElementById('divEditInterest');
            if (pEl) pEl.step = step;
            if (iEl) iEl.step = step;
        }
        // 输入值按当前单位换算为元（6 位小数）
        function _dvInputToYuan(id) {
            var el = document.getElementById(id);
            var v = parseFloat(el && el.value);
            if (isNaN(v)) return 0;
            var yuan = _dvUnit === 'wan' ? v * 10000 : v;
            return Math.round(yuan * 1000000) / 1000000;
        }
        function initDvProductSel(pid) {
            _dvSelPid = (pid && _dvEligibleProducts().some(function(p) { return p.id === pid; })) ? pid : '';
            var sel = document.getElementById('dvProductSelect');
            if (sel) sel.value = _dvSelPid;
            _refreshDvSelUI();
        }
        function onDvProductSelectChange(el) {
            _dvSelPid = el.value;
            _refreshDvSelUI();
            recalcDvPanel();
        }
        // 持仓提示
        function _refreshDvSelUI() {
            var tip = document.getElementById('dvSelProdTip');
            if (!tip) return;
            var prod = PRODUCTS.find(function(p) { return p.id === _dvSelPid; });
            if (prod) {
                tip.innerHTML = '已选产品持仓金额：<b>' + _fmtPM(prod.holdAmount) + '</b> 元' + (prod.innerCode || prod.hengtaiCode ? '，内部编码 ' + (prod.innerCode || prod.hengtaiCode) : '') + '；兑付本金不可超过持仓金额，确认后按持仓金额口径冲减持仓。';
            } else {
                tip.innerHTML = '请选择兑付产品（同一笔兑付仅关联一只产品）。';
            }
        }
        // 参考条刷新：当前持仓本金 + 每百元应计本金/利息（系统算，只读，随填写实时计算）；对账结果实时提示
        function recalcDvPanel() {
            var prod = PRODUCTS.find(function(p) { return p.id === _dvSelPid; });
            var holdAmount = prod ? (prod.holdAmount || 0) : 0;
            var payP = _dvInputToYuan('divEditPrincipal');
            var payI = _dvInputToYuan('divEditInterest');
            var holdEl = document.getElementById('dvHoldPrincipalShow');
            if (holdEl) holdEl.textContent = prod ? _fmtPM(holdAmount) : '-';
            var p100P = document.getElementById('dvPer100Principal');
            var p100I = document.getElementById('dvPer100Interest');
            if (p100P) p100P.textContent = (prod && holdAmount > 0) ? _fmtPM(Math.round(payP / holdAmount * 100 * 10000) / 10000) : '-';
            if (p100I) p100I.textContent = (prod && holdAmount > 0) ? _fmtPM(Math.round(payI / holdAmount * 100 * 10000) / 10000) : '-';
            // 对账结果：本息合计须等于到账金额，不等则实时提示
            var tip = document.getElementById('dvReconTip');
            if (tip) {
                var payable = Math.round((payP + payI) * 1000000) / 1000000;
                if ((payP > 0 || payI > 0) && Math.abs(_dvCurArrival - payable) >= 0.000001) {
                    tip.style.display = '';
                    tip.style.color = 'var(--danger)';
                    tip.innerHTML = '对账结果：本息合计 <b>' + _fmtPM(payable) + '</b> 元，本金 + 利息 须等于到账金额（' + _fmtPM(_dvCurArrival) + ' 元），请核对后修改';
                } else if (payP > 0 || payI > 0) {
                    tip.style.display = '';
                    tip.style.color = 'var(--success, #0B975C)';
                    tip.innerHTML = '对账结果：本息合计 <b>' + _fmtPM(payable) + '</b> 元，与到账金额一致';
                } else {
                    tip.style.display = 'none';
                    tip.innerHTML = '';
                }
            }
        }

        // 交易员确认：校验关联产品与兑付数据（本金+利息须等于到账金额） → 按持仓金额口径冲减持仓 → 流程结束
        function confirmDividend(dividendId) {
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            // 1. 关联产品校验：必须选定持仓产品
            var prod = PRODUCTS.find(function(p) { return p.id === _dvSelPid; });
            if (!prod) { alert('请先选定兑付产品'); return; }
            var holdAmount = prod.holdAmount || 0;

            // 2. 到账金额与兑付日期由财务发起时确定，交易员不可修改
            var arrA = d.arrivalAmount || 0;
            if (arrA <= 0) { alert('该单据无到账金额，请联系财务核对'); return; }

            // 3. 校验兑付数据（兑付本金非必填、兑付利息必填；本金+利息须等于到账金额）
            var newDate = d.divDate;
            var payP = _dvInputToYuan('divEditPrincipal');
            var payI = _dvInputToYuan('divEditInterest');
            var newRemark = document.getElementById('divEditRemark').value;
            var traderRemark = document.getElementById('divTraderRemark').value;
            if (payP < 0 || payI < 0) { alert('兑付本金/兑付利息不能为负数'); return; }
            if (payI <= 0) { alert('兑付利息必填，请填写兑付利息'); return; }
            if (payP > holdAmount + 0.000001) { alert('兑付本金不能大于当前持仓金额（' + _fmtPM(holdAmount) + ' 元）'); return; }

            // 4. 系统校验：兑付本金 + 兑付利息 必须等于到账金额（不等则拦截）
            var payable = Math.round((payP + payI) * 1000000) / 1000000;
            if (Math.abs(arrA - payable) >= 0.000001) { alert('兑付本金 + 兑付利息（' + _fmtPM(payable) + ' 元）须等于到账金额（' + _fmtPM(arrA) + ' 元），请核对后修改'); return; }
            var arrI = payI;

            // 5. 回写：关联产品 + 兑付数据留痕
            var modified = false;
            var modifyRemark = ['关联产品：' + prod.name + '（持仓金额 ' + _fmtPM(holdAmount) + ' 元）'];
            d.productId = prod.id;
            d.productName = prod.name;
            d.innerCode = prod.hengtaiCode || '';
            d.externalCode = prod.externalCode || '';
            d.divDate = newDate;
            d.payPrincipal = payP;
            d.payInterest = payI;
            d.remark = newRemark;
            d.arrivalAmount = arrA;
            d.diffAmount = 0;
            d.diffRemark = '';

            // 6. 持仓金额扣减 + 本息累计 + 留痕 + 退出判定（统一金额口径；入账利息=兑付利息）
            var principalAmount = applyDividendHolding(prod, payP, arrI, d.id);

            // 8. 状态流转 + 留痕 + 凭证/资金池 + 额度释放
            d.traderConfirmUser = role.label;
            d.traderConfirmTime = nowStr;
            d.traderModified = modified;
            d.traderRemark = traderRemark || (modified ? modifyRemark.join('，') : '确认无误');
            d.status = '已完成';
            d.history.push({ user: role.label, action: '交易员确认兑付', time: nowStr, remark: d.traderRemark + '；兑付本金 ' + _fmtPM(payP) + ' 元 + 兑付利息 ' + _fmtPM(payI) + ' 元 = 实际到账 ' + _fmtPM(arrA) + ' 元，对账一致' });

            _finalizeDividendVoucher(d, role.label, nowStr);
            if (principalAmount > 0) releasePlanQuota(prod.id, principalAmount);
            closeDetailModal();
            renderApprovalList();
            alert('确认成功，已进入待还款资金池，可在「投资管理-还款管理」发起还款。');
        }

        function rejectDividend(dividendId) {
            var reason = document.getElementById('divRejectReason').value || document.getElementById('divTraderRemark').value;
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            // 驳回退给财务：状态回到草稿，财务在总表修改后重新发起；原因非必填
            d.status = '草稿';
            if (reason) d.traderRemark = reason;
            d.history.push({ user: role.label, action: '交易员驳回（退回财务）', time: nowStr, remark: reason || '' });
            closeDetailModal();
            renderApprovalList();
            alert('已驳回并退回财务，财务可在兑息兑付总表修改后重新发起。');
        }

        // 审批通过核心逻辑（单条/批量共用）：当前节点完成并推进下一节点
        function _doApprove(a, opinion) {
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (!currentStep) return false;
            currentStep.status = '已完成';
            currentStep.time = new Date().toISOString().slice(0, 16).replace('T', ' ');
            if (opinion) {
                currentStep.opinion = opinion;
            }
            if (a.type === '交易审批') {
                syncTradeOnStepComplete(a, currentStep);
            }
            var idx = a.steps.indexOf(currentStep);
            var nextStep = null;
            for (var i = idx + 1; i < a.steps.length; i++) {
                if (a.steps[i].status === '待处理') { nextStep = a.steps[i]; break; }
            }
            if (nextStep) {
                nextStep.status = '当前';
            } else {
                a.status = '已通过';
                if (a.type === '产品入池审批') {
                    var p = PRODUCTS.find(function(pp) { return pp.id === a.object; });
                    if (p && p.status === '无计划') p.status = '无计划';
                }
            }
            if (a.steps.every(function(s) { return s.status === '已完成'; })) a.status = '已通过';
            // 投资计划书审批全部通过：回写计划书状态为"已通过"（产品方可发起交易）
            if (a.status === '已通过' && a.type === '投资计划书审批') {
                var passPlan = PLANS.find(function(pl) { return pl.id === a.object; });
                if (passPlan) passPlan.status = '已通过';
            }
            return true;
        }

        function approveItem(id) {
            var a = APPROVALS.find(function(x) { return x.id === id; });
            if (!a) return;
            if (!confirm('确认通过该审批？')) return;
            var opinionEl = document.getElementById('approvalOpinion');
            _doApprove(a, opinionEl && opinionEl.value.trim() ? opinionEl.value.trim() : '');
            alert('审批已通过');
            closeDetailModal();
            renderApprovalList();
        }

        function syncTradeOnStepComplete(approval, completedStep) {
            var trade = TRADES.find(function(t) { return t.id === approval.object; });
            if (!trade) return;
            var title = completedStep.title;
            var now = completedStep.time;
            // 申购/赎回均前置三级审批（PRD（二）（三））
            if (title === '投资经理审批' || title === '风控审批') {
                // 三级审批中间节点：交易保持"交易审批中"
            } else if (title === '部门经理审批') {
                if (trade.erpStep1Status === '不适用') {
                    // 赎回：三级审批全部通过 → 交易执行中（等待财务在审批中心对账确认）
                    trade.status = '交易执行中';
                    trade.remark = '三级审批已通过，待财务对账确认（交易执行中）';
                } else {
                    // 申购：三级审批全部通过 → 自动触发ERP用款流程（步骤1发起）
                    trade.status = '交易执行中';
                    trade.erpStep1Status = '执行中';
                    trade.remark = '三级审批已通过，已自动发起ERP用款流程（资金划拨）';
                }
            } else if (title === '交易员补充信息') {
                // 由交易管理-交易员补充信息表单处理
            } else if (title.indexOf('ERP流程-资金划拨') === 0) {
                // ERP步骤1完成 → 交易执行中（申购）或 还款审批中（赎回）
                trade.erpStep1Status = '已完成';
                trade.erpStep1Time = now;
                if (trade.type === '赎回') {
                    trade.status = '待到账';
                } else {
                    trade.status = '交易执行中';
                }
                if (trade.erpStep2Status === '待执行') trade.erpStep2Status = '执行中';
            } else if (title.indexOf('ERP流程-创新金融') === 0) {
                trade.erpStep2Status = '已完成';
                trade.erpStep2Time = now;
                if (trade.type === '赎回') {
                    trade.status = '还款审批中';
                }
            } else if (title.indexOf('交易员确认') === 0) {
                // 申购终态节点：交易员确认（金额修正+合同上传）通过即流程结束
                trade.traderConfirmStatus = '已确认';
                trade.status = '已结束';
                trade.actualDealAmount = trade.applyAmount;
                trade.traderConfirmTime = now;
                trade.voucherStatus = '待生成';
            }
        }

        // 赎回新流程：财务对账确认（审批中心填写对账表单，提交即代表交易执行成功）
        function confirmFinanceReconcile(approvalId) {
            var a = APPROVALS.find(function(x) { return x.id === approvalId; });
            if (!a) return;
            var trade = TRADES.find(function(t) { return t.id === a.object; });
            if (!trade) { alert('关联交易不存在'); return; }
            var amount = parseFloat(document.getElementById('finRecAmount').value);
            if (isNaN(amount) || amount <= 0) { alert('请输入有效的实际到账金额'); return; }
            var date = document.getElementById('finRecDate').value;
            if (!date) { alert('请选择到账日期'); return; }
            var shares = parseFloat(document.getElementById('finRecShares').value);
            var fee = parseFloat(document.getElementById('finRecFee').value);
            var diff = (document.getElementById('finRecDiff').value || '').trim();
            var fileInput = document.getElementById('finRecFile');
            var fileName = (fileInput && fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : '';
            if (!fileName) { alert('请上传对账单附件（银行回单）'); return; }
            if (Math.abs(amount - trade.applyAmount) > 0.01 && !diff) { alert('实际到账金额与申报金额存在差异，请填写差异说明'); return; }
            if (!confirm('确认提交对账信息？\n\n实际到账金额：' + formatMoney(amount) + '\n到账日期：' + date + '\n\n提交后交易即视为执行成功，流转至交易员补充信息节点。')) return;

            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            trade.financeConfirmStatus = '已确认';
            trade.financeConfirmUser = role.label;
            trade.financeConfirmTime = nowStr;
            trade.actualArrivalAmount = amount;
            trade.actualArrivalDate = date;
            trade.statementFile = fileName;
            trade.redeemFee = isNaN(fee) ? 0 : fee;
            trade.diffRemark = diff || '';
            if (!isNaN(shares) && shares > 0) trade.actualArrivalShares = shares;
            trade.status = '待交易员补充信息';
            trade.remark = '财务已确认对账（实际到账' + formatMoney(amount) + '），待交易员补充信息';

            // 推进审批节点：财务对账确认完成 → 交易员补充信息（当前）
            var step = a.steps.find(function(s) { return s.status === '当前'; });
            if (step) { step.status = '已完成'; step.time = nowStr; step.user = role.label; }
            var next = a.steps.find(function(s) { return s.status === '待处理'; });
            if (next) next.status = '当前';

            alert('对账确认成功，交易已执行！\n\n交易状态变更为"待交易员补充信息"，已通知交易员在【交易管理】补充最终信息。');
            closeDetailModal();
            renderApprovalList();
        }

        function openRejectModal(id) {
            currentRejectId = id;
            _batchRejectMode = false;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectModal').style.display = 'block';
        }

        function closeRejectModal() { document.getElementById('rejectModal').style.display = 'none'; currentRejectId = null; _batchRejectMode = false; }

        // 驳回核心逻辑（单条/批量共用）
        function _doReject(a, reason) {
            a.status = '已驳回';
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (currentStep) {
                currentStep.status = '已完成';
                currentStep.result = '驳回';
                currentStep.reason = reason;
                currentStep.time = new Date().toISOString().slice(0, 16).replace('T', ' ');
            }
            if (a.type === '交易审批') {
                var trade = TRADES.find(function(t) { return t.id === a.object; });
                if (trade) trade.status = '已驳回';
            }
            // 投资计划书审批驳回：回写计划书状态为"已驳回"
            if (a.type === '投资计划书审批') {
                var rejPlan = PLANS.find(function(pl) { return pl.id === a.object; });
                if (rejPlan) rejPlan.status = '已驳回';
            }
        }

        function confirmReject() {
            var reason = document.getElementById('rejectReason').value.trim();
            if (!reason) { alert('请输入驳回原因'); return; }
            // 批量驳回模式
            if (_batchRejectMode) {
                var ids = Object.keys(_batchSelected);
                var role = getCurrentRole();
                var now = new Date();
                var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
                var ok = 0;
                ids.forEach(function(id) {
                    if (id.indexOf('DV') === 0) {
                        var d = DIVIDENDS.find(function(x) { return x.id === id; });
                        if (d && d.status === '待交易员确认') {
                            d.status = '已驳回';
                            d.history.push({ user: role.label, action: '驳回（批量）', time: nowStr, remark: reason });
                            ok++;
                        }
                    } else {
                        var a = APPROVALS.find(function(x) { return x.id === id; });
                        if (a && a.status === '审批中') { _doReject(a, reason); ok++; }
                    }
                });
                _batchSelected = {};
                _batchRejectMode = false;
                closeRejectModal();
                renderApprovalList();
                alert('批量驳回完成：共驳回 ' + ok + ' 条。');
                return;
            }
            var a = APPROVALS.find(function(x) { return x.id === currentRejectId; });
            if (!a) return;
            _doReject(a, reason);
            alert('已驳回');
            closeRejectModal();
            closeDetailModal();
            renderApprovalList();
        }

        function withdrawApproval(id) {
            var a = APPROVALS.find(function(x) { return x.id === id; });
            if (!a) return;
            if (!confirm('确认撤回该审批申请？')) return;
            a.status = '已撤回';
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (currentStep) {
                currentStep.status = '待处理';
            }
            if (a.type === '交易审批') {
                var trade = TRADES.find(function(t) { return t.id === a.object; });
                if (trade) trade.status = '已撤回';
            }
            alert('已撤回');
            closeDetailModal();
            renderApprovalList();
        }

        var currentTerminateId = null;
        function openTerminateModal(id) {
            currentTerminateId = id;
            document.getElementById('terminateReason').value = '';
            document.getElementById('terminateModal').style.display = 'block';
        }
        function closeTerminateModal() {
            document.getElementById('terminateModal').style.display = 'none';
            currentTerminateId = null;
        }
        function confirmTerminate() {
            var reason = document.getElementById('terminateReason').value.trim();
            if (!reason) { alert('请输入终止原因'); return; }
            var a = APPROVALS.find(function(x) { return x.id === currentTerminateId; });
            if (!a) return;
            a.status = '已终止';
            a.terminateReason = reason;
            var currentStep = a.steps.find(function(s) { return s.status === '当前'; });
            if (currentStep) currentStep.status = '待处理';
            if (a.type === '交易审批') {
                var trade = TRADES.find(function(t) { return t.id === a.object; });
                if (trade) trade.status = '已终止';
            }
            alert('已终止');
            closeTerminateModal();
            closeDetailModal();
            renderApprovalList();
        }

        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('detailModal')) closeDetailModal();
            if (event.target === document.getElementById('rejectModal')) closeRejectModal();
            if (event.target === document.getElementById('terminateModal')) closeTerminateModal();
            if (event.target === document.getElementById('planFileViewModal')) document.getElementById('planFileViewModal').style.display = 'none';
        });

        // 点击账套树形面板外部时收起
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.cascade-filter')) {
                document.querySelectorAll('.cascade-panel').forEach(function(p) { p.classList.remove('show'); });
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            initApprovalFilters();
            renderApprovalList();
            // 支持从通知中心跳转过来自动打开审批详情弹窗
            // openApproval 参数值为业务对象ID（TP/TRX/DV开头）
            var match = location.search.match(/[?&]openApproval=([^&]+)/);
            if (match) {
                var openObj = decodeURIComponent(match[1]);
                var aprId = openObj;
                if (openObj.indexOf('DV') !== 0 && openObj.indexOf('PR') !== 0) {
                    // 投资计划书(TP)/产品交易(TRX)：在APPROVALS中按object字段查找对应审批ID
                    var apr = APPROVALS.find(function(a) { return a.object === openObj; });
                    if (!apr) return;
                    aprId = apr.id;
                }
                // DV开头为兑息兑付、PR开头为兑付解析数据，viewDetail内部会自动查找
                viewDetail(aprId);
            }
        });
    </script>
</body>
</html>
