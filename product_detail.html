<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场外簿记OMS系统 - 产品详情</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .tab-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
        .tab-btn { padding: 8px 18px; font-size: var(--font-size-sm); font-weight: 500; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .product-name-link { font-weight: 500; color: var(--primary); cursor: pointer; text-decoration: none; }
        .product-name-link:hover { text-decoration: underline; }
        .toggle-btn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
        .toggle-btn.enable { background: var(--success-bg); color: var(--success); }
        .toggle-btn.enable:hover { background: var(--success); color: white; }
        .toggle-btn.disable { background: var(--danger-bg); color: var(--danger); }
        .toggle-btn.disable:hover { background: var(--danger); color: white; }
        .change-log-table td:last-child { min-width: 280px; }
        .log-type-badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 600; }
        .log-type-info { background: var(--border-light); color: var(--text-secondary); }
        .log-type-transfer { background: #DBEAFE; color: #2563EB; }
        .log-type-system { background: #F1F5F9; color: #94A3B8; }
        .log-transfer-tag { color: #2563EB; font-weight: 600; }
        .log-old-value { color: #94A3B8; text-decoration: line-through; margin: 0 2px; }
        .log-new-value { color: #2563EB; font-weight: 700; margin: 0 2px; }
    </style>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar"></nav>
        <div class="main-area">
            <div class="topbar"></div>
            <div class="content">
                <div class="detail-page-header">
                    <div class="header-left">
                        <button class="back-btn" onclick="location.href='product.html'" data-logic-id="page_product_detail">← 返回列表</button>
                        <div>
                            <h2 id="pageTitle">产品详情</h2>
                            <div class="header-subtitle" id="pageSubtitle"></div>
                        </div>
                        <span id="statusBadge"></span>
                    </div>
                    <div class="detail-actions" id="detailActions" data-logic-id="modal_edit_product"></div>
                </div>

                <div class="tab-nav" id="tabNav" data-logic-id="page_product_detail"></div>

                <div class="tab-panel active" id="panel-basic" data-logic-id="page_product_detail">
                    <div class="detail-section">
                        <div class="detail-section-title">核心信息</div>
                        <div class="detail-info-grid" id="coreInfoGrid"></div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-section-title">扩展信息</div>
                        <div class="detail-info-grid" id="extInfoGrid"></div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-nav">
                    <div class="card">
                        <div class="card-header"><span class="card-title">净值记录</span></div>
                        <div class="card-body-p0">
                            <table class="data-table">
                                <thead><tr><th>日期</th><th>单位净值</th><th>累计净值</th><th>日收益率(%)</th></tr></thead>
                                <tbody id="navTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-chart">
                    <div class="card">
                        <div class="card-header"><span class="card-title">收益率曲线</span></div>
                        <div class="card-body">
                            <div id="returnChart" style="width:100%;height:360px;"></div>
                        </div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-trades">
                    <div class="card">
                        <div class="card-header"><span class="card-title">交易记录</span></div>
                        <div class="card-body-p0" id="tradeRecordsContainer"></div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-erp">
                    <div class="card">
                        <div class="card-header"><span class="card-title">ERP跟踪</span></div>
                        <div class="card-body" id="erpContainer"></div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-logs">
                    <div class="card">
                        <div class="card-header"><span class="card-title">变更日志</span></div>
                        <div class="card-body" id="logsContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sealModal" class="modal">
        <div class="modal-content" style="width:560px;">
            <div class="modal-header">
                <h3>上传用印版</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeSealModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="detail-info-grid" id="sealContractInfo" style="margin-bottom:16px;"></div>
                <div class="form-group" style="margin-bottom:10px;">
                    <label>用印版文件 <span style="color:red;">*</span></label>
                    <input type="file" id="sealFile" accept=".pdf,.doc,.docx">
                </div>
                <div class="grid-2" style="gap:10px;">
                    <div class="form-group"><label>签署日期</label><input type="date" id="sealSignDate"></div>
                    <div class="form-group"><label>到期日期</label><input type="date" id="sealExpireDate"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeSealModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmSealUpload()">确认上传</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal" data-logic-id="modal_edit_product">
        <div class="modal-content" style="width:680px;">
            <div class="modal-header">
                <h3>编辑产品</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeEditModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="grid-2" style="gap:10px;">
                    <div class="form-group"><label>产品名称 <span style="color:red;">*</span></label><input type="text" id="eName"></div>
                    <div class="form-group"><label>产品简称 <span style="color:red;">*</span></label><input type="text" id="eShortName"></div>
                    <div class="form-group"><label>资产类型</label><select id="eAssetType"><option value="专户资管产品">专户资管产品</option><option value="ABS(中保登)">ABS(中保登)</option><option value="信托">信托</option><option value="碳金融">碳金融</option></select></div>
                    <div class="form-group"><label>产品类型</label><select id="eProductType"><option value="混合型">混合型</option><option value="FOF">FOF</option><option value="固收类">固收类</option><option value="权益类">权益类</option></select></div>
                    <div class="form-group"><label>衡泰代码</label><input type="text" id="eHengtaiCode"></div>
                    <div class="form-group"><label>外部代码</label><input type="text" id="eExternalCode"></div>
                    <div class="form-group"><label>所属部门</label><select id="eDept"><option value="创新金融业务总部">创新金融业务总部</option><option value="FICC固定收益业务总部">FICC固定收益业务总部</option><option value="证券投资部">证券投资部</option></select></div>
                    <div class="form-group"><label>投资组</label><select id="eGroup"><option value="">请选择</option><option value="专户投资组">专户投资组</option><option value="xn账户">xn账户</option><option value="fb账户">fb账户</option><option value="理财投资组">理财投资组</option><option value="权益投资组">权益投资组</option></select></div>
                    <div class="form-group"><label>到期日期</label><input type="date" id="eExpireDate"></div>
                    <div class="form-group"><label>可赎回</label><select id="eRedeemable"><option value="true">是</option><option value="false">否</option></select></div>
                    <div class="form-group"><label>计划额度(元)</label><input type="number" id="ePlanAmount" step="10000"></div>
                    <div class="form-group"><label>当前净值</label><input type="number" id="eNav" step="0.0001"></div>
                    <div class="form-group"><label>交易限额(元)</label><input type="number" id="eTradeLimit" step="10000" value="0"></div>
                    <div class="form-group"><label>科目映射</label><input type="text" id="eAccountMapping" placeholder='如 {"debit":"1101","credit":"1002"}'></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        initLayout('product_detail.html', '产品详情');

        var _canEditProduct = hasPermission('editProduct');
        var _isReadOnly = isReadOnly();
        var currentProduct = null;
        var currentTab = 'basic';

        var tabs = [
            { key: 'basic', label: '基础信息' },
            { key: 'nav', label: '净值记录' },
            { key: 'chart', label: '收益率曲线' },
            { key: 'trades', label: '交易记录' },
            { key: 'erp', label: 'ERP跟踪' },
            { key: 'logs', label: '变更日志' }
        ];

        var changeLogs = {};

        function getQueryParam(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        function generateNavHistory(pid) {
            if (NAV_HISTORY[pid]) return NAV_HISTORY[pid];
            var p = PRODUCTS.find(function(x) { return x.id === pid; });
            if (!p || !p.nav || p.nav === 1.0 && p.navDate === '') return [];
            var hist = [];
            var baseNav = p.nav;
            var baseDate = new Date(p.navDate || '2026-05-17');
            for (var i = 0; i < 7; i++) {
                var d = new Date(baseDate);
                d.setDate(d.getDate() - i);
                var dateStr = d.toISOString().slice(0, 10);
                var nav = baseNav - i * 0.0012 + (Math.random() - 0.5) * 0.002;
                nav = Math.round(nav * 10000) / 10000;
                var accNav = Math.round((nav + i * 0.1) * 10000) / 10000;
                var dailyReturn = i === 0 ? (Math.random() * 0.2 - 0.05) : (Math.random() * 0.3 - 0.1);
                dailyReturn = Math.round(dailyReturn * 100) / 100;
                hist.push({ date: dateStr, nav: nav, accNav: accNav, dailyReturn: dailyReturn });
            }
            hist[0].nav = p.nav;
            return hist;
        }

        function generateChangeLogs(pid) {
            if (changeLogs[pid]) return changeLogs[pid];
            var p = PRODUCTS.find(function(x) { return x.id === pid; });
            if (!p) return [];
            var logs = [
                { time: p.poolTime, user: p.poolUser, content: '产品入池：' + p.shortName, type: '信息变更' },
                { time: p.poolTime.replace(/\d{2}:\d{2}$/, function() { return (parseInt(p.poolTime.substr(11, 2)) + 1) + ':30'; }), user: '孙磊', content: '部门经理审批通过', type: '信息变更' }
            ];
            if (p.status === '完结' || p.status === '已到期') {
                logs.unshift({ time: p.navDate + ' 16:00', user: '系统', content: '产品状态变更：→ ' + p.status, type: '系统更新' });
            }
            if (p.status === '禁用') {
                logs.unshift({ time: '2026-05-15 14:00', user: '刘伟', content: '产品禁用', type: '信息变更' });
            }
            if (p.holdAmount > 0) {
                logs.unshift({ time: p.navDate + ' 17:00', user: '系统', content: '净值更新：' + p.nav.toFixed(4), type: '系统更新' });
            }
            logs.unshift(
                { time: '2026-04-15 16:30', user: '系统管理员', field: '投资经理', oldValue: '周欣', newValue: '张明', type: '人员转移' },
                { time: '2026-04-15 16:30', user: '系统管理员', field: '交易员', oldValue: '赵丽', newValue: '李华', type: '人员转移' }
            );
            changeLogs[pid] = logs;
            return logs;
        }

        function renderTabNav() {
            var html = '';
            tabs.forEach(function(t) {
                html += '<button class="tab-btn' + (t.key === currentTab ? ' active' : '') + '" onclick="switchTab(\'' + t.key + '\')">' + t.label + '</button>';
            });
            document.getElementById('tabNav').innerHTML = html;
        }

        function switchTab(key) {
            currentTab = key;
            tabs.forEach(function(t) {
                var panel = document.getElementById('panel-' + t.key);
                if (panel) {
                    panel.classList.toggle('active', t.key === key);
                }
            });
            renderTabNav();
            if (key === 'chart') {
                setTimeout(renderChart, 100);
            }
        }

        function renderHeader() {
            var p = currentProduct;
            document.getElementById('pageTitle').textContent = p.name;
            document.getElementById('pageSubtitle').textContent = p.id + ' · ' + p.assetType + ' · ' + p.productType;
            document.getElementById('statusBadge').innerHTML = '<span class="status-badge ' + getStatusClass(p.status) + '">' + p.status + '</span>';
            var actions = '';
            if (_canEditProduct && !_isReadOnly) {
                actions += '<button class="btn btn-primary btn-sm" onclick="openEditModal()">编辑</button> ';
                if (p.status === '禁用') {
                    actions += '<button class="toggle-btn enable" onclick="toggleProductStatus(\'在投\')">启用</button>';
                } else if (p.status === '在投' || p.status === '待投') {
                    actions += '<button class="toggle-btn disable" onclick="toggleProductStatus(\'禁用\')">禁用</button>';
                }
            }
            document.getElementById('detailActions').innerHTML = actions;
        }

        function renderBasicInfo() {
            var p = currentProduct;
            var cpName = '-';
            if (p.counterparty) {
                var cp = COUNTERPARTIES.find(function(x) { return x.id === p.counterparty; });
                cpName = cp ? '<a class="product-name-link" href="counterparty_detail.html?id=' + cp.id + '">' + cp.name + '</a>' : p.counterparty;
            }
            var coreFields = [
                { label: '产品ID', value: p.id },
                { label: '产品名称', value: p.name },
                { label: '产品简称', value: p.shortName },
                { label: '资产类型', value: p.assetType },
                { label: '产品类型', value: p.productType },
                { label: '衡泰代码', value: p.hengtaiCode || '-' },
                { label: '外部代码', value: p.externalCode || '-' },
                { label: '所属部门', value: p.dept },
                { label: '投资组', value: p.group || '-' },
                { label: '状态', value: '<span class="status-badge ' + getStatusClass(p.status) + '">' + p.status + '</span>' },
                { label: '关联对手方', value: cpName }
            ];
            var extFields = [
                { label: '到期日期', value: p.expireDate || '无固定期限' },
                { label: '可赎回', value: p.redeemable ? '是' : '否' },
                { label: '当前净值', value: p.nav ? p.nav.toFixed(4) : '-' },
                { label: '净值日期', value: p.navDate || '-' },
                { label: '持仓金额', value: p.holdAmount ? formatMoney(p.holdAmount) : '-' },
                { label: '持仓份额', value: p.holdShares ? p.holdShares.toLocaleString() : '-' },
                { label: '计划额度', value: p.planAmount ? formatMoney(p.planAmount) : '-' },
                { label: '已用额度', value: p.usedAmount ? formatMoney(p.usedAmount) : '-' },
                { label: '交易限额', value: p.tradeLimit ? formatMoney(p.tradeLimit) : '不限' },
                { label: '科目映射', value: p.accountMapping || '-' },
                { label: '入池操作人', value: p.poolUser || '-' },
                { label: '入池时间', value: p.poolTime || '-' }
            ];
            var coreHtml = '';
            coreFields.forEach(function(f) {
                coreHtml += '<div class="detail-info-item"><div class="info-label">' + f.label + '</div><div class="info-value">' + f.value + '</div></div>';
            });
            document.getElementById('coreInfoGrid').innerHTML = coreHtml;
            var extHtml = '';
            extFields.forEach(function(f) {
                extHtml += '<div class="detail-info-item"><div class="info-label">' + f.label + '</div><div class="info-value">' + f.value + '</div></div>';
            });
            document.getElementById('extInfoGrid').innerHTML = extHtml;
        }

        function renderNavTable() {
            var hist = generateNavHistory(currentProduct.id);
            var tbody = document.getElementById('navTableBody');
            if (hist.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px;">暂无净值记录</td></tr>';
                return;
            }
            var html = '';
            hist.forEach(function(h) {
                var color = h.dailyReturn >= 0 ? 'var(--success)' : 'var(--danger)';
                html += '<tr><td>' + h.date + '</td><td class="text-mono">' + h.nav.toFixed(4) + '</td><td class="text-mono">' + h.accNav.toFixed(4) + '</td><td style="color:' + color + ';font-weight:600;">' + (h.dailyReturn >= 0 ? '+' : '') + h.dailyReturn.toFixed(2) + '%</td></tr>';
            });
            tbody.innerHTML = html;
        }

        function renderChart() {
            var chartDom = document.getElementById('returnChart');
            if (!chartDom || typeof echarts === 'undefined') return;
            var chart = echarts.init(chartDom);
            var hist = generateNavHistory(currentProduct.id).slice().reverse();
            if (hist.length === 0) {
                chart.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#94A3B8', fontSize: 14 } }
                });
                return;
            }
            var dates = hist.map(function(h) { return h.date; });
            var navs = hist.map(function(h) { return h.nav; });
            var returns = hist.map(function(h, i) { return i === 0 ? 0 : Math.round((h.dailyReturn) * 100) / 100; });
            chart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                legend: { data: ['单位净值', '日收益率(%)'], top: 5 },
                grid: { left: 60, right: 60, bottom: 30, top: 40 },
                xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 11, color: '#64748B' }, axisLine: { lineStyle: { color: '#E2E8F0' } } },
                yAxis: [
                    { type: 'value', name: '净值', position: 'left', scale: true, axisLabel: { fontSize: 11, color: '#64748B' }, splitLine: { lineStyle: { color: '#F1F5F9' } } },
                    { type: 'value', name: '收益率(%)', position: 'right', axisLabel: { fontSize: 11, color: '#64748B' }, splitLine: { show: false } }
                ],
                series: [
                    {
                        name: '单位净值', type: 'line', data: navs, smooth: true,
                        lineStyle: { color: '#3B82F6', width: 2 },
                        itemStyle: { color: '#3B82F6' },
                        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(59,130,246,0.15)' }, { offset: 1, color: 'rgba(59,130,246,0.01)' }] } }
                    },
                    {
                        name: '日收益率(%)', type: 'bar', yAxisIndex: 1, data: returns,
                        itemStyle: {
                            color: function(params) { return params.value >= 0 ? '#10B981' : '#EF4444'; }
                        }
                    }
                ]
            });
            window.addEventListener('resize', function() { chart.resize(); });
        }

        function renderTradeTable() {
            var trades = TRADES.filter(function(t) { return t.productId === currentProduct.id; });
            var container = document.getElementById('tradeRecordsContainer');
            if (trades.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">暂无交易记录</p>';
                return;
            }
            var html = '';
            trades.forEach(function(t) {
                var typeClass = t.type === '买入' ? 'status-investing' : 'status-rejected';
                var contracts = CONTRACTS.filter(function(c) { return c.tradeId === t.id; });
                html += '<div class="trade-record-card">';
                html += '<div class="trade-record-main">';
                html += '<div class="trade-record-row">';
                html += '<span class="text-mono font-bold">' + t.id + '</span>';
                html += '<span class="status-badge ' + typeClass + '">' + t.type + '</span>';
                html += '<span>' + t.productName + '</span>';
                html += '<span class="text-mono">' + formatMoney(t.applyAmount) + '</span>';
                html += '<span class="text-mono">' + (t.dealAmount > 0 ? formatMoney(t.dealAmount) : '-') + '</span>';
                html += '<span class="status-badge ' + getStatusClass(t.status) + '">' + t.status + '</span>';
                html += '<span>' + t.trader + '</span>';
                html += '<span class="text-mono" style="font-size:var(--font-size-xs);">' + t.createTime + '</span>';
                html += '</div>';
                if (contracts.length > 0) {
                    html += '<div class="trade-contracts-section">';
                    html += '<div class="trade-contracts-label">关联合同（' + contracts.length + '）</div>';
                    html += '<table class="data-table trade-contracts-table">';
                    html += '<thead><tr><th>合同编号</th><th>合同类型</th><th>对手方</th><th>管理人</th><th>合同金额</th><th>版本</th><th>状态</th><th>操作</th></tr></thead>';
                    html += '<tbody>';
                    contracts.forEach(function(c) {
                        var versionClass = getStatusClass(c.version);
                        var statusClass = getStatusClass(c.status);
                        var actionHtml = '';
                        if (c.status === '待上传用印') {
                            actionHtml = '<button class="btn btn-primary btn-xs" onclick="openSealModal(\'' + c.id + '\')">上传用印版</button>';
                        } else if (c.status === '待推送') {
                            actionHtml = '<button class="btn btn-primary btn-xs" onclick="pushContract(\'' + c.id + '\')">推送合同系统</button>';
                        } else {
                            actionHtml = '<span style="color:var(--text-muted);font-size:var(--font-size-xs);">-</span>';
                        }
                        html += '<tr>';
                        html += '<td class="text-mono">' + c.id + '</td>';
                        html += '<td>' + c.type + '</td>';
                        html += '<td>' + c.counterpartyName + '</td>';
                        html += '<td>' + (c.manager || '-') + '</td>';
                        html += '<td class="text-mono">' + formatMoney(c.amount) + '</td>';
                        html += '<td><span class="status-badge ' + versionClass + '">' + c.version + '</span></td>';
                        html += '<td><span class="status-badge ' + statusClass + '">' + c.status + '</span></td>';
                        html += '<td>' + actionHtml + '</td>';
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    html += '</div>';
                }
                html += '</div></div>';
            });
            container.innerHTML = html;
        }

        function renderErpTracking() {
            var trades = TRADES.filter(function(t) { return t.productId === currentProduct.id; });
            var container = document.getElementById('erpContainer');
            if (trades.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">暂无ERP跟踪记录</p>';
                return;
            }
            var html = '';
            trades.forEach(function(t) {
                var approval = APPROVALS.find(function(a) { return a.object === t.id; });
                html += '<div style="margin-bottom:14px;padding:12px;background:var(--border-light);border-radius:var(--radius);border:1px solid var(--border-light);">';
                html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
                html += '<div><span class="font-bold">' + t.id + '</span> <span class="status-badge ' + getStatusClass(t.status) + '">' + t.status + '</span></div>';
                html += '<div style="font-size:var(--font-size-xs);color:var(--text-muted);">' + t.createTime + '</div>';
                html += '</div>';
                html += '<div style="font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:8px;">' + t.type + ' ' + t.productName + ' · 申请金额 ' + formatMoney(t.applyAmount) + (t.remark ? ' · ' + t.remark : '') + '</div>';
                if (approval && approval.steps) {
                    html += '<div class="erp-timeline">';
                    approval.steps.forEach(function(step) {
                        var cls = '';
                        if (step.status === '已完成') cls = 'step-done';
                        else if (step.status === '当前') cls = 'step-current';
                        else if (step.status === '已驳回' || step.result === '驳回') cls = 'step-rejected';
                        html += '<div class="erp-step ' + cls + '">';
                        html += '<div class="step-title">' + step.title + '</div>';
                        if (step.time) html += '<div class="step-time">' + step.time + '</div>';
                        if (step.user) html += '<div class="step-user">' + step.user + '</div>';
                        if (step.result === '驳回' && step.reason) html += '<div style="font-size:var(--font-size-xs);color:var(--danger);margin-top:2px;">驳回原因：' + step.reason + '</div>';
                        html += '</div>';
                    });
                    html += '</div>';
                } else {
                    html += '<div style="font-size:var(--font-size-xs);color:var(--text-muted);">暂无审批流程信息</div>';
                }
                html += '</div>';
            });
            container.innerHTML = html;
        }

        function renderChangeLogs() {
            var logs = generateChangeLogs(currentProduct.id);
            var container = document.getElementById('logsContainer');
            if (logs.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">暂无变更日志</p>';
                return;
            }
            var html = '<table class="data-table change-log-table">' +
                '<thead><tr><th>时间</th><th>操作人</th><th>类型</th><th>变更内容</th></tr></thead><tbody>';
            logs.forEach(function(l) {
                var typeLabel = l.type || '信息变更';
                var typeClass = 'log-type-info';
                if (typeLabel === '人员转移') typeClass = 'log-type-transfer';
                else if (typeLabel === '系统更新') typeClass = 'log-type-system';

                var contentHtml = '';
                if (typeLabel === '人员转移' && l.field) {
                    contentHtml = '<span class="log-transfer-tag">【人员转移】</span>' +
                        l.field + '由<span class="log-old-value">' + l.oldValue + '</span>变更为<span class="log-new-value">' + l.newValue + '</span>，原因：账号停用，操作人：<span class="log-new-value">' + l.user + '</span>';
                } else {
                    contentHtml = l.content;
                }

                html += '<tr>' +
                    '<td class="text-mono" style="white-space:nowrap;">' + l.time + '</td>' +
                    '<td>' + l.user + '</td>' +
                    '<td><span class="log-type-badge ' + typeClass + '">' + typeLabel + '</span></td>' +
                    '<td>' + contentHtml + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        var _sealContractId = null;

        function openSealModal(contractId) {
            _sealContractId = contractId;
            var c = CONTRACTS.find(function(x) { return x.id === contractId; });
            if (!c) return;
            var infoHtml = '';
            var fields = [
                { label: '合同编号', value: c.id },
                { label: '合同类型', value: c.type },
                { label: '对手方', value: c.counterpartyName },
                { label: '合同金额', value: formatMoney(c.amount) },
                { label: '初始版文件', value: c.initFile || '-' }
            ];
            fields.forEach(function(f) {
                infoHtml += '<div class="detail-info-item"><div class="info-label">' + f.label + '</div><div class="info-value">' + f.value + '</div></div>';
            });
            document.getElementById('sealContractInfo').innerHTML = infoHtml;
            document.getElementById('sealSignDate').value = '';
            document.getElementById('sealExpireDate').value = '';
            document.getElementById('sealFile').value = '';
            document.getElementById('sealModal').style.display = 'block';
        }

        function closeSealModal() {
            document.getElementById('sealModal').style.display = 'none';
            _sealContractId = null;
        }

        function confirmSealUpload() {
            if (!_sealContractId) return;
            var fileInput = document.getElementById('sealFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('请选择用印版文件');
                return;
            }
            var c = CONTRACTS.find(function(x) { return x.id === _sealContractId; });
            if (!c) return;
            c.sealFile = fileInput.files[0].name;
            c.version = '用印版本';
            c.status = '待推送';
            var signDate = document.getElementById('sealSignDate').value;
            var expireDate = document.getElementById('sealExpireDate').value;
            if (signDate) c.signDate = signDate;
            if (expireDate) c.expireDate = expireDate;
            alert('用印版上传成功，合同状态已更新为「待推送」');
            closeSealModal();
            renderTradeTable();
        }

        function pushContract(contractId) {
            if (!confirm('确定将此合同推送至合同系统？')) return;
            var c = CONTRACTS.find(function(x) { return x.id === contractId; });
            if (!c) return;
            c.status = '已推送';
            alert('合同已成功推送至合同系统');
            renderTradeTable();
        }

        function openEditModal() {
            var p = currentProduct;
            document.getElementById('eName').value = p.name;
            document.getElementById('eShortName').value = p.shortName;
            document.getElementById('eAssetType').value = p.assetType;
            document.getElementById('eProductType').value = p.productType;
            document.getElementById('eHengtaiCode').value = p.hengtaiCode;
            document.getElementById('eExternalCode').value = p.externalCode;
            document.getElementById('eDept').value = p.dept;
            document.getElementById('eGroup').value = p.group;
            document.getElementById('eExpireDate').value = p.expireDate;
            document.getElementById('eRedeemable').value = p.redeemable ? 'true' : 'false';
            document.getElementById('ePlanAmount').value = p.planAmount;
            document.getElementById('eNav').value = p.nav;
            document.getElementById('eTradeLimit').value = p.tradeLimit || 0;
            document.getElementById('eAccountMapping').value = p.accountMapping || '';
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveEdit() {
            var p = currentProduct;
            p.name = document.getElementById('eName').value.trim();
            p.shortName = document.getElementById('eShortName').value.trim();
            p.assetType = document.getElementById('eAssetType').value;
            p.productType = document.getElementById('eProductType').value;
            p.hengtaiCode = document.getElementById('eHengtaiCode').value.trim();
            p.externalCode = document.getElementById('eExternalCode').value.trim();
            p.dept = document.getElementById('eDept').value;
            p.group = document.getElementById('eGroup').value;
            p.expireDate = document.getElementById('eExpireDate').value;
            p.redeemable = document.getElementById('eRedeemable').value === 'true';
            p.planAmount = parseFloat(document.getElementById('ePlanAmount').value) || 0;
            p.nav = parseFloat(document.getElementById('eNav').value) || 1;
            p.tradeLimit = parseFloat(document.getElementById('eTradeLimit').value) || 0;
            p.accountMapping = document.getElementById('eAccountMapping').value.trim();
            var logs = generateChangeLogs(p.id);
            logs.unshift({
                time: new Date().toISOString().slice(0, 16).replace('T', ' '),
                user: getCurrentRole().label,
                content: '编辑产品信息',
                type: '信息变更'
            });
            alert('保存成功');
            closeEditModal();
            renderHeader();
            renderBasicInfo();
        }

        function toggleProductStatus(newStatus) {
            if (!confirm('确定将产品状态变更为「' + newStatus + '」？')) return;
            currentProduct.status = newStatus;
            var logs = generateChangeLogs(currentProduct.id);
            logs.unshift({
                time: new Date().toISOString().slice(0, 16).replace('T', ' '),
                user: getCurrentRole().label,
                content: '产品状态变更：→ ' + newStatus,
                type: '信息变更'
            });
            renderHeader();
        }

        (function init() {
            var pid = getQueryParam('id');
            if (!pid) { location.href = 'product.html'; return; }
            currentProduct = PRODUCTS.find(function(x) { return x.id === pid; });
            if (!currentProduct) { alert('产品不存在'); location.href = 'product.html'; return; }
            renderTabNav();
            renderHeader();
            renderBasicInfo();
            renderNavTable();
            renderTradeTable();
            renderErpTracking();
            renderChangeLogs();
        })();

        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('editModal')) closeEditModal();
            if (event.target === document.getElementById('sealModal')) closeSealModal();
        });
    </script>
</body>
</html>
