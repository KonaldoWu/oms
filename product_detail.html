<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委外投资业务一体化订单管理平台 - 产品详情</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
        .tab-btn { padding: 8px 18px; font-size: var(--font-size-sm); font-weight: 500; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .product-name-link { font-weight: 500; color: var(--primary); cursor: pointer; text-decoration: none; }
        .product-name-link:hover { text-decoration: underline; }
        .change-log-table td:last-child { min-width: 280px; }
        .log-type-badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); font-weight: 600; }
        .log-type-info { background: var(--border-light); color: var(--text-secondary); }
        .log-type-transfer { background: #DBEAFE; color: #2563EB; }
        .log-type-system { background: #F1F5F9; color: #94A3B8; }
        .log-transfer-tag { color: #2563EB; font-weight: 600; }
        .log-old-value { color: #94A3B8; text-decoration: line-through; margin: 0 2px; }
        .log-new-value { color: #2563EB; font-weight: 700; margin: 0 2px; }
    </style>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar"></nav>
        <div class="main-area">
            <div class="topbar"></div>
            <div class="content">
                <div class="detail-page-header">
                    <div class="header-left">
                        <button class="back-btn" onclick="location.href='product.html'" data-logic-id="page_product_detail">← 返回列表</button>
                        <div>
                            <h2 id="pageTitle">产品详情</h2>
                            <div class="header-subtitle" id="pageSubtitle"></div>
                        </div>
                        <span id="statusBadge"></span>
                    </div>
                    <div class="detail-actions" id="detailActions" data-logic-id="modal_edit_product"></div>
                </div>

                <div class="tab-nav" id="tabNav" data-logic-id="page_product_detail"></div>

                <div class="tab-panel active" id="panel-basic" data-logic-id="page_product_detail">
                    <div class="detail-section">
                        <div class="detail-section-title">核心信息</div>
                        <div class="detail-info-grid" id="coreInfoGrid"></div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-section-title">扩展信息</div>
                        <div class="detail-info-grid" id="extInfoGrid"></div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-nav">
                    <div class="card">
                        <div class="card-header"><span class="card-title">净值记录</span></div>
                        <div class="card-body-p0">
                            <table class="data-table">
                                <thead><tr><th>日期</th><th>单位净值</th><th>累计净值</th><th>日收益率(%)</th></tr></thead>
                                <tbody id="navTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-logs">
                    <div class="card">
                        <div class="card-header"><span class="card-title">变更日志</span></div>
                        <div class="card-body" id="logsContainer"></div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-trades">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">交易记录</span>
                            <span style="font-size:var(--font-size-xs);color:var(--text-muted);margin-left:12px;">按创建时间倒序，展示该产品全部交易明细</span>
                        </div>
                        <div class="card-body-p0">
                            <table class="data-table">
                                <thead><tr><th>交易编号</th><th>交易类型</th><th>申报金额(元)</th><th>成交金额(元)</th><th>状态</th><th>合同状态</th><th>发起人</th><th>创建时间</th><th>成交日期</th><th>操作</th></tr></thead>
                                <tbody id="tradesTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-dividends">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">兑息兑付记录</span>
                            <span style="font-size:var(--font-size-xs);color:var(--text-muted);margin-left:12px;">财务发起 → 交易员确认 → 财务最终确认 → 生成凭证 → 推送iBor</span>
                        </div>
                        <div class="card-body-p0">
                            <table class="data-table">
                                <thead><tr><th>流程编号</th><th>兑付日期</th><th>每百元应付利息(元)</th><th>每百元应付本金(元)</th><th>状态</th><th>发起人</th><th>创建时间</th><th>凭证编号</th><th>操作</th></tr></thead>
                                <tbody id="dividendsTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="dividendDetailModal" class="modal" data-logic-id="modal_dividend_detail">
        <div class="modal-content" style="width:720px;">
            <div class="modal-header">
                <h3 id="divDetailTitle">兑息兑付详情</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeDividendDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="divDetailBody"></div>
            <div class="modal-footer" id="divDetailFooter"></div>
        </div>
    </div>

    <div id="editModal" class="modal" data-logic-id="modal_edit_product">
        <div class="modal-content" style="width:680px;">
            <div class="modal-header">
                <h3>编辑产品</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeEditModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="grid-2" style="gap:10px;">
                    <div class="form-group"><label>产品名称 <span style="color:red;">*</span></label><input type="text" id="eName"></div>
                    <div class="form-group"><label>产品简称 <span style="color:red;">*</span></label><input type="text" id="eShortName"></div>
                    <div class="form-group"><label>资产类型</label><select id="eAssetType"><option value="专户资管产品">专户资管产品</option><option value="ABS(中保登)">ABS(中保登)</option><option value="信托">信托</option><option value="碳金融">碳金融</option></select></div>
                    <div class="form-group"><label>产品类型</label><select id="eProductType"><option value="混合型">混合型</option><option value="FOF">FOF</option><option value="固收类">固收类</option><option value="权益类">权益类</option></select></div>
                    <div class="form-group"><label>衡泰代码</label><input type="text" id="eHengtaiCode"></div>
                    <div class="form-group"><label>外部代码</label><input type="text" id="eExternalCode"></div>
                    <div class="form-group"><label>所属部门</label><select id="eDept"><option value="创新金融业务总部">创新金融业务总部</option><option value="FICC固定收益业务总部">FICC固定收益业务总部</option><option value="证券投资部">证券投资部</option></select></div>
                    <div class="form-group"><label>投资组</label><select id="eGroup"><option value="">请选择</option><option value="专户投资组">专户投资组</option><option value="xn账户">xn账户</option><option value="fb账户">fb账户</option><option value="理财投资组">理财投资组</option><option value="权益投资组">权益投资组</option></select></div>
                    <div class="form-group"><label>到期日期</label><input type="date" id="eExpireDate"></div>
                    <div class="form-group"><label>可赎回</label><select id="eRedeemable"><option value="true">是</option><option value="false">否</option></select></div>
                    <div class="form-group"><label>计划额度(元)</label><input type="number" id="ePlanAmount" step="10000"></div>
                    <div class="form-group"><label>当前净值</label><input type="number" id="eNav" step="0.0001"></div>
                    <div class="form-group"><label>交易限额(元)</label><input type="number" id="eTradeLimit" step="10000" value="0"></div>
                    <div class="form-group"><label>科目映射</label><input type="text" id="eAccountMapping" placeholder='如 {"debit":"1101","credit":"1002"}'></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        initLayout('product_detail.html', '产品详情');

        var _canEditProduct = hasPermission('editProduct');
        var _isReadOnly = isReadOnly();
        var currentProduct = null;
        var currentTab = 'basic';

        var tabs = [
            { key: 'basic', label: '基础信息' },
            { key: 'nav', label: '净值记录' },
            { key: 'trades', label: '交易记录' },
            { key: 'dividends', label: '兑息兑付', onlyFor: ['信托', 'ABS(中保登)'] },
            { key: 'logs', label: '变更日志' }
        ];

        var changeLogs = {};

        function getQueryParam(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        function generateNavHistory(pid) {
            if (NAV_HISTORY[pid]) return NAV_HISTORY[pid];
            var p = PRODUCTS.find(function(x) { return x.id === pid; });
            if (!p || !p.nav || p.nav === 1.0 && p.navDate === '') return [];
            var hist = [];
            var baseNav = p.nav;
            var baseDate = new Date(p.navDate || '2026-05-17');
            for (var i = 0; i < 7; i++) {
                var d = new Date(baseDate);
                d.setDate(d.getDate() - i);
                var dateStr = d.toISOString().slice(0, 10);
                var nav = baseNav - i * 0.0012 + (Math.random() - 0.5) * 0.002;
                nav = Math.round(nav * 10000) / 10000;
                var accNav = Math.round((nav + i * 0.1) * 10000) / 10000;
                var dailyReturn = i === 0 ? (Math.random() * 0.2 - 0.05) : (Math.random() * 0.3 - 0.1);
                dailyReturn = Math.round(dailyReturn * 100) / 100;
                hist.push({ date: dateStr, nav: nav, accNav: accNav, dailyReturn: dailyReturn });
            }
            hist[0].nav = p.nav;
            return hist;
        }

        function generateChangeLogs(pid) {
            if (changeLogs[pid]) return changeLogs[pid];
            var p = PRODUCTS.find(function(x) { return x.id === pid; });
            if (!p) return [];
            var logs = [
                { time: p.poolTime, user: p.poolUser, content: '产品入池：' + p.shortName, type: '信息变更' },
                { time: p.poolTime.replace(/\d{2}:\d{2}$/, function() { return (parseInt(p.poolTime.substr(11, 2)) + 1) + ':30'; }), user: '孙磊', content: '部门经理审批通过', type: '信息变更' }
            ];
            if (p.status === '完结' || p.status === '已到期') {
                logs.unshift({ time: p.navDate + ' 16:00', user: '系统', content: '产品状态变更：→ ' + p.status, type: '系统更新' });
            }
            if (p.status === '禁用') {
                logs.unshift({ time: '2026-05-15 14:00', user: '刘伟', content: '产品禁用', type: '信息变更' });
            }
            if (p.holdAmount > 0) {
                logs.unshift({ time: p.navDate + ' 17:00', user: '系统', content: '净值更新：' + p.nav.toFixed(4), type: '系统更新' });
            }
            logs.unshift(
                { time: '2026-04-15 16:30', user: '系统管理员', field: '投资经理', oldValue: '周欣', newValue: '张明', type: '人员转移' },
                { time: '2026-04-15 16:30', user: '系统管理员', field: '交易员', oldValue: '赵丽', newValue: '李华', type: '人员转移' }
            );
            changeLogs[pid] = logs;
            return logs;
        }

        function renderTabNav() {
            var html = '';
            tabs.forEach(function(t) {
                // 根据 onlyFor 过滤（如兑息兑付Tab仅信托/ABS显示）
                if (t.onlyFor && currentProduct && t.onlyFor.indexOf(currentProduct.assetType) < 0) return;
                html += '<button class="tab-btn' + (t.key === currentTab ? ' active' : '') + '" onclick="switchTab(\'' + t.key + '\')">' + t.label + '</button>';
            });
            document.getElementById('tabNav').innerHTML = html;
        }

        function switchTab(key) {
            currentTab = key;
            tabs.forEach(function(t) {
                var panel = document.getElementById('panel-' + t.key);
                if (panel) {
                    panel.classList.toggle('active', t.key === key);
                }
            });
            if (key === 'trades') renderTradesTable();
            if (key === 'dividends') renderDividendsTable();
            renderTabNav();
        }

        function renderHeader() {
            var p = currentProduct;
            document.getElementById('pageTitle').textContent = p.name;
            document.getElementById('pageSubtitle').textContent = p.id + ' · ' + p.assetType + ' · ' + p.productType;
            document.getElementById('statusBadge').innerHTML = '<span class="status-badge ' + getStatusClass(p.status) + '">' + p.status + '</span>';
            var actions = '';
            if (_canEditProduct && !_isReadOnly && p.status === '无计划') {
                actions += '<button class="btn btn-primary btn-sm" onclick="openEditModal()">编辑</button>';
            }
            document.getElementById('detailActions').innerHTML = actions;
        }

        function renderBasicInfo() {
            var p = currentProduct;
            var cpName = '-';
            if (p.counterparty) {
                var cp = COUNTERPARTIES.find(function(x) { return x.id === p.counterparty; });
                cpName = cp ? '<a class="product-name-link" href="counterparty_detail.html?id=' + cp.id + '">' + cp.name + '</a>' : p.counterparty;
            }
            var coreFields = [
                { label: '产品ID', value: p.id },
                { label: '产品名称', value: p.name },
                { label: '产品简称', value: p.shortName },
                { label: '资产类型', value: p.assetType },
                { label: '产品类型', value: p.productType },
                { label: '衡泰代码', value: p.hengtaiCode || '-' },
                { label: '外部代码', value: p.externalCode || '-' },
                { label: '所属部门', value: p.dept },
                { label: '投资组', value: p.group || '-' },
                { label: '状态', value: '<span class="status-badge ' + getStatusClass(p.status) + '">' + p.status + '</span>' },
                { label: '关联对手方', value: cpName }
            ];
            var extFields = [
                { label: '到期日期', value: p.expireDate || '无固定期限' },
                { label: '可赎回', value: p.redeemable ? '是' : '否' },
                { label: '当前净值', value: p.nav ? p.nav.toFixed(4) : '-' },
                { label: '净值日期', value: p.navDate || '-' },
                { label: '持仓金额', value: p.holdAmount ? formatMoney(p.holdAmount) : '-' },
                { label: '持仓份额', value: p.holdShares ? p.holdShares.toLocaleString() : '-' },
                { label: '计划额度', value: p.planAmount ? formatMoney(p.planAmount) : '-' },
                { label: '已用额度', value: p.usedAmount ? formatMoney(p.usedAmount) : '-' },
                { label: '交易限额', value: p.tradeLimit ? formatMoney(p.tradeLimit) : '不限' },
                { label: '科目映射', value: p.accountMapping || '-' },
                { label: '入池操作人', value: p.poolUser || '-' },
                { label: '入池时间', value: p.poolTime || '-' }
            ];
            var coreHtml = '';
            coreFields.forEach(function(f) {
                coreHtml += '<div class="detail-info-item"><div class="info-label">' + f.label + '</div><div class="info-value">' + f.value + '</div></div>';
            });
            document.getElementById('coreInfoGrid').innerHTML = coreHtml;
            var extHtml = '';
            extFields.forEach(function(f) {
                extHtml += '<div class="detail-info-item"><div class="info-label">' + f.label + '</div><div class="info-value">' + f.value + '</div></div>';
            });
            document.getElementById('extInfoGrid').innerHTML = extHtml;
        }

        function renderNavTable() {
            var hist = generateNavHistory(currentProduct.id);
            var tbody = document.getElementById('navTableBody');
            if (hist.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px;">暂无净值记录</td></tr>';
                return;
            }
            var html = '';
            hist.forEach(function(h) {
                var color = h.dailyReturn >= 0 ? 'var(--success)' : 'var(--danger)';
                html += '<tr><td>' + h.date + '</td><td class="text-mono">' + h.nav.toFixed(4) + '</td><td class="text-mono">' + h.accNav.toFixed(4) + '</td><td style="color:' + color + ';font-weight:600;">' + (h.dailyReturn >= 0 ? '+' : '') + h.dailyReturn.toFixed(2) + '%</td></tr>';
            });
            tbody.innerHTML = html;
        }

        // 渲染该产品的全部交易记录（按创建时间倒序）
        function renderTradesTable() {
            var trades = TRADES.filter(function(t) { return t.productId === currentProduct.id; });
            // 按创建时间倒序
            trades.sort(function(a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
            var tbody = document.getElementById('tradesTableBody');
            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-muted);padding:20px;">该产品暂无交易记录</td></tr>';
                return;
            }
            var html = '';
            trades.forEach(function(t) {
                // 合同状态
                var contractStatus = '<span style="color:var(--text-muted);">无合同</span>';
                var ct = CONTRACTS.find(function(c) { return c.tradeId === t.id; });
                if (ct) {
                    contractStatus = '<span class="status-badge ' + getStatusClass(ct.status) + '">' + ct.status + '</span>';
                }
                var dealAmount = t.actualDealAmount > 0 ? formatMoney(t.actualDealAmount) : (t.dealAmount > 0 ? formatMoney(t.dealAmount) : '-');
                var dealDate = t.traderConfirmTime ? t.traderConfirmTime.slice(0, 10) : '-';
                html += '<tr>' +
                    '<td class="text-mono"><a href="trade.html?tradeId=' + t.id + '" style="color:var(--primary);">' + t.id + '</a></td>' +
                    '<td>' + t.type + '</td>' +
                    '<td class="text-mono">' + formatMoney(t.applyAmount) + '</td>' +
                    '<td class="text-mono">' + dealAmount + '</td>' +
                    '<td><span class="status-badge ' + getStatusClass(t.status) + '">' + t.status + '</span></td>' +
                    '<td>' + contractStatus + '</td>' +
                    '<td>' + (t.trader || '-') + '</td>' +
                    '<td class="text-mono">' + (t.createTime || '-') + '</td>' +
                    '<td class="text-mono">' + dealDate + '</td>' +
                    '<td><a href="trade.html?tradeId=' + t.id + '" class="btn btn-info btn-sm">查看详情</a></td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
        }

        // 渲染该产品的全部兑息兑付记录（按创建时间倒序）
        function renderDividendsTable() {
            var list = DIVIDENDS.filter(function(d) { return d.productId === currentProduct.id; });
            list.sort(function(a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
            var tbody = document.getElementById('dividendsTableBody');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:20px;">该产品暂无兑息兑付记录</td></tr>';
                return;
            }
            var html = '';
            list.forEach(function(d) {
                var voucherCell = d.voucherId ? '<a href="finance.html?voucherId=' + d.voucherId + '" style="color:var(--primary);">' + d.voucherId + '</a>' : '-';
                html += '<tr>' +
                    '<td class="text-mono"><a href="approval.html?dividendId=' + d.id + '" style="color:var(--primary);" onclick="event.preventDefault();openDividendDetail(\'' + d.id + '\')">' + d.id + '</a></td>' +
                    '<td class="text-mono">' + d.divDate + '</td>' +
                    '<td class="text-mono">' + d.interestPer100.toFixed(4) + '</td>' +
                    '<td class="text-mono">' + d.principalPer100.toFixed(4) + '</td>' +
                    '<td><span class="status-badge ' + getStatusClass(d.status) + '">' + d.status + '</span></td>' +
                    '<td>' + (d.initiator || '-') + '</td>' +
                    '<td class="text-mono">' + (d.createTime || '-') + '</td>' +
                    '<td class="text-mono">' + voucherCell + '</td>' +
                    '<td><button class="btn btn-info btn-sm" onclick="openDividendDetail(\'' + d.id + '\')">查看详情</button></td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
        }

        function closeDividendDetailModal() {
            document.getElementById('dividendDetailModal').style.display = 'none';
        }

        function openDividendDetail(dividendId) {
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) { alert('未找到兑息兑付记录：' + dividendId); return; }
            document.getElementById('divDetailTitle').textContent = '兑息兑付详情 - ' + d.id;

            var roleKey = getCurrentRoleKey();
            var isTraderStep = (d.status === '待交易员确认' && (roleKey === 'trader' || roleKey === 'demo'));
            var isFinanceStep = (d.status === '交易员已确认' && (roleKey === 'financial_staff' || roleKey === 'demo'));

            var body = '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">';
            body += '<div class="detail-info-item"><div class="info-label">流程编号</div><div class="info-value">' + d.id + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">当前状态</div><div class="info-value"><span class="status-badge ' + getStatusClass(d.status) + '">' + d.status + '</span></div></div>';
            body += '<div class="detail-info-item"><div class="info-label">产品名称</div><div class="info-value">' + d.productName + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">产品内部编码</div><div class="info-value">' + (d.innerCode || '-') + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">产品外部编码</div><div class="info-value">' + (d.externalCode || '-') + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">发起人</div><div class="info-value">' + (d.initiator || '-') + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">创建时间</div><div class="info-value">' + (d.createTime || '-') + '</div></div>';
            body += '</div>';

            body += '<div class="detail-section-title">兑息兑付信息（iBor兑息兑付字段）</div>';
            if (isTraderStep) {
                body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;">';
                body += '<div class="form-group"><label style="font-size:var(--font-size-xs);color:var(--text-muted);">兑付日期</label><input type="date" id="pdDivEditDate" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);" value="' + d.divDate + '"></div>';
                body += '<div class="form-group"><label style="font-size:var(--font-size-xs);color:var(--text-muted);">每百元应付利息(元)</label><input type="number" step="0.0001" id="pdDivEditInterest" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);" value="' + d.interestPer100 + '"></div>';
                body += '<div class="form-group"><label style="font-size:var(--font-size-xs);color:var(--text-muted);">每百元应付本金(元)</label><input type="number" step="0.0001" id="pdDivEditPrincipal" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);" value="' + d.principalPer100 + '"></div>';
                body += '<div class="form-group"><label style="font-size:var(--font-size-xs);color:var(--text-muted);">备注</label><input type="text" id="pdDivEditRemark" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);" value="' + (d.remark || '') + '"></div>';
                body += '<div class="form-group" style="grid-column:1/3;"><label style="font-size:var(--font-size-xs);color:var(--text-muted);">确认备注 / 驳回原因</label><textarea id="pdDivTraderRemark" rows="2" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);resize:vertical;" placeholder="选填；确认时作为备注，驳回时作为驳回原因"></textarea></div>';
                body += '</div>';
                body += '<input type="hidden" id="pdDivRejectReason" value="">';
            } else {
                body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:6px;">';
                body += '<div class="detail-info-item"><div class="info-label">兑付日期</div><div class="info-value">' + d.divDate + '</div></div>';
                body += '<div class="detail-info-item"><div class="info-label">每百元应付利息</div><div class="info-value">' + d.interestPer100.toFixed(4) + ' 元</div></div>';
                body += '<div class="detail-info-item"><div class="info-label">每百元应付本金</div><div class="info-value">' + d.principalPer100.toFixed(4) + ' 元</div></div>';
                body += '<div class="detail-info-item" style="grid-column:1/3;"><div class="info-label">备注</div><div class="info-value">' + (d.remark || '-') + '</div></div>';
                body += '</div>';
                if (d.traderConfirmUser) {
                    body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:6px;">';
                    body += '<div class="detail-info-item"><div class="info-label">交易员确认</div><div class="info-value">' + d.traderConfirmUser + ' ' + d.traderConfirmTime + (d.traderModified ? '（已修改字段）' : '') + '</div></div>';
                    body += '<div class="detail-info-item" style="grid-column:1/3;"><div class="info-label">交易员备注</div><div class="info-value">' + (d.traderRemark || '-') + '</div></div>';
                    body += '</div>';
                }
                if (isFinanceStep) {
                    body += '<div class="detail-section-title">驳回原因</div>';
                    body += '<textarea id="pdDivRejectReason" rows="3" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--font-size-sm);resize:vertical;" placeholder="如需驳回请填写原因..."></textarea>';
                    body += '<input type="hidden" id="pdDivTraderRemark" value="">';
                }
            }

            if (d.voucherId) {
                body += '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;margin-top:10px;">';
                body += '<div class="detail-info-item"><div class="info-label">凭证编号</div><div class="info-value"><a href="finance.html?voucherId=' + d.voucherId + '" style="color:var(--primary);">' + d.voucherId + '</a></div></div>';
                body += '<div class="detail-info-item"><div class="info-label">iBor推送</div><div class="info-value">' + (d.pushIborStatus || '未推送') + (d.pushIborTime ? ' (' + d.pushIborTime + ')' : '') + '</div></div>';
                body += '</div>';
            }

            body += '<div class="detail-section-title">处理记录</div>';
            body += '<div class="timeline">';
            d.history.forEach(function(h) {
                body += '<div class="timeline-item">';
                body += '<div class="timeline-dot completed"></div>';
                body += '<div class="timeline-title">' + h.action + '</div>';
                if (h.user) body += '<div class="timeline-user">' + h.user + '</div>';
                if (h.time) body += '<div class="timeline-time">' + h.time + '</div>';
                if (h.remark) body += '<div class="timeline-time" style="color:var(--text-secondary);">' + h.remark + '</div>';
                body += '</div>';
            });
            body += '</div>';

            document.getElementById('divDetailBody').innerHTML = body;

            var footer = '<button class="btn btn-ghost" onclick="closeDividendDetailModal()">关闭</button>';
            if (isTraderStep) {
                footer += '<button class="btn btn-danger" onclick="pdRejectDividend(\'' + d.id + '\')">驳回</button>';
                footer += '<button class="btn btn-primary" onclick="pdConfirmDividend(\'' + d.id + '\', false)">确认</button>';
            } else if (isFinanceStep) {
                footer += '<button class="btn btn-danger" onclick="pdRejectDividend(\'' + d.id + '\')">驳回</button>';
                footer += '<button class="btn btn-success" onclick="pdConfirmDividend(\'' + d.id + '\', true)">最终确认</button>';
            }
            document.getElementById('divDetailFooter').innerHTML = footer;
            document.getElementById('dividendDetailModal').style.display = 'block';
        }

        function pdConfirmDividend(dividendId, isFinal) {
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            if (!isFinal) {
                var modified = false;
                var modifyRemark = [];
                var newDate = document.getElementById('pdDivEditDate').value;
                var newInterest = parseFloat(document.getElementById('pdDivEditInterest').value);
                var newPrincipal = parseFloat(document.getElementById('pdDivEditPrincipal').value);
                var newRemark = document.getElementById('pdDivEditRemark').value;
                var traderRemark = document.getElementById('pdDivTraderRemark').value;

                if (newDate !== d.divDate) { modifyRemark.push('兑付日期从' + d.divDate + '改为' + newDate); d.divDate = newDate; modified = true; }
                if (newInterest !== d.interestPer100) { modifyRemark.push('每百元应付利息从' + d.interestPer100 + '调整为' + newInterest); d.interestPer100 = newInterest; modified = true; }
                if (newPrincipal !== d.principalPer100) { modifyRemark.push('每百元应付本金从' + d.principalPer100 + '调整为' + newPrincipal); d.principalPer100 = newPrincipal; modified = true; }
                if (newRemark !== d.remark) { d.remark = newRemark; modified = true; }

                d.traderConfirmUser = role.label;
                d.traderConfirmTime = nowStr;
                d.traderModified = modified;
                d.traderRemark = traderRemark || (modified ? modifyRemark.join('，') : '确认无误');
                d.status = '交易员已确认';
                d.history.push({ user: role.label, action: '交易员确认' + (modified ? '（已修改字段）' : ''), time: nowStr, remark: d.traderRemark });
            } else {
                d.financeConfirmUser = role.label;
                d.financeConfirmTime = nowStr;
                d.status = '已完成';
                d.history.push({ user: role.label, action: '财务最终确认', time: nowStr, remark: '' });

                var voucherSeq = 1;
                VOUCHERS.forEach(function(v) { if (v.id && v.id.indexOf('VCH' + d.divDate.replace(/-/g,'')) === 0) voucherSeq++; });
                var voucherId = 'VCH' + d.divDate.replace(/-/g,'') + String(voucherSeq).padStart(3,'0');
                VOUCHERS.push({
                    id: voucherId,
                    summary: d.productName + '兑息兑付(利息' + d.interestPer100 + '/本金' + d.principalPer100 + '每百元)',
                    debitAccount: '1122-应收利息',
                    creditAccount: '6001-投资收益',
                    amount: d.interestPer100 + d.principalPer100,
                    maker: role.label,
                    makeTime: nowStr
                });
                d.voucherId = voucherId;
                d.history.push({ user: '系统', action: '生成凭证' + voucherId, time: nowStr, remark: '' });

                var frSeq = 1;
                FINANCES.forEach(function(f) { if (f.id && f.id.indexOf('FR' + d.divDate.replace(/-/g,'')) === 0) frSeq++; });
                FINANCES.push({
                    id: 'FR' + d.divDate.replace(/-/g,'') + String(frSeq).padStart(3,'0'),
                    productId: d.productId,
                    productName: d.productName,
                    changeType: '兑息兑付',
                    changeDate: d.divDate,
                    changeAmount: d.interestPer100 + d.principalPer100,
                    voucherStatus: '待确认',
                    createMethod: '系统自动生成',
                    source: '兑息兑付流程',
                    voucherId: voucherId
                });
            }
            closeDividendDetailModal();
            renderDividendsTable();
            alert(isFinal ? '财务最终确认成功！已自动生成凭证' + d.voucherId + '。\n可在【财务核算】模块查看并推送到iBor。' : '交易员确认成功！已转交财务最终确认。');
        }

        function pdRejectDividend(dividendId) {
            var reason = document.getElementById('pdDivRejectReason').value || document.getElementById('pdDivTraderRemark').value;
            if (!reason) { alert('请填写驳回原因'); return; }
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            d.status = '已驳回';
            d.traderConfirmUser = d.traderConfirmUser || role.label;
            d.traderConfirmTime = d.traderConfirmTime || nowStr;
            d.traderRemark = reason;
            d.history.push({ user: role.label, action: '驳回', time: nowStr, remark: reason });
            closeDividendDetailModal();
            renderDividendsTable();
            alert('已驳回该兑息兑付流程');
        }

        function renderChangeLogs() {
            var logs = generateChangeLogs(currentProduct.id);
            var container = document.getElementById('logsContainer');
            if (logs.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">暂无变更日志</p>';
                return;
            }
            var html = '<table class="data-table change-log-table">' +
                '<thead><tr><th>时间</th><th>操作人</th><th>类型</th><th>变更内容</th></tr></thead><tbody>';
            logs.forEach(function(l) {
                var typeLabel = l.type || '信息变更';
                var typeClass = 'log-type-info';
                if (typeLabel === '人员转移') typeClass = 'log-type-transfer';
                else if (typeLabel === '系统更新') typeClass = 'log-type-system';

                var contentHtml = '';
                if (typeLabel === '人员转移' && l.field) {
                    contentHtml = '<span class="log-transfer-tag">【人员转移】</span>' +
                        l.field + '由<span class="log-old-value">' + l.oldValue + '</span>变更为<span class="log-new-value">' + l.newValue + '</span>，原因：账号停用，操作人：<span class="log-new-value">' + l.user + '</span>';
                } else {
                    contentHtml = l.content;
                }

                html += '<tr>' +
                    '<td class="text-mono" style="white-space:nowrap;">' + l.time + '</td>' +
                    '<td>' + l.user + '</td>' +
                    '<td><span class="log-type-badge ' + typeClass + '">' + typeLabel + '</span></td>' +
                    '<td>' + contentHtml + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function openEditModal() {
            var p = currentProduct;
            document.getElementById('eName').value = p.name;
            document.getElementById('eShortName').value = p.shortName;
            document.getElementById('eAssetType').value = p.assetType;
            document.getElementById('eProductType').value = p.productType;
            document.getElementById('eHengtaiCode').value = p.hengtaiCode;
            document.getElementById('eExternalCode').value = p.externalCode;
            document.getElementById('eDept').value = p.dept;
            document.getElementById('eGroup').value = p.group;
            document.getElementById('eExpireDate').value = p.expireDate;
            document.getElementById('eRedeemable').value = p.redeemable ? 'true' : 'false';
            document.getElementById('ePlanAmount').value = p.planAmount;
            document.getElementById('eNav').value = p.nav;
            document.getElementById('eTradeLimit').value = p.tradeLimit || 0;
            document.getElementById('eAccountMapping').value = p.accountMapping || '';
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveEdit() {
            var p = currentProduct;
            p.name = document.getElementById('eName').value.trim();
            p.shortName = document.getElementById('eShortName').value.trim();
            p.assetType = document.getElementById('eAssetType').value;
            p.productType = document.getElementById('eProductType').value;
            p.hengtaiCode = document.getElementById('eHengtaiCode').value.trim();
            p.externalCode = document.getElementById('eExternalCode').value.trim();
            p.dept = document.getElementById('eDept').value;
            p.group = document.getElementById('eGroup').value;
            p.expireDate = document.getElementById('eExpireDate').value;
            p.redeemable = document.getElementById('eRedeemable').value === 'true';
            p.planAmount = parseFloat(document.getElementById('ePlanAmount').value) || 0;
            p.nav = parseFloat(document.getElementById('eNav').value) || 1;
            p.tradeLimit = parseFloat(document.getElementById('eTradeLimit').value) || 0;
            p.accountMapping = document.getElementById('eAccountMapping').value.trim();
            var logs = generateChangeLogs(p.id);
            logs.unshift({
                time: new Date().toISOString().slice(0, 16).replace('T', ' '),
                user: getCurrentRole().label,
                content: '编辑产品信息',
                type: '信息变更'
            });
            alert('保存成功');
            closeEditModal();
            renderHeader();
            renderBasicInfo();
        }

        (function init() {
            var pid = getQueryParam('id');
            if (!pid) { location.href = 'product.html'; return; }
            currentProduct = PRODUCTS.find(function(x) { return x.id === pid; });
            if (!currentProduct) { alert('产品不存在'); location.href = 'product.html'; return; }
            renderTabNav();
            renderHeader();
            renderBasicInfo();
            renderNavTable();
            renderChangeLogs();
        })();

        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('editModal')) closeEditModal();
        });
    </script>
</body>
</html>
