<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>委外投资业务一体化订单管理平台 - 系统管理</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 14px;
        }
        .tab-item {
            padding: 8px 20px;
            cursor: pointer;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.15s;
        }
        .tab-item:hover { color: var(--primary); }
        .tab-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .config-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
        }
        .config-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }
        .config-card-header:hover { background: var(--border-light); }
        .config-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--text-primary);
        }
        .config-card-title .config-icon {
            font-size: 16px;
        }
        .config-card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .config-card-summary {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            margin-right: 8px;
        }
        .config-toggle-icon {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .config-card.expanded .config-toggle-icon {
            transform: rotate(180deg);
        }
        .config-card-body {
            display: none;
            padding: 14px;
            border-top: 1px solid var(--border-light);
            background: var(--border-light);
        }
        .config-card.expanded .config-card-body {
            display: block;
        }
        .config-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .config-form-row .form-group { margin-bottom: 10px; }
        .config-save-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .toast {
            position: fixed;
            top: 60px;
            right: 20px;
            padding: 10px 20px;
            background: var(--success);
            color: white;
            border-radius: var(--radius);
            font-size: var(--font-size-sm);
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .subject-list-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .subject-list-table th,
        .subject-list-table td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
            font-size: var(--font-size-sm);
        }
        .subject-list-table th {
            background: var(--border-light);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: var(--font-size-xs);
        }
        .log-type-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: var(--font-size-xs);
            font-weight: 600;
        }
        .log-type-operation { background: var(--info-bg); color: #1E40AF; }
        .log-type-system { background: #F5F3FF; color: #5B21B6; }
        .log-type-email { background: var(--success-bg); color: #065F46; }
        .log-type-nc { background: var(--warning-bg); color: #92400E; }
    </style>
</head>
<body>

        <div class="main-area">

            <div class="content">

                    <div class="tab-item" onclick="switchTab('logs')">日志查询</div>
                </div>

                </div>

                <div id="tab-logs" class="tab-content">

                            <option value="NC推送日志">NC推送日志</option>
                        </select>
                        <input type="date" id="logDateStart" class="search-input" style="flex:none;width:140px;" onchange="renderLogTable()">
                        <span style="color:var(--text-muted);font-size:var(--font-size-sm);">至</span>
                        <input type="date" id="logDateEnd" class="search-input" style="flex:none;width:140px;" onchange="renderLogTable()">
                        <input type="text" id="logKeyword" placeholder="搜索关键词" class="search-input" style="flex:none;width:200px;">
                        <button class="btn btn-primary" onclick="renderLogTable()">搜索</button>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">日志列表</span>
                            <button class="btn btn-ghost btn-sm" onclick="exportLogs()">导出日志</button>

                                <thead>
                                    <tr>

                                        <th>日志类型</th>
                                        <th>操作人</th>
                                        <th>操作内容</th>
                                        <th>IP地址</th>
                                        <th>操作结果</th>
                                    </tr>
                                </thead>
                                <tbody id="logTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="subjectModal" class="modal">
        <div class="modal-content" style="width:500px;">
            <div class="modal-header"><h3 id="subjectModalTitle">新增财务科目</h3></div>
            <div class="modal-body">
                <div class="form-group"><label>科目代码 *</label><input type="text" id="subjectCode" placeholder="如 1101"></div>
                <div class="form-group"><label>科目名称 *</label><input type="text" id="subjectName" placeholder="如 交易性金融资产"></div>
                <div class="form-group"><label>关联资产类型</label><select id="subjectAssetType">
                    <option value="">请选择</option>
                    <option value="专户资管产品">专户资管产品</option>
                    <option value="ABS">ABS</option>
                    <option value="信托">信托</option>
                    <option value="碳金融">碳金融</option>
                    <option value="通用">通用</option>
                </select></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeSubjectModal()">取消</button>
                <button class="btn btn-primary" onclick="saveSubject()">保存</button>
            </div>
        </div>
    </div>

    <div id="alertRuleModal" class="modal">
        <div class="modal-content" style="width:500px;">
            <div class="modal-header"><h3 id="alertRuleModalTitle">新增预警规则</h3></div>
            <div class="modal-body">
                <div class="form-group"><label>预警类型 *</label><select id="alertType">
                    <option value="">请选择预警类型</option>
                    <option value="净值异常波动">净值异常波动</option>
                    <option value="交易金额超限">交易金额超限</option>
                    <option value="NC推送失败">NC推送失败</option>
                    <option value="邮件解析失败">邮件解析失败</option>
                    <option value="审批超时">审批超时</option>
                </select></div>
                <div class="form-group"><label>阈值设置 *</label><input type="text" id="alertThreshold" placeholder="如 日波动>5% 或 金额>1000万"></div>
                <div class="form-group"><label>通知方式</label>
                    <div style="display:flex;gap:16px;margin-top:4px;">
                        <label style="display:flex;align-items:center;gap:4px;font-size:var(--font-size-sm);color:var(--text-secondary);"><input type="checkbox" id="alertNotifyWechat" checked> 企微</label>
                        <label style="display:flex;align-items:center;gap:4px;font-size:var(--font-size-sm);color:var(--text-secondary);"><input type="checkbox" id="alertNotifyEmail"> 邮件</label>
                        <label style="display:flex;align-items:center;gap:4px;font-size:var(--font-size-sm);color:var(--text-secondary);"><input type="checkbox" id="alertNotifySms"> 短信</label>
                    </div>
                </div>
                <div class="form-group"><label>通知人 *</label><input type="text" id="alertNotifyUser" placeholder="如 刘伟、孙磊"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeAlertRuleModal()">取消</button>
                <button class="btn btn-primary" onclick="saveAlertRule()">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/script.js"></script>

        function switchTab(tab) {
            document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 2000);
        }

            html += '<div class="config-card-header" onclick="toggleConfigCard(\'configAlert\')">';
            html += '<div class="config-card-title"><span class="config-icon">⚠️</span>预警规则配置</div>';
            html += '<div class="config-card-actions"><span class="config-card-summary">共' + configData.alertRules.length + '条规则</span><span class="config-toggle-icon">▼</span></div>';
            html += '</div>';
            html += '<div class="config-card-body">';
            html += '<div style="margin-bottom:8px;"><button class="btn btn-primary btn-sm" onclick="openAlertRuleModal()">新增规则</button></div>';
            html += '<table class="subject-list-table"><thead><tr><th>预警类型</th><th>阈值</th><th>通知方式</th><th>通知人</th><th>操作</th></tr></thead><tbody id="alertRuleTableBody"></tbody></table>';
            html += '</div></div>';

            html += '<div class="config-card" id="configWechat">';
            html += '<div class="config-card-header" onclick="toggleConfigCard(\'configWechat\')">';
            html += '<div class="config-card-title"><span class="config-icon">💬</span>企微通知配置</div>';
            html += '<div class="config-card-actions"><span class="config-card-summary">Webhook已配置</span><span class="config-toggle-icon">▼</span></div>';
            html += '</div>';
            html += '<div class="config-card-body">';
            html += '<div class="form-group"><label>Webhook地址</label><input type="text" id="cfgWechatWebhook" value="' + configData.wechat.webhook + '"></div>';
            html += '<div class="config-form-row">';
            html += '<div class="form-group"><label>通知模板</label><input type="text" id="cfgWechatTemplate" value="' + configData.wechat.template + '"></div>';
            html += '<div class="form-group"><label>通知规则</label><input type="text" id="cfgWechatRules" value="' + configData.wechat.rules + '"></div>';
            html += '</div>';
            html += '<div class="config-save-bar"><button class="btn btn-ghost" onclick="cancelConfig(\'configWechat\',\'wechat\')">取消</button><button class="btn btn-primary" onclick="saveWechatConfig()">保存</button></div>';
            html += '</div></div>';

            html += '<div class="config-card" id="configBackup">';
            html += '<div class="config-card-header" onclick="toggleConfigCard(\'configBackup\')">';
            html += '<div class="config-card-title"><span class="config-icon">💾</span>数据备份配置</div>';
            html += '<div class="config-card-actions"><span class="config-card-summary">每日' + configData.backup.time + ' / 保留' + configData.backup.retainDays + '天</span><span class="config-toggle-icon">▼</span></div>';
            html += '</div>';
            html += '<div class="config-card-body">';
            html += '<div class="config-form-row">';
            html += '<div class="form-group"><label>备份时间</label><input type="time" id="cfgBackupTime" value="' + configData.backup.time + '"></div>';
            html += '<div class="form-group"><label>保留天数</label><input type="number" id="cfgBackupRetainDays" value="' + configData.backup.retainDays + '"></div>';
            html += '</div>';
            html += '<div class="form-group"><label>存储路径</label><input type="text" id="cfgBackupPath" value="' + configData.backup.storagePath + '"></div>';
            html += '<div class="config-save-bar"><button class="btn btn-ghost" onclick="cancelConfig(\'configBackup\',\'backup\')">取消</button><button class="btn btn-primary" onclick="saveBackupConfig()">保存</button></div>';
            html += '</div></div>';

            container.innerHTML = html;
            renderSubjectTable();
            renderAlertRuleTable();
        }

        function cancelConfig(cardId, key) {
            var card = document.getElementById(cardId);
            card.classList.remove('expanded');
        }

        function saveEmailConfig() {
            configData.email.protocol = document.getElementById('cfgEmailProtocol').value;
            configData.email.address = document.getElementById('cfgEmailAddress').value;
            configData.email.port = document.getElementById('cfgEmailPort').value;
            configData.email.account = document.getElementById('cfgEmailAccount').value;
            configData.email.receiveTime = document.getElementById('cfgEmailReceiveTime').value;
            showToast('保存成功');
            renderConfigCards();
        }

        function saveNcConfig() {
            configData.nc.apiUrl = document.getElementById('cfgNcApiUrl').value;
            configData.nc.authKey = document.getElementById('cfgNcAuthKey').value;
            configData.nc.timeout = document.getElementById('cfgNcTimeout').value;
            configData.nc.retryCount = document.getElementById('cfgNcRetryCount').value;
            showToast('保存成功');
            renderConfigCards();
        }

        function saveXmlConfig() {
            configData.xml.templateFile = document.getElementById('cfgXmlTemplate').value;
            configData.xml.fieldMapping = document.getElementById('cfgXmlMapping').value;
            showToast('保存成功');
            renderConfigCards();
        }

        function saveWechatConfig() {
            configData.wechat.webhook = document.getElementById('cfgWechatWebhook').value;
            configData.wechat.template = document.getElementById('cfgWechatTemplate').value;
            configData.wechat.rules = document.getElementById('cfgWechatRules').value;
            showToast('保存成功');
            renderConfigCards();
        }

        function saveBackupConfig() {
            configData.backup.time = document.getElementById('cfgBackupTime').value;
            configData.backup.retainDays = document.getElementById('cfgBackupRetainDays').value;
            configData.backup.storagePath = document.getElementById('cfgBackupPath').value;
            showToast('保存成功');
            renderConfigCards();
        }

        function renderSubjectTable() {
            var tbody = document.getElementById('subjectTableBody');
            if (!tbody) return;
            tbody.innerHTML = configData.subjects.map(function(s, i) {
                return '<tr><td class="text-mono">' + s.code + '</td><td>' + s.name + '</td><td>' + (s.assetType || '-') + '</td><td><button class="btn btn-primary btn-sm" onclick="editSubject(' + i + ')">编辑</button> <button class="btn btn-danger btn-sm" onclick="deleteSubject(' + i + ')">删除</button></td></tr>';
            }).join('');
        }

        function openSubjectModal(editIndex) {
            currentEditSubjectIndex = (editIndex !== undefined) ? editIndex : null;
            document.getElementById('subjectModalTitle').textContent = (currentEditSubjectIndex !== null) ? '编辑财务科目' : '新增财务科目';
            if (currentEditSubjectIndex !== null) {
                var s = configData.subjects[currentEditSubjectIndex];
                document.getElementById('subjectCode').value = s.code;
                document.getElementById('subjectName').value = s.name;
                document.getElementById('subjectAssetType').value = s.assetType || '';
            } else {
                document.getElementById('subjectCode').value = '';
                document.getElementById('subjectName').value = '';
                document.getElementById('subjectAssetType').value = '';
            }
            document.getElementById('subjectModal').style.display = 'block';
        }

        function closeSubjectModal() {
            document.getElementById('subjectModal').style.display = 'none';
            currentEditSubjectIndex = null;
        }

        function saveSubject() {
            var code = document.getElementById('subjectCode').value;
            var name = document.getElementById('subjectName').value;
            var assetType = document.getElementById('subjectAssetType').value;
            if (!code || !name) { alert('请填写科目代码和科目名称'); return; }
            if (currentEditSubjectIndex !== null) {
                configData.subjects[currentEditSubjectIndex] = { code: code, name: name, assetType: assetType };
            } else {
                configData.subjects.push({ code: code, name: name, assetType: assetType });
            }
            closeSubjectModal();
            renderSubjectTable();
            showToast('保存成功');
        }

        function editSubject(index) { openSubjectModal(index); }

        function deleteSubject(index) {
            if (!confirm('确定要删除该科目吗？')) return;
            configData.subjects.splice(index, 1);
            renderSubjectTable();
            showToast('删除成功');
        }

        function renderAlertRuleTable() {
            var tbody = document.getElementById('alertRuleTableBody');
            if (!tbody) return;
            tbody.innerHTML = configData.alertRules.map(function(r, i) {
                return '<tr><td>' + r.type + '</td><td>' + r.threshold + '</td><td>' + r.notify.join('、') + '</td><td>' + r.notifyUser + '</td><td><button class="btn btn-primary btn-sm" onclick="editAlertRule(' + i + ')">编辑</button> <button class="btn btn-danger btn-sm" onclick="deleteAlertRule(' + i + ')">删除</button></td></tr>';
            }).join('');
        }

        function openAlertRuleModal(editIndex) {
            currentEditAlertRuleIndex = (editIndex !== undefined) ? editIndex : null;
            document.getElementById('alertRuleModalTitle').textContent = (currentEditAlertRuleIndex !== null) ? '编辑预警规则' : '新增预警规则';
            if (currentEditAlertRuleIndex !== null) {
                var r = configData.alertRules[currentEditAlertRuleIndex];
                document.getElementById('alertType').value = r.type;
                document.getElementById('alertThreshold').value = r.threshold;
                document.getElementById('alertNotifyWechat').checked = r.notify.indexOf('企微') >= 0;
                document.getElementById('alertNotifyEmail').checked = r.notify.indexOf('邮件') >= 0;
                document.getElementById('alertNotifySms').checked = r.notify.indexOf('短信') >= 0;
                document.getElementById('alertNotifyUser').value = r.notifyUser;
            } else {
                document.getElementById('alertType').value = '';
                document.getElementById('alertThreshold').value = '';
                document.getElementById('alertNotifyWechat').checked = true;
                document.getElementById('alertNotifyEmail').checked = false;
                document.getElementById('alertNotifySms').checked = false;
                document.getElementById('alertNotifyUser').value = '';
            }
            document.getElementById('alertRuleModal').style.display = 'block';
        }

        function closeAlertRuleModal() {
            document.getElementById('alertRuleModal').style.display = 'none';
            currentEditAlertRuleIndex = null;
        }

        function saveAlertRule() {
            var type = document.getElementById('alertType').value;
            var threshold = document.getElementById('alertThreshold').value;
            var notifyUser = document.getElementById('alertNotifyUser').value;
            if (!type || !threshold) { alert('请填写预警类型和阈值'); return; }
            var notify = [];
            if (document.getElementById('alertNotifyWechat').checked) notify.push('企微');
            if (document.getElementById('alertNotifyEmail').checked) notify.push('邮件');
            if (document.getElementById('alertNotifySms').checked) notify.push('短信');
            if (notify.length === 0) { alert('请选择至少一种通知方式'); return; }
            var rule = { type: type, threshold: threshold, notify: notify, notifyUser: notifyUser || '-' };
            if (currentEditAlertRuleIndex !== null) {
                configData.alertRules[currentEditAlertRuleIndex] = rule;
            } else {
                configData.alertRules.push(rule);
            }
            closeAlertRuleModal();
            renderAlertRuleTable();
            showToast('保存成功');
        }

        function editAlertRule(index) { openAlertRuleModal(index); }

        function deleteAlertRule(index) {
            if (!confirm('确定要删除该预警规则吗？')) return;
            configData.alertRules.splice(index, 1);
            renderAlertRuleTable();
            showToast('删除成功');
        }

        function getLogTypeClass(type) {
            var map = { '操作日志': 'log-type-operation', '系统运行日志': 'log-type-system', '邮件解析日志': 'log-type-email', 'NC推送日志': 'log-type-nc' };
            return map[type] || 'log-type-operation';
        }

        function renderLogTable() {
            var typeFilter = document.getElementById('logTypeFilter').value;
            var dateStart = document.getElementById('logDateStart').value;
            var dateEnd = document.getElementById('logDateEnd').value;
            var keyword = (document.getElementById('logKeyword').value || '').toLowerCase();
            var filtered = logData.filter(function(log) {
                var matchType = !typeFilter || log.type === typeFilter;
                var matchDateStart = !dateStart || log.time >= dateStart;
                var matchDateEnd = !dateEnd || log.time <= dateEnd + ' 23:59:59';
                var matchKeyword = !keyword || log.content.toLowerCase().indexOf(keyword) >= 0 || log.user.toLowerCase().indexOf(keyword) >= 0;
                return matchType && matchDateStart && matchDateEnd && matchKeyword;
            });
            var tbody = document.getElementById('logTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px;">暂无日志数据</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map(function(log) {
                var resultClass = log.result === '成功' ? 'status-active' : 'status-rejected';
                return '<tr><td class="text-mono">' + log.time + '</td><td><span class="log-type-badge ' + getLogTypeClass(log.type) + '">' + log.type + '</span></td><td>' + log.user + '</td><td>' + log.content + '</td><td class="text-mono">' + log.ip + '</td><td><span class="status-badge ' + resultClass + '">' + log.result + '</span></td></tr>';
            }).join('');
        }

        function exportLogs() {
            showToast('日志导出成功');
        }

        window.addEventListener('click', function(event) {
            ['subjectModal', 'alertRuleModal'].forEach(function(id) {
                if (event.target === document.getElementById(id)) document.getElementById(id).style.display = 'none';
            });
        });

        renderConfigCards();
        renderLogTable();
    </script>
</body>
</html>
