<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务核算 - 委外投资业务一体化订单管理平台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-bar { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 2px solid var(--border); }
        .tab-item { padding: 8px 20px; font-size: var(--font-size-sm); font-weight: 500; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
        .tab-item:hover { color: var(--primary); }
        .tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .filter-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; text-align: center; cursor: pointer; transition: all 0.15s; }
        .filter-card:hover { border-color: var(--primary); }
        .filter-card.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
        .filter-card .stat-label { font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: 2px; }
        .filter-card .stat-value { font-size: var(--font-size-lg); font-weight: 700; color: var(--text-primary); font-family: var(--font-mono); }
        .financial-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .push-stat { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
        .push-stat .push-stat-label { font-size: var(--font-size-xs); color: var(--text-muted); }
        .push-stat .push-stat-value { font-size: var(--font-size-xl); font-weight: 700; font-family: var(--font-mono); }
        .push-stat .push-stat-value.success { color: var(--success); }
        .push-stat .push-stat-value.fail { color: var(--danger); }
        .push-stat .push-stat-value.pending { color: var(--warning); }
        .voucher-row { display: grid; grid-template-columns: 2fr 2fr 2fr 1.5fr; gap: 8px; margin-bottom: 6px; padding: 6px 0; border-bottom: 1px solid var(--border-light); }
        .voucher-row:last-child { border-bottom: none; }
        .account-select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--font-size-xs); background: var(--surface); color: var(--text-primary); }
        .account-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
    </style>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar"></nav>
        <div class="main-area">
            <div class="topbar"></div>
            <div class="content">
                <div class="page-header">
                    <div class="page-header-left">
                        <span class="page-title">财务核算</span>
                        <span class="page-subtitle">Financial Accounting</span>
                    </div>
                </div>

                <div class="tab-bar">
                    <div class="tab-item active" onclick="switchTab('voucher')">凭证列表</div>
                    <div class="tab-item" onclick="switchTab('dividend')">兑息兑付流程</div>
                    <div class="tab-item" onclick="switchTab('push')">NC推送记录</div>
                </div>

                <div id="tab-voucher" class="tab-content active">
                    <div class="stats-row" id="voucherStats"></div>
                    <div class="card">
                        <div class="card-body">
                            <div class="search-bar">
                                <button class="btn btn-primary" id="btnCreateVoucher" onclick="openCreateVoucherModal()">+ 创建凭证</button>
                                <select class="search-input" id="typeFilter" style="flex:0 0 140px;" onchange="renderVoucherTable()">
                                    <option value="">全部类型</option>
                                    <option value="兑息兑付">兑息兑付</option>
                                    <option value="公允价值变更">公允价值变更</option>
                                    <option value="申购">申购</option>
                                    <option value="赎回">赎回</option>
                                    <option value="内部往来">内部往来</option>
                                </select>
                                <select class="search-input" id="statusFilter" style="flex:0 0 130px;" onchange="renderVoucherTable()">
                                    <option value="">全部状态</option>
                                    <option value="待确认">待确认</option>
                                    <option value="已确认">已确认</option>
                                    <option value="已推送NC">已推送NC</option>
                                </select>
                                <input type="text" placeholder="搜索产品名称或编号" class="search-input" id="searchInput" onkeyup="if(event.key==='Enter')renderVoucherTable()">
                                <button class="btn btn-primary btn-sm" onclick="renderVoucherTable()">查询</button>
                                <button class="btn btn-ghost btn-sm" onclick="resetVoucherFilters()">重置</button>
                            </div>
                        </div>
                        <div class="card-body-p0">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>记录编号</th>
                                        <th>产品名称</th>
                                        <th>变更类型</th>
                                        <th>关联交易</th>
                                        <th>变更日期</th>
                                        <th>变更金额</th>
                                        <th>凭证状态</th>
                                        <th>凭证编号</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="voucherTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="tab-dividend" class="tab-content">
                    <div class="stats-row" id="dividendStats"></div>
                    <div class="card">
                        <div class="card-body">
                            <div class="search-bar">
                                <select class="search-input" id="divStatusFilter" style="flex:0 0 150px;" onchange="renderDividendTable()">
                                    <option value="">全部状态</option>
                                    <option value="待交易员确认">待交易员确认</option>
                                    <option value="交易员已确认">交易员已确认</option>
                                    <option value="已完成">已完成</option>
                                    <option value="已驳回">已驳回</option>
                                </select>
                                <select class="search-input" id="divTypeFilter" style="flex:0 0 130px; display:none;" onchange="renderDividendTable()">
                                </select>
                                <input type="text" placeholder="搜索产品名称或流程编号" class="search-input" id="divSearchInput" onkeyup="if(event.key==='Enter')renderDividendTable()">
                                <button class="btn btn-primary btn-sm" onclick="renderDividendTable()">查询</button>
                                <button class="btn btn-ghost btn-sm" onclick="resetDividendFilters()">重置</button>
                            </div>
                        </div>
                        <div class="card-body-p0">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>流程编号</th>
                                        <th>产品名称</th>
                                        <th>每百元应付利息(元)</th>
                                        <th>每百元应付本金(元)</th>
                                        <th>兑付日期</th>
                                        <th>发起人</th>
                                        <th>当前状态</th>
                                        <th>凭证编号</th>
                                        <th>iBor推送</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="dividendTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="tab-push" class="tab-content">
                    <div class="stats-row" id="pushStats" style="margin-bottom:14px;"></div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">推送记录</span>
                        </div>
                        <div class="card-body-p0">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>凭证编号</th>
                                        <th>产品</th>
                                        <th>推送时间</th>
                                        <th>推送状态</th>
                                        <th>NC响应</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="pushTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="createVoucherModal" class="modal">
        <div class="modal-content" style="width:680px;">
            <div class="modal-header">
                <h3 id="createVoucherTitle">创建凭证</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeCreateVoucherModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>关联交易（可选）</label>
                    <select id="cvTradeId" onchange="onTradeSelectForVoucher()">
                        <option value="">请选择已成交交易（选填）</option>
                    </select>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>关联产品 *</label>
                        <select id="cvProduct">
                            <option value="">请选择产品</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>变更类型 *</label>
                        <select id="cvChangeType" onchange="autoFillAccounts()">
                            <option value="">请选择变更类型</option>
                            <option value="兑息兑付">兑息兑付</option>
                            <option value="公允价值变更">公允价值变更</option>
                            <option value="申购">申购</option>
                            <option value="赎回">赎回</option>
                            <option value="内部往来">内部往来</option>
                        </select>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>变更日期 *</label>
                        <input type="date" id="cvChangeDate">
                    </div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>来源系统 *</label>
                        <select id="cvSourceSystem">
                            <option value="OMS">OMS</option>
                            <option value="邮件解析">邮件解析</option>
                            <option value="手动录入">手动录入</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>核算单位 *</label>
                        <select id="cvAccountingUnit">
                            <option value="总公司">总公司</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>币种 *</label>
                        <select id="cvCurrency">
                            <option value="CNY">CNY（人民币）</option>
                            <option value="USD">USD（美元）</option>
                        </select>
                    </div>
                </div>
                <div class="detail-section-title" style="margin-top:8px;">会计分录</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>借方科目 *</label>
                        <select id="cvDebitAccount" class="account-select">
                            <option value="">请选择借方科目</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>贷方科目 *</label>
                        <select id="cvCreditAccount" class="account-select">
                            <option value="">请选择贷方科目</option>
                        </select>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>借方本币(元) *</label>
                        <input type="number" id="cvDebitAmount" placeholder="请输入借方本币" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>贷方本币(元) *</label>
                        <input type="number" id="cvCreditAmount" placeholder="请输入贷方本币" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label>摘要</label>
                    <input type="text" id="cvSummary" placeholder="请输入凭证摘要">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeCreateVoucherModal()">取消</button>
                <button class="btn btn-primary" onclick="saveVoucher()">保存</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content" style="width:750px;">
            <div class="modal-header">
                <h3 id="detailModalTitle">凭证详情</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
            <div class="modal-footer" id="detailModalFooter"></div>
        </div>
    </div>

    <div id="xmlModal" class="modal">
        <div class="modal-content" style="width:800px;">
            <div class="modal-header">
                <h3>XML格式预览</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeXmlModal()">✕</button>
            </div>
            <div class="modal-body">
                <div id="xmlPreviewContent" class="xml-preview"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeXmlModal()">关闭</button>
                <button class="btn btn-nc" id="pushNcFromXmlBtn" onclick="pushToNCFromXml()">推送NC</button>
            </div>
        </div>
    </div>

    <div id="dividendModal" class="modal">
        <div class="modal-content" style="width:680px;">
            <div class="modal-header">
                <h3 id="dividendDetailTitle">兑息兑付流程详情</h3>
                <button class="btn btn-ghost btn-sm" onclick="closeDividendModal()">✕</button>
            </div>
            <div class="modal-body" id="dividendDetailBody"></div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeDividendModal()">关闭</button>
            </div>
        </div>
    </div>

        function renderVoucherStats() {
            var pending = 0, confirmed = 0, dividend = 0, pushed = 0;
            FIN_RECORDS.forEach(function(r) {
                if (r.voucherStatus === '待确认') pending++;
                if (r.voucherStatus === '已确认') confirmed++;

        function getRecordTradeId(r) {
            if (r.tradeId) return r.tradeId;
            if (r.source === '交易确认') {
                var matched = TRADES.find(function(t) {
                    return t.productId === r.productId && t.status === '已成交';
                });
                return matched ? matched.id : '';
            }
            return '';
        }

        function renderVoucherTable() {
            var keyword = document.getElementById('searchInput').value.toLowerCase();
            var typeVal = document.getElementById('typeFilter').value;
            var statusVal = document.getElementById('statusFilter').value;
            var filtered = FIN_RECORDS.filter(function(r) {
                var matchKeyword = !keyword || r.id.toLowerCase().indexOf(keyword) >= 0 || r.productName.toLowerCase().indexOf(keyword) >= 0 || r.productId.toLowerCase().indexOf(keyword) >= 0;
                var matchType = !typeVal || r.changeType === typeVal;
                var matchStatus = !statusVal || r.voucherStatus === statusVal;
                return matchKeyword && matchType && matchStatus;
            });
            var tbody = document.getElementById('voucherTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:40px;">暂无记录</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map(function(r) {
                var amountStr = r.changeAmount < 0
                    ? '<span class="text-danger text-mono">' + formatMoney(r.changeAmount) + '</span>'
                    : '<span class="text-mono">' + formatMoney(r.changeAmount) + '</span>';
                var tradeId = getRecordTradeId(r);
                var tradeCell = tradeId
                    ? '<span class="text-mono" style="font-size:var(--font-size-xs);color:var(--primary);">' + tradeId + '</span>'
                    : '<span style="color:var(--text-muted);">-</span>';
                var actionHtml = '';
                if (r.voucherStatus === '待确认' && !_isReadOnly) {
                    actionHtml = '<button class="btn btn-info btn-sm" onclick="openEditVoucher(\'' + r.id + '\')">编辑</button> ';
                    if (_canConfirmVoucher) {
                        actionHtml += '<button class="btn btn-success btn-sm" onclick="confirmVoucher(\'' + r.id + '\')">确认</button> ';
                    }
                    actionHtml += '<button class="btn btn-ghost btn-sm" onclick="openDetailModal(\'' + r.id + '\')">查看</button>';
                } else if (r.voucherStatus === '已确认' && !_isReadOnly) {
                    actionHtml = '<button class="btn btn-xml btn-sm" onclick="previewXml(\'' + r.id + '\')">预览XML</button> ';
                    if (_canPushNC) {
                        actionHtml += '<button class="btn btn-nc btn-sm" onclick="pushToNC(\'' + r.id + '\')">推送NC</button> ';
                    }
                    actionHtml += '<button class="btn btn-ghost btn-sm" onclick="openDetailModal(\'' + r.id + '\')">查看</button>';
                } else {
                    actionHtml = '<button class="btn btn-ghost btn-sm" onclick="openDetailModal(\'' + r.id + '\')">查看</button>';
                }
                return '<tr>'
                    + '<td class="text-mono" style="font-size:var(--font-size-xs);">' + r.id + '</td>'
                    + '<td style="font-weight:500;color:var(--primary);">' + r.productName + '</td>'
                    + '<td><span class="type-badge ' + getChangeTypeClass(r.changeType) + '">' + r.changeType + '</span></td>'
                    + '<td>' + tradeCell + '</td>'
                    + '<td>' + r.changeDate + '</td>'
                    + '<td>' + amountStr + '</td>'

        function onTradeSelectForVoucher() {
            var tradeId = document.getElementById('cvTradeId').value;
            if (!tradeId) return;
            var trade = TRADES.find(function(t) { return t.id === tradeId; });
            if (!trade) return;
            // 若产品下拉中不存在该交易对应的产品，则动态追加选项
            var productSelect = document.getElementById('cvProduct');
            var exists = false;
            for (var i = 0; i < productSelect.options.length; i++) {
                if (productSelect.options[i].value === trade.productId) { exists = true; break; }
            }
            if (!exists) {
                var opt = document.createElement('option');
                opt.value = trade.productId;
                opt.text = trade.productId + ' ' + trade.productName;
                productSelect.appendChild(opt);
            }
            productSelect.value = trade.productId;
            document.getElementById('cvChangeType').value = trade.type === '赎回' ? '赎回' : '申购';
            document.getElementById('cvChangeDate').value = trade.traderConfirmTime ? trade.traderConfirmTime.slice(0, 10) : '';
            var amount = trade.actualDealAmount || trade.dealAmount || 0;
            document.getElementById('cvDebitAmount').value = amount;
            document.getElementById('cvCreditAmount').value = amount;
            autoFillAccounts();
        }

        function autoFillAccounts() {
            var type = document.getElementById('cvChangeType').value;
            if (type && ACCOUNT_MAP[type]) {

                document.getElementById('cvCreditAccount').value = ACCOUNT_MAP[type].credit;
            }

        function saveVoucher() {
            var product = document.getElementById('cvProduct').value;
            var changeType = document.getElementById('cvChangeType').value;
            var changeDate = document.getElementById('cvChangeDate').value;
            var sourceSystem = document.getElementById('cvSourceSystem').value;
            var accountingUnit = document.getElementById('cvAccountingUnit').value;
            var currency = document.getElementById('cvCurrency').value;
            var debitAccount = document.getElementById('cvDebitAccount').value;
            var creditAccount = document.getElementById('cvCreditAccount').value;
            var debitAmount = document.getElementById('cvDebitAmount').value;
            var creditAmount = document.getElementById('cvCreditAmount').value;
            var summary = document.getElementById('cvSummary').value;
            var tradeId = document.getElementById('cvTradeId').value;
            var trade = tradeId ? TRADES.find(function(t) { return t.id === tradeId; }) : null;
            if (!product || !changeType || !changeDate) {
                alert('请填写产品、变更类型和变更日期');
                return;
            }
            if (!debitAccount || !creditAccount || !debitAmount || !creditAmount) {
                alert('请填写完整的借方科目、贷方科目和金额');
                return;
            }
            var p = FIN_PRODUCTS.find(function(x) { return x.id === product; });
            // 若产品不在 FIN_PRODUCTS 中但来自关联交易，则使用交易的产品名称
            var productName = p ? p.name : (trade ? trade.productName : '');
            if (currentEditRecordId) {
                var r = FIN_RECORDS.find(function(x) { return x.id === currentEditRecordId; });
                if (r) {
                    r.productId = product;
                    r.productName = productName;
                    r.changeType = changeType;
                    r.changeDate = changeDate;
                    r.changeAmount = (parseFloat(debitAmount) || parseFloat(creditAmount) || 0);
                    r.tradeId = tradeId || '';
                    var v = FIN_VOUCHERS.find(function(x) { return x.id === r.voucherId; });
                    if (v) {
                        v.debitAccount = debitAccount;
                        v.creditAccount = creditAccount;
                        v.debitAmount = parseFloat(debitAmount);
                        v.creditAmount = parseFloat(creditAmount);
                        v.sourceSystem = sourceSystem;
                        v.accountingUnit = accountingUnit;
                        v.currency = currency;
                        if (summary) v.summary = summary;
                    }
                }
                alert('凭证已更新');
            } else {
                var today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                var seq = String(FIN_RECORDS.filter(function(x) { return x.id.indexOf('FR' + today) === 0; }).length + 1).padStart(3, '0');
                var newId = 'FR' + today + seq;
                var vSeq = String(FIN_VOUCHERS.length + 1).padStart(3, '0');
                var newVid = 'VCH' + today + vSeq;
                FIN_RECORDS.push({
                    id: newId,
                    productId: product,
                    productName: productName,
                    changeType: changeType,
                    changeDate: changeDate,
                    changeAmount: (parseFloat(debitAmount) || parseFloat(creditAmount) || 0),
                    voucherStatus: '待确认',
                    createMethod: '手动创建',
                    source: tradeId ? '交易确认' : '手动录入',
                    voucherId: newVid,
                    tradeId: tradeId || ''
                });
                FIN_VOUCHERS.push({
                    id: newVid,
                    summary: summary || (productName + changeType),
                    debitAccount: debitAccount,
                    creditAccount: creditAccount,
                    debitAmount: parseFloat(debitAmount),
                    creditAmount: parseFloat(creditAmount),
                    sourceSystem: sourceSystem,
                    accountingUnit: accountingUnit,
                    currency: currency,
                    maker: getCurrentRole().label,
                    makeTime: new Date().toISOString().slice(0, 16).replace('T', ' ')
                });
                alert('凭证已创建，编号: ' + newId);
            }
            closeCreateVoucherModal();
            renderVoucherStats();
            renderVoucherTable();
        }

        function confirmVoucher(recordId) {
            var r = FIN_RECORDS.find(function(x) { return x.id === recordId; });
            if (!r) return;
            if (!r.voucherId) {
                var today = r.changeDate.replace(/-/g, '');
                var seq = String(FIN_VOUCHERS.length + 1).padStart(3, '0');
                r.voucherId = 'VCH' + today + seq;
                FIN_VOUCHERS.push({
                    id: r.voucherId,
                    summary: r.productName + r.changeType,
                    debitAccount: ACCOUNT_MAP[r.changeType] ? ACCOUNT_MAP[r.changeType].debit : '',
                    creditAccount: ACCOUNT_MAP[r.changeType] ? ACCOUNT_MAP[r.changeType].credit : '',
                    debitAmount: Math.abs(r.changeAmount),
                    creditAmount: Math.abs(r.changeAmount),
                    sourceSystem: 'OMS',
                    accountingUnit: '总公司',
                    currency: 'CNY',
                    maker: '系统',
                    makeTime: r.changeDate + ' 17:30'
                });
            }
            r.voucherStatus = '已确认';
            alert('凭证已确认');
            renderVoucherStats();
            renderVoucherTable();
        }

                body += '<table class="data-table" style="margin-top:12px;">';
                body += '<thead><tr><th>摘要</th><th>会计科目</th><th>借方本币</th><th>贷方本币</th></tr></thead>';
                body += '<tbody>';
                body += '<tr>';
                body += '<td>' + v.summary + '</td>';
                body += '<td style="font-size:var(--font-size-xs);">' + v.debitAccount + '</td>';
                body += '<td class="text-mono">' + (v.debitAmount > 0 ? formatMoneyFull(v.debitAmount) : '-') + '</td>';
                body += '<td class="text-mono">-</td>';
                body += '</tr>';
                body += '<tr>';
                body += '<td>' + v.summary + '</td>';
                body += '<td style="font-size:var(--font-size-xs);">' + v.creditAccount + '</td>';
                body += '<td class="text-mono">-</td>';
                body += '<td class="text-mono">' + (v.creditAmount > 0 ? formatMoneyFull(v.creditAmount) : '-') + '</td>';
                body += '</tr>';
                body += '<tr style="font-weight:bold;background:var(--info-bg);">';
                body += '<td>合计</td>';
                body += '<td></td>';
                body += '<td class="text-mono">' + (v.debitAmount > 0 ? formatMoneyFull(v.debitAmount) : '-') + '</td>';
                body += '<td class="text-mono">' + (v.creditAmount > 0 ? formatMoneyFull(v.creditAmount) : '-') + '</td>';
                body += '</tr>';
                body += '<tr><td colspan="4" style="text-align:right;color:var(--text-secondary);">附单据：0张</td></tr>';
                body += '</tbody></table>';
            } else {
                body += '<div style="text-align:center;color:var(--text-muted);padding:20px;">暂无凭证信息，请先确认凭证</div>';
            }

            document.getElementById('detailModalBody').innerHTML = body;

            var footer = '';
            if (r.voucherStatus === '待确认' && !_isReadOnly) {
                footer = '<button class="btn btn-ghost" onclick="closeDetailModal()">关闭</button>';
                footer += '<button class="btn btn-info" onclick="closeDetailModal();openEditVoucher(\'' + r.id + '\')">编辑</button>';
                if (_canConfirmVoucher) {
                    footer += '<button class="btn btn-primary" onclick="confirmVoucher(\'' + r.id + '\');closeDetailModal()">确认凭证</button>';
                }
            } else if (r.voucherStatus === '已确认' && !_isReadOnly) {
                footer = '<button class="btn btn-ghost" onclick="closeDetailModal()">关闭</button>';
                footer += '<button class="btn btn-xml" onclick="closeDetailModal();previewXml(\'' + r.id + '\')">预览XML</button>';
                if (_canPushNC) {
                    footer += '<button class="btn btn-nc" onclick="pushToNC(\'' + r.id + '\');closeDetailModal()">推送NC</button>';
                }
            } else {
                footer = '<button class="btn btn-ghost" onclick="closeDetailModal()">关闭</button>';
                footer += '<button class="btn btn-info" onclick="closeDetailModal();switchTab(\'push\')">查看推送记录</button>';
            }
            document.getElementById('detailModalFooter').innerHTML = footer;
            document.getElementById('detailModal').style.display = 'block';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function previewXml(recordId) {
            var r = FIN_RECORDS.find(function(x) { return x.id === recordId; });
            if (!r) return;
            currentDetailRecordId = recordId;
            var v = FIN_VOUCHERS.find(function(x) { return x.id === r.voucherId; });
            var now = new Date().toISOString().slice(0, 19).replace('T', ' ');
            var xml = '';
            xml += '&lt;?xml version="1.0" encoding="UTF-8"?&gt;\n';
            xml += '&lt;ufinterface system="OMS" billtype="voucher"&gt;\n';
            xml += '  &lt;voucher&gt;\n';
            xml += '    &lt;voucherHead&gt;\n';
            if (v) {
                xml += '      &lt;voucherId&gt;' + v.id + '&lt;/voucherId&gt;\n';
                xml += '      &lt;voucherDate&gt;' + r.changeDate + '&lt;/voucherDate&gt;\n';
                xml += '      &lt;prepareDate&gt;' + v.makeTime + '&lt;/prepareDate&gt;\n';
                xml += '      &lt;maker&gt;' + v.maker + '&lt;/maker&gt;\n';
            }
            xml += '      &lt;attachment&gt;0&lt;/attachment&gt;\n';
            xml += '    &lt;/voucherHead&gt;\n';
            xml += '    &lt;voucherEntries&gt;\n';
            if (v) {
                xml += '      &lt;entry&gt;\n';
                xml += '        &lt;summary&gt;' + v.summary + '&lt;/summary&gt;\n';
                xml += '        &lt;accountCode&gt;' + v.debitAccount.split('-')[0] + '&lt;/accountCode&gt;\n';
                xml += '        &lt;accountName&gt;' + (v.debitAccount.split('-')[1] || '') + '&lt;/accountName&gt;\n';
                xml += '        &lt;debitAmount&gt;' + v.debitAmount.toFixed(2) + '&lt;/debitAmount&gt;\n';
                xml += '        &lt;creditAmount&gt;0.00&lt;/creditAmount&gt;\n';
                xml += '      &lt;/entry&gt;\n';
                xml += '      &lt;entry&gt;\n';
                xml += '        &lt;summary&gt;' + v.summary + '&lt;/summary&gt;\n';
                xml += '        &lt;accountCode&gt;' + v.creditAccount.split('-')[0] + '&lt;/accountCode&gt;\n';
                xml += '        &lt;accountName&gt;' + (v.creditAccount.split('-')[1] || '') + '&lt;/accountName&gt;\n';
                xml += '        &lt;debitAmount&gt;0.00&lt;/debitAmount&gt;\n';
                xml += '        &lt;creditAmount&gt;' + v.creditAmount.toFixed(2) + '&lt;/creditAmount&gt;\n';
                xml += '      &lt;/entry&gt;\n';
            }
            xml += '    &lt;/voucherEntries&gt;\n';
            xml += '    &lt;productInfo&gt;\n';
            xml += '      &lt;productId&gt;' + r.productId + '&lt;/productId&gt;\n';
            xml += '      &lt;productName&gt;' + r.productName + '&lt;/productName&gt;\n';
            xml += '      &lt;changeType&gt;' + r.changeType + '&lt;/changeType&gt;\n';
            xml += '      &lt;changeDate&gt;' + r.changeDate + '&lt;/changeDate&gt;\n';
            xml += '      &lt;changeAmount&gt;' + r.changeAmount.toFixed(2) + '&lt;/changeAmount&gt;\n';
            xml += '    &lt;/productInfo&gt;\n';
            xml += '    &lt;pushInfo&gt;\n';
            xml += '      &lt;pushTime&gt;' + now + '&lt;/pushTime&gt;\n';
            xml += '      &lt;operator&gt;' + getCurrentRole().label + '&lt;/operator&gt;\n';
            xml += '      &lt;targetSystem&gt;NC财务系统&lt;/targetSystem&gt;\n';
            xml += '    &lt;/pushInfo&gt;\n';
            xml += '  &lt;/voucher&gt;\n';
            xml += '&lt;/ufinterface&gt;';
            document.getElementById('xmlPreviewContent').innerHTML = xml;
            document.getElementById('pushNcFromXmlBtn').style.display = r.voucherStatus === '已推送NC' ? 'none' : 'inline-flex';
            document.getElementById('xmlModal').style.display = 'block';
        }

        function closeXmlModal() {
            document.getElementById('xmlModal').style.display = 'none';
        }

        function pushToNC(recordId) {
            var r = FIN_RECORDS.find(function(x) { return x.id === recordId; });
            if (!r) return;
            if (r.voucherStatus !== '已确认') {
                alert('只有已确认状态的凭证才能推送NC');
                return;
            }
            if (!confirm('确认推送凭证 ' + r.voucherId + ' 至NC财务系统？')) return;
            r.voucherStatus = '已推送NC';
            PUSH_RECORDS.unshift({
                voucherId: r.voucherId,
                productName: r.productName,
                pushTime: new Date().toISOString().slice(0, 19).replace('T', ' '),
                status: '成功',
                response: '200 OK - 凭证已入账',
                recordId: r.id
            });
            alert('凭证已成功推送至NC财务系统！');
            renderVoucherStats();
            renderVoucherTable();
            renderPushStats();
            renderPushTable();
        }

        function pushToNCFromXml() {
            if (!currentDetailRecordId) return;
            closeXmlModal();
            pushToNC(currentDetailRecordId);
        }

        function retryPush(voucherId) {
            var p = PUSH_RECORDS.find(function(x) { return x.voucherId === voucherId; });
            if (!p) return;
            if (!confirm('确认重新推送凭证 ' + voucherId + '？')) return;
            p.status = '成功';
            p.pushTime = new Date().toISOString().slice(0, 19).replace('T', ' ');
            p.response = '200 OK - 凭证已入账';
            var r = FIN_RECORDS.find(function(x) { return x.voucherId === voucherId; });
            if (r && r.voucherStatus !== '已推送NC') {
                r.voucherStatus = '已推送NC';
                renderVoucherStats();
                renderVoucherTable();
            }
            alert('推送成功！');
            renderPushStats();
            renderPushTable();
        }

        function viewPushDetail(voucherId) {
            var p = PUSH_RECORDS.find(function(x) { return x.voucherId === voucherId; });
            if (!p) { alert('未找到推送记录'); return; }
            var r = FIN_RECORDS.find(function(x) { return x.voucherId === voucherId; });
            var v = FIN_VOUCHERS.find(function(x) { return x.id === voucherId; });
            document.getElementById('detailModalTitle').textContent = '推送详情 - ' + voucherId;
            var body = '<div class="detail-info-grid" style="grid-template-columns:1fr 1fr;">';
            body += '<div class="detail-info-item"><div class="info-label">凭证编号</div><div class="info-value text-mono">' + p.voucherId + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">产品</div><div class="info-value">' + p.productName + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">推送时间</div><div class="info-value">' + (p.pushTime || '-') + '</div></div>';
            body += '<div class="detail-info-item"><div class="info-label">推送状态</div><div class="info-value"><span class="status-badge ' + (p.status === '成功' ? 'status-approved' : p.status === '失败' ? 'status-rejected' : 'status-pending') + '">' + p.status + '</span></div></div>';
            body += '<div class="detail-info-item"><div class="info-label">NC响应</div><div class="info-value" style="font-size:var(--font-size-xs);">' + p.response + '</div></div>';
            if (v) {
                body += '<div class="detail-info-item"><div class="info-label">凭证摘要</div><div class="info-value">' + v.summary + '</div></div>';
            }
            body += '</div>';
            if (v) {
                body += '<div class="detail-section-title" style="margin-top:14px;">凭证分录</div>';
                body += '<table class="data-table">';
                body += '<thead><tr><th>摘要</th><th>会计科目</th><th>借方本币</th><th>贷方本币</th></tr></thead>';
                body += '<tbody>';
                body += '<tr><td>' + v.summary + '</td><td style="font-size:var(--font-size-xs);">' + v.debitAccount + '</td><td class="text-mono">' + (v.debitAmount > 0 ? formatMoneyFull(v.debitAmount) : '-') + '</td><td class="text-mono">-</td></tr>';
                body += '<tr><td>' + v.summary + '</td><td style="font-size:var(--font-size-xs);">' + v.creditAccount + '</td><td class="text-mono">-</td><td class="text-mono">' + (v.creditAmount > 0 ? formatMoneyFull(v.creditAmount) : '-') + '</td></tr>';
                body += '<tr style="font-weight:bold;background:var(--info-bg);"><td>合计</td><td></td><td class="text-mono">' + (v.debitAmount > 0 ? formatMoneyFull(v.debitAmount) : '-') + '</td><td class="text-mono">' + (v.creditAmount > 0 ? formatMoneyFull(v.creditAmount) : '-') + '</td></tr>';
                body += '<tr><td colspan="4" style="text-align:right;color:var(--text-secondary);">附单据：0张</td></tr>';
                body += '</tbody></table>';
            }
            document.getElementById('detailModalBody').innerHTML = body;
            document.getElementById('detailModalFooter').innerHTML = '<button class="btn btn-ghost" onclick="closeDetailModal()">关闭</button>';
            document.getElementById('detailModal').style.display = 'block';
        }

        function renderDividendTable() {
            var statusVal = document.getElementById('divStatusFilter').value;
            var search = (document.getElementById('divSearchInput').value || '').toLowerCase();
            var list = DIVIDENDS.filter(function(d) {
                if (statusVal && d.status !== statusVal) return false;
                if (search) {
                    var hay = (d.id + d.productName + d.initiator).toLowerCase();
                    if (hay.indexOf(search) < 0) return false;
                }
                return true;
            });
            // 按创建时间倒序
            list.sort(function(a, b) { return b.createTime > a.createTime ? 1 : -1; });

            var tbody = document.getElementById('dividendTableBody');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-muted);padding:30px;">暂无兑息兑付流程记录</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(function(d) {
                var statusClass = d.status === '已完成' ? 'success' : d.status === '已驳回' ? 'danger' : 'info';
                var voucherCell = d.voucherId || '-';
                var pushCell = d.pushIborStatus === '已推送' ? '<span class="status-badge success">已推送</span>' :
                               d.pushIborStatus === '推送失败' ? '<span class="status-badge danger">推送失败</span>' :
                               '<span class="status-badge warning">未推送</span>';
                var actions = '<button class="btn btn-info btn-sm" onclick="viewDividendDetail(\'' + d.id + '\')">查看详情</button>';
                // 已完成且未推送的，可以推送iBor（仅财务人员/demo）
                if (d.status === '已完成' && d.pushIborStatus !== '已推送' && (!_isReadOnly)) {
                    actions += ' <button class="btn btn-primary btn-sm" onclick="pushDividendToIbor(\'' + d.id + '\')">推送iBor</button>';
                }
                return '<tr>' +
                    '<td class="text-mono">' + d.id + '</td>' +
                    '<td>' + d.productName + '</td>' +
                    '<td class="text-mono">' + d.interestPer100.toFixed(4) + '</td>' +
                    '<td class="text-mono">' + d.principalPer100.toFixed(4) + '</td>' +
                    '<td class="text-mono">' + d.divDate + '</td>' +
                    '<td>' + d.initiator + '</td>' +
                    '<td><span class="status-badge ' + statusClass + '">' + d.status + '</span></td>' +
                    '<td class="text-mono">' + voucherCell + '</td>' +
                    '<td>' + pushCell + '</td>' +
                    '<td>' + actions + '</td>' +
                    '</tr>';
            }).join('');
        }

        function renderDividendStats() {
            var pending = 0, completed = 0, rejected = 0, totalAmount = 0;
            DIVIDENDS.forEach(function(d) {
                if (d.status === '待交易员确认' || d.status === '交易员已确认') pending++;
                if (d.status === '已完成') { completed++; totalAmount += (d.interestPer100 + d.principalPer100); }
                if (d.status === '已驳回') rejected++;
            });
            var html = '<div class="stat-card"><div class="stat-icon blue">💵</div><div class="stat-info"><div class="stat-label">进行中</div><div class="stat-value">' + pending + '</div></div></div>';
            html += '<div class="stat-card"><div class="stat-icon green">✓</div><div class="stat-info"><div class="stat-label">已完成</div><div class="stat-value">' + completed + '</div></div></div>';
            html += '<div class="stat-card"><div class="stat-icon red">✗</div><div class="stat-info"><div class="stat-label">已驳回</div><div class="stat-value">' + rejected + '</div></div></div>';
            html += '<div class="stat-card"><div class="stat-icon yellow">¥</div><div class="stat-info"><div class="stat-label">已完成金额(每百元)</div><div class="stat-value">' + totalAmount.toFixed(4) + '</div></div></div>';
            document.getElementById('dividendStats').innerHTML = html;
        }

        function viewDividendDetail(dividendId) {
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var statusClass = d.status === '已完成' ? 'success' : d.status === '已驳回' ? 'danger' : 'info';
            var html = '<div class="detail-section-title">基本信息</div>';
            html += '<div class="detail-info-grid">';
            html += '<div><label>流程编号</label><div class="text-mono">' + d.id + '</div></div>';
            html += '<div><label>产品名称</label><div>' + d.productName + '</div></div>';
            html += '<div><label>产品内部编码</label><div class="text-mono">' + (d.innerCode || '-') + '</div></div>';
            html += '<div><label>产品外部编码</label><div class="text-mono">' + (d.externalCode || '-') + '</div></div>';
            html += '<div><label>兑付日期</label><div class="text-mono">' + d.divDate + '</div></div>';
            html += '<div><label>每百元应付利息</label><div class="text-mono">' + d.interestPer100.toFixed(4) + ' 元</div></div>';
            html += '<div><label>每百元应付本金</label><div class="text-mono">' + d.principalPer100.toFixed(4) + ' 元</div></div>';
            html += '<div><label>发起人</label><div>' + d.initiator + '</div></div>';
            html += '<div><label>当前状态</label><div><span class="status-badge ' + statusClass + '">' + d.status + '</span></div></div>';
            html += '<div><label>创建时间</label><div class="text-mono">' + d.createTime + '</div></div>';
            html += '<div><label>凭证编号</label><div class="text-mono">' + (d.voucherId || '-') + '</div></div>';
            html += '<div><label>iBor推送</label><div>' + (d.pushIborStatus === '已推送' ? '已推送 (' + d.pushIborTime + ')' : d.pushIborStatus) + '</div></div>';
            html += '</div>';
            if (d.remark) {
                html += '<div class="detail-section-title">备注</div><div>' + d.remark + '</div>';
            }
            // 时间线
            html += '<div class="detail-section-title">流程时间线</div>';
            html += '<div class="timeline">';
            d.history.forEach(function(h, idx) {
                var dotClass = 'completed';
                if (h.action.indexOf('驳回') >= 0) dotClass = 'rejected';
                else if (idx === d.history.length - 1 && d.status !== '已完成' && d.status !== '已驳回') dotClass = 'current';
                html += '<div class="timeline-item">';
                html += '<div class="timeline-dot ' + dotClass + '"></div>';
                html += '<div class="timeline-title">' + h.action + '</div>';
                html += '<div class="timeline-user">' + h.user + '</div>';
                html += '<div class="timeline-time">' + h.time + '</div>';
                if (h.remark) html += '<div class="timeline-reason">' + h.remark + '</div>';
                html += '</div>';
            });
            html += '</div>';

            // 写入弹窗
            document.getElementById('dividendDetailBody').innerHTML = html;
            document.getElementById('dividendDetailTitle').textContent = '兑息兑付流程详情 - ' + d.id;
            document.getElementById('dividendModal').style.display = 'block';
        }

        function pushDividendToIbor(dividendId) {
            if (!confirm('确认将该兑息兑付记录推送到iBor系统？')) return;
            var d = DIVIDENDS.find(function(x) { return x.id === dividendId; });
            if (!d) return;
            var role = getCurrentRole();
            var now = new Date();
            var nowStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            d.pushIborStatus = '已推送';
            d.pushIborTime = nowStr;
            d.history.push({ user: role.label, action: '推送iBor', time: nowStr, remark: '推送成功' });
            renderDividendTable();
            renderDividendStats();
            alert('已成功推送到iBor系统！\n推送时间：' + nowStr);
        }

        function resetDividendFilters() {
            document.getElementById('divStatusFilter').value = '';
            document.getElementById('divTypeFilter').value = '';
            document.getElementById('divSearchInput').value = '';
            renderDividendTable();
        }

        function closeDividendModal() {
            document.getElementById('dividendModal').style.display = 'none';
        }

        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('createVoucherModal')) closeCreateVoucherModal();
            if (event.target === document.getElementById('detailModal')) closeDetailModal();
            if (event.target === document.getElementById('xmlModal')) closeXmlModal();
            if (event.target === document.getElementById('dividendModal')) closeDividendModal();
        });

        if (_isReadOnly) {
            var btnCreate = document.getElementById('btnCreateVoucher');
            if (btnCreate) btnCreate.style.display = 'none';
        }
        renderVoucherStats();
        renderVoucherTable();
        renderPushStats();
        renderPushTable();
    </script>
</body>
</html>
